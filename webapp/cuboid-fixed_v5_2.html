  aura:  new THREE.MeshBasicMaterial({ color: 0x58504c,    transparent: true, opacity: 0.09, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true }),
  inner: new THREE.MeshBasicMaterial({ color: CORE_COLOR,  transparent: true, opacity: 0.82, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true }),
  tip:   new THREE.MeshBasicMaterial({ color: CORE_COLOR,  transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true }),
  glow:  new THREE.SpriteMaterial({ map: glowTex, color: FLAME_COLOR, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true })
};

/* ── shared animation array — both outer and inner burners push here ── */
const burnerPortObjects = [];

/* ── helper: stamp renderOrder on all flame parts after push ── */
function stampFlameOrder(item){
  const ORDER = 1;
  if(item.glow)       item.glow.renderOrder       = ORDER;
  if(item.auraFlame)  item.auraFlame.renderOrder  = ORDER;
  if(item.outerFlame) item.outerFlame.renderOrder = ORDER;
  if(item.innerFlame) item.innerFlame.renderOrder = ORDER;
  if(item.flameTip)   item.flameTip.renderOrder   = ORDER;
  if(item.flameAnchor){
    item.flameAnchor.traverse(function(c){ if(c.isMesh || c.isSprite) c.renderOrder = ORDER; });
  }
}

/* ═══════════════════════════════════════════════════════════
   OUTER FACE FUEL PIPING SYSTEM — Steps A through G
   Step A — Two vertical fuel headers
   Step B — Six horizontal manifold tubes (one per row)
   Step C — T-junction fittings at every manifold/vertical intersection
   Step D — Nozzle stubs × 90 (15 per row × 6 rows) + collar rings
   Step E — Animated burner flames at each nozzle tip, rising upward
   Step F — Full mirror on back face (Wall B)
   ═══════════════════════════════════════════════════════════ */
(function buildOuterPiping(){

  /* ── constants ──────────────────────────────────────────── */
  const HDR_R      = 0.130;
  const HDR_Y      = FH/2 + 0.40 + HDR_R * 1.1;
  const PIPE_Z_OFF = 0.22;

  /* ── pipe radii ─────────────────────────────────────────── */
  const VERT_R    = 0.055;
  const MAN_R     = 0.038;
  const FLANGE_R  = VERT_R * 1.65;
  const FLANGE_H  = 0.055;
  const KNUCKLE_R = VERT_R * 1.20;

  /* nozzle stub dimensions */
  const NOZ_R     = 0.022;   // nozzle stub radius
  const NOZ_H     = 0.10;    // stub length (protrudes outward from manifold)
  const NOZ_COL_R = NOZ_R * 2.0;  // collar torus ring radius
  const NOZ_COL_T = NOZ_R * 0.55; // collar torus tube thickness

  /* ── materials ──────────────────────────────────────────── */
  const mVert = new THREE.MeshStandardMaterial({
    color: 0x3a4650, roughness: 0.28, metalness: 0.94,
    emissive: 0x0a1218, emissiveIntensity: 0.22
  });
  const mManifold = new THREE.MeshStandardMaterial({
    color: 0x4e5c64, roughness: 0.22, metalness: 0.96,
    emissive: 0x0c1820, emissiveIntensity: 0.18
  });
  const mFlange = new THREE.MeshStandardMaterial({
    color: 0xb8c8d4, roughness: 0.10, metalness: 0.99,
    emissive: 0x1a2c38, emissiveIntensity: 0.20
  });
  const mKnuckle = new THREE.MeshStandardMaterial({
    color: 0x7a9aaa, roughness: 0.14, metalness: 0.98,
    emissive: 0x101c24, emissiveIntensity: 0.24
  });
  const mNozzle = new THREE.MeshStandardMaterial({
    color: 0x2a3238, roughness: 0.32, metalness: 0.92,
    emissive: 0x080e12, emissiveIntensity: 0.18
  });
  const mRustSlv = new THREE.MeshStandardMaterial({
    color: 0x7a3a14, roughness: 0.92, metalness: 0.04,
    emissive: 0x280c02, emissiveIntensity: 0.08,
    transparent: true, opacity: 0.18
  });

  /* ── row Y positions (custom gap weights, R1 bottom → R6 top) ── */
  const ROW_MARGIN_BOTTOM = FH * 0.11;
  const ROW_MARGIN_TOP    = FH * 0.18;
  const ROW_SPAN          = FH - ROW_MARGIN_BOTTOM - ROW_MARGIN_TOP;
  const gapWeights = [1.65, 1.00, 1.65, 1.00, 1.00];
  const totalW     = gapWeights.reduce(function(a,b){ return a+b; }, 0);
  const rowY = [];
  rowY[0] = -FH/2 + ROW_MARGIN_BOTTOM;
  let acc = 0;
  for(let g = 0; g < 5; g++){
    acc += (gapWeights[g] / totalW) * ROW_SPAN;
    rowY[g + 1] = -FH/2 + ROW_MARGIN_BOTTOM + acc;
  }

  /* ── vertical header extents ────────────────────────────── */
  const VERT_TOP_Y  = HDR_Y - HDR_R;
  const VERT_BOT_Y  = rowY[0] - 0.62;
  const VERT_HEIGHT = VERT_TOP_Y - VERT_BOT_Y;
  const VERT_CY     = (VERT_TOP_Y + VERT_BOT_Y) * 0.5;

  /* ── vertical header X positions ────────────────────────── */
  const VERT_X_OFFSET = 0.18;
  const vertXL = -FW/2 + VERT_X_OFFSET + VERT_R;
  const vertXR =  FW/2 - VERT_X_OFFSET - VERT_R;

  /* ── manifold span & 15 burner X positions ───────────────── */
  const MAN_SPAN = vertXR - vertXL;
  const MAN_CX   = (vertXL + vertXR) * 0.5;
  const B_COUNT  = 15;
  const BURNER_EDGE_CLEAR = Math.max(FLANGE_R * 2.8, MAN_R * 7.0);
  const burnerXMin = vertXL + BURNER_EDGE_CLEAR + 1.0;  // +1.0 shift right: frees left strip for row labels
  const burnerXMax = vertXR - BURNER_EDGE_CLEAR;
  const burnerSpan = burnerXMax - burnerXMin;
  const burnerXs = [];
  for(let b = 0; b < B_COUNT; b++){
    burnerXs[b] = burnerXMin + (burnerSpan / (B_COUNT - 1)) * b;
  }

  /* ── outer burner port objects (for animation, appended to shared array) ── */
  /* burnerPortObjects already declared above — we push into it */

  /* ══════════════════════════════════════════════════════════
     BUILD FUNCTION — called for front face and back face
     faceZ     : Z centre of all pipe geometry
     flameDir  : +1 front face, -1 back face; flames rise upward (+Y)
     ══════════════════════════════════════════════════════════ */
  function buildFace(faceZ, flameDir, wallKey){
    const mirrorBackFace = flameDir < 0;
    const faceX = function(x){ return mirrorBackFace ? -x : x; };

    /* ─── STEP A: VERTICAL FUEL HEADERS ─────────────────────── */
    [vertXL, vertXR].forEach(function(vx){

      /* main pipe body */
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(VERT_R, VERT_R, VERT_HEIGHT, 24, 1),
        mVert.clone()
      );
      pipe.position.set(faceX(vx), VERT_CY, faceZ);
      group.add(pipe);

      /* heat-stain sleeve — mid section */
      const sleeve = new THREE.Mesh(
        new THREE.CylinderGeometry(VERT_R*1.04, VERT_R*1.06, VERT_HEIGHT*0.45, 24, 1),
        mRustSlv.clone()
      );
      sleeve.position.set(faceX(vx), VERT_CY + VERT_HEIGHT*0.05, faceZ);
      group.add(sleeve);

      /* top flange where pipe meets top header */
      const topFlange = new THREE.Mesh(
        new THREE.CylinderGeometry(FLANGE_R, FLANGE_R*0.88, FLANGE_H, 20),
        mFlange.clone()
      );
      topFlange.position.set(faceX(vx), VERT_TOP_Y, faceZ);
      group.add(topFlange);

      /* top lip ring */
      const topRing = new THREE.Mesh(
        new THREE.TorusGeometry(FLANGE_R*0.82, FLANGE_R*0.14, 10, 28),
        mFlange.clone()
      );
      topRing.rotation.x = Math.PI/2;
      topRing.position.set(faceX(vx), VERT_TOP_Y + FLANGE_H*0.5, faceZ);
      group.add(topRing);

      /* bottom dome cap */
      const botCap = new THREE.Mesh(
        new THREE.SphereGeometry(VERT_R*1.06, 16, 10, 0, Math.PI*2, 0, Math.PI/2),
        mFlange.clone()
      );
      botCap.rotation.x = Math.PI;
      botCap.position.set(faceX(vx), VERT_BOT_Y, faceZ);
      group.add(botCap);

      /* bottom drain flange */
      const botFlange = new THREE.Mesh(
        new THREE.CylinderGeometry(FLANGE_R*0.92, FLANGE_R*0.78, FLANGE_H*0.7, 20),
        mFlange.clone()
      );
      botFlange.position.set(faceX(vx), VERT_BOT_Y, faceZ);
      group.add(botFlange);

      /* intermediate collar rings — every ~1.0 unit */
      const collarCount = Math.floor(VERT_HEIGHT / 1.0);
      for(let c = 1; c < collarCount; c++){
        const cy = VERT_BOT_Y + (VERT_HEIGHT / collarCount) * c;
        const collar = new THREE.Mesh(
          new THREE.CylinderGeometry(FLANGE_R*0.76, FLANGE_R*0.76, FLANGE_H*0.55, 18),
          mFlange.clone()
        );
        collar.position.set(faceX(vx), cy, faceZ);
        group.add(collar);
      }
    });

    /* ─── STEPS B + C: MANIFOLD TUBES + T-JUNCTIONS ─────────── */
    for(let r = 0; r < 6; r++){
      const ry = rowY[r];

      /* manifold pipe */
      const manifold = new THREE.Mesh(
        new THREE.CylinderGeometry(MAN_R, MAN_R, MAN_SPAN, 20, 1),
        mManifold.clone()
      );
      manifold.rotation.z = Math.PI/2;
      manifold.position.set(faceX(MAN_CX), ry, faceZ);
      group.add(manifold);

      /* heat-stain sleeve on manifold */
      const mSlv = new THREE.Mesh(
        new THREE.CylinderGeometry(MAN_R*1.045, MAN_R*1.065, MAN_SPAN*0.35, 20, 1),
        mRustSlv.clone()
      );
      mSlv.rotation.z = Math.PI/2;
      mSlv.position.set(faceX(MAN_CX + MAN_SPAN*0.08), ry, faceZ);
      group.add(mSlv);

      /* intermediate bolted flange rings on manifold */
      [-MAN_SPAN*0.28, MAN_SPAN*0.28].forEach(function(dx){
        const midFlange = new THREE.Mesh(
          new THREE.CylinderGeometry(MAN_R*1.48, MAN_R*1.48, MAN_R*0.7, 18),
          mFlange.clone()
        );
        midFlange.rotation.z = Math.PI/2;
        midFlange.position.set(faceX(MAN_CX + dx), ry, faceZ);
        group.add(midFlange);
      });

      /* ── STEP C: T-JUNCTION FITTINGS at both ends ── */
      [vertXL, vertXR].forEach(function(jx){

        /* OUTER torus — wraps the vertical pipe at the junction level,
           visible as the body of the T-fitting                          */
        const tBody = new THREE.Mesh(
          new THREE.TorusGeometry(VERT_R * 1.55, VERT_R * 0.55, 14, 32),
          mKnuckle.clone()
        );
        tBody.rotation.x = Math.PI/2;   // ring faces outward (in Z)
        tBody.position.set(faceX(jx), ry, faceZ);
        group.add(tBody);

        /* INNER fill disc — closes the torus hole, looks like a solid boss */
        const tDisc = new THREE.Mesh(
          new THREE.CylinderGeometry(VERT_R * 1.0, VERT_R * 1.0, VERT_R * 0.5, 20),
          mKnuckle.clone()
        );
        tDisc.position.set(faceX(jx), ry, faceZ);
        group.add(tDisc);

        /* WELD BEAD — thin bright ring where manifold tube meets vertical */
        const weld = new THREE.Mesh(
          new THREE.TorusGeometry(MAN_R * 1.55, MAN_R * 0.32, 8, 24),
          mFlange.clone()
        );
        weld.rotation.y = Math.PI/2;   // ring encircles manifold axis
        weld.position.set(faceX(jx), ry, faceZ);
        group.add(weld);

        /* BRANCH STUB — short cylinder bridging T-body to manifold end */
        const branchStub = new THREE.Mesh(
          new THREE.CylinderGeometry(MAN_R*1.05, MAN_R*1.05, VERT_R * 1.6, 16),
          mManifold.clone()
        );
        branchStub.rotation.z = Math.PI/2;
        branchStub.position.set(
          faceX(jx + (jx < 0 ? VERT_R*0.8 : -VERT_R*0.8)),
          ry,
          faceZ
        );
        group.add(branchStub);

        /* FLANGE RING at T-junction (bolted appearance) */
        const tFlange = new THREE.Mesh(
          new THREE.CylinderGeometry(VERT_R*1.90, VERT_R*1.90, FLANGE_H*0.7, 22),
          mFlange.clone()
        );
        tFlange.position.set(faceX(jx), ry, faceZ);
        group.add(tFlange);
      });

      /* ─── STEP D: NOZZLE STUBS + COLLAR RINGS (15 per row) ── */
      for(let b = 0; b < B_COUNT; b++){
        const bx = faceX(burnerXs[b]);
        /* nozzle sits exactly on the top tangent of the manifold and points upward (+Y) */
        const nozzleBaseY = ry + MAN_R;
        const stubZ = faceZ;
        const stubY = nozzleBaseY + NOZ_H * 0.5;
        const collarY = nozzleBaseY + NOZ_COL_T * 0.45;
        const lockY = nozzleBaseY + NOZ_H * 0.22;
        const nozzleTipY = nozzleBaseY + NOZ_H;
        const flameAnchor = new THREE.Group();
        flameAnchor.position.set(bx, nozzleTipY, stubZ);
        group.add(flameAnchor);

        /* nozzle stub cylinder */
        const stub = new THREE.Mesh(
          new THREE.CylinderGeometry(NOZ_R, NOZ_R*1.1, NOZ_H, 14),
          mNozzle.clone()
        );
        stub.position.set(bx, stubY, stubZ);
        group.add(stub);

        /* collar torus ring at the manifold/stub junction */
        const collar = new THREE.Mesh(
          new THREE.TorusGeometry(NOZ_COL_R, NOZ_COL_T, 8, 20),
          mFlange.clone()
        );
        collar.rotation.x = Math.PI/2;
        collar.position.set(bx, collarY, stubZ);
        group.add(collar);

        /* hex-nut style lock ring just above collar */
        const lockRing = new THREE.Mesh(
          new THREE.CylinderGeometry(NOZ_COL_R*0.88, NOZ_COL_R*0.88, NOZ_H*0.28, 6),
          mFlange.clone()
        );
        lockRing.position.set(bx, lockY, stubZ);
        group.add(lockRing);

        /* ─── STEP E: BURNER FLAMES anchored directly at the nozzle tip ─────── */
        const auraBaseLift = FLAME_AURA_H * FLAME_BASE_SHIFT;
        const outerBaseLift = FLAME_OUTER_H * FLAME_BASE_SHIFT;
        const innerBaseLift = FLAME_INNER_H * FLAME_BASE_SHIFT;

        /* outer aura */
        const auraFlame = new THREE.Mesh(flameAuraGeo, flameMats.aura.clone());
        auraFlame.position.set(0, auraBaseLift, 0);
        flameAnchor.add(auraFlame);

        /* outer flame body */
        const outerFlame = new THREE.Mesh(flameOuterGeo, flameMats.outer.clone());
        outerFlame.position.set(0, outerBaseLift, 0);
        flameAnchor.add(outerFlame);

        /* inner hot core */
        const innerFlame = new THREE.Mesh(flameInnerGeo, flameMats.inner.clone());
        innerFlame.position.set(0, innerBaseLift, 0);
        flameAnchor.add(innerFlame);

        /* glow sprite */
        const glow = new THREE.Sprite(flameMats.glow.clone());
        glow.scale.set(0.48, 0.48, 1);
        glow.position.set(0, 0.05, 0);
        flameAnchor.add(glow);

        const flameTip = new THREE.Mesh(tipGeo, flameMats.tip.clone());
        flameTip.position.set(0, outerBaseLift + (FLAME_OUTER_H * 0.82), 0);
        flameAnchor.add(flameTip);

        /* seed for per-burner flicker variety */
        const seed = r * 17 + b * 3 + (flameDir > 0 ? 200 : 400);

        const burnerItem = {
          seed,
          dir: flameDir,
          verticalRise: true,
          wallKey,
          rowNumber: r + 1,
          burnerNumber: b + 1,
          flameAnchor,
          baseAnchorY: nozzleTipY,
          stub, collar, lockRing,
          glow, auraFlame, outerFlame, innerFlame, flameTip,
          baseLiftAura: auraBaseLift,
          baseLiftOuter: outerBaseLift,
          baseLiftInner: innerBaseLift
        };
        burnerPortObjects.push(burnerItem);
        liveBurnerObjects.push(burnerItem);
        stampFlameOrder(burnerItem);
      }
    }

    /* connection stubs: vertical header → top common header */
    [vertXL, vertXR].forEach(function(vx){
      const stub = new THREE.Mesh(
        new THREE.CylinderGeometry(VERT_R*0.88, VERT_R*0.88, 0.30, 16),
        mVert.clone()
      );
      stub.rotation.z = (vx < 0 ? 1 : -1) * 0.32 * (mirrorBackFace ? -1 : 1);
      stub.position.set(faceX(vx*0.96), HDR_Y - HDR_R*0.6, faceZ*0.82);
      group.add(stub);
    });
  }

  /* ─── STEP F: BUILD BOTH FACES ────────────────────────────── */
  buildFace(+FD/2 + PIPE_Z_OFF, +1, chamberWalls[0]);   // front face — flames rise toward +Y
  buildFace(-FD/2 - PIPE_Z_OFF, -1, chamberWalls[1]);   // back  face — flames rise toward +Y

})();

/* ═══════════════════════════════════════════════════════════
   INNER FACE BURNER OVERLAYS — 3D GEOMETRY (mac-cuboid style)
   6 rows × 7 columns (burner cols 1,3,5,8,11,13,15) on each
   inner face (front & back). Real Three.js mesh burners with
   lathe-geometry flames, additive-blended, animated per-frame.
   ═══════════════════════════════════════════════════════════ */

/* ── refractory brick canvas overlay (rich layered texture) ── */
(function addBrickOverlays(){
  function makeBrickCanvas(zPos, flipY){
    const cv = document.createElement("canvas");
    cv.width = 2048; cv.height = 1024;
    const g = cv.getContext("2d");
    const W = cv.width, H = cv.height;

    /* 1 — deep dark background base */
    g.fillStyle = "#0e0904"; g.fillRect(0, 0, W, H);

    /* 2 — brick dimensions: standard stretcher bond layout */
    const BW = Math.round(W / 11);   // brick width  ~186px
    const BH = Math.round(H / 13);   // brick height  ~79px
    const MORTAR = 5;                 // mortar joint thickness px

    /* brick colour palette — dark refractory fire-brick tones */
    const brickPalettes = [
      ["#2e1a0a","#3a2010","#2a1608","#321c0c","#3e2414"],  // very dark charred
      ["#4a2a12","#3c2210","#422614","#4e2e16","#3a2010"],  // dark burnt sienna
      ["#5a3418","#4c2c14","#523016","#5e3a1c","#4a2a12"],  // medium refractory
      ["#623c1e","#583618","#6a401e","#5c3618","#6e4422"],  // warm orange-brown
    ];

    /* noise helper for variation */
    function nhash(a, b){ let v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); }

    /* 3 — draw each brick row by row (stretcher bond — offset every other row) */
    const rows = Math.ceil(H / (BH + MORTAR)) + 1;
    const cols = Math.ceil(W / (BW + MORTAR)) + 2;

    for(let row = 0; row < rows; row++){
      const by0 = row * (BH + MORTAR);
      const offset = (row % 2 === 0) ? 0 : Math.round((BW + MORTAR) * 0.5);

      for(let col = -1; col < cols; col++){
        const bx0 = col * (BW + MORTAR) - offset;
        const bx1 = bx0 + BW, by1 = by0 + BH;

        /* skip fully off-canvas */
        if(bx1 < 0 || bx0 > W || by1 < 0 || by0 > H) continue;

        const id  = row * 100 + col + 50;
        const n1  = nhash(id, 1);
        const n2  = nhash(id, 2);
        const n3  = nhash(id, 3);

        /* pick palette row by heat zone (hotter = darker near bottom) */
        const heatZone = by0 / H;  // 0=top, 1=bottom
        const pRow = Math.min(3, Math.floor(n1 * 2 + heatZone * 2));
        const pal  = brickPalettes[pRow];
        const baseCol = pal[Math.floor(n2 * pal.length)];

        /* brick body fill */
        g.fillStyle = baseCol;
        g.fillRect(bx0, by0, BW, BH);

        /* surface gradient — top highlight, bottom shadow (fired brick look) */
        const brickGrad = g.createLinearGradient(bx0, by0, bx0, by1);
        const lum = -0.04 + n3 * 0.08;
        brickGrad.addColorStop(0,   `rgba(255,230,180,${0.07 + n1*0.04})`);
        brickGrad.addColorStop(0.3, `rgba(0,0,0,0)`);
        brickGrad.addColorStop(0.7, `rgba(0,0,0,0)`);
        brickGrad.addColorStop(1,   `rgba(0,0,0,${0.18 + n2*0.08})`);
        g.fillStyle = brickGrad;
        g.fillRect(bx0, by0, BW, BH);

        /* side-light sheen — left bright edge, right dark edge */
        const sideGrad = g.createLinearGradient(bx0, by0, bx1, by0);
        sideGrad.addColorStop(0,   `rgba(255,220,160,${0.06 + n3*0.04})`);
        sideGrad.addColorStop(0.12,"rgba(0,0,0,0)");
        sideGrad.addColorStop(0.88,"rgba(0,0,0,0)");
        sideGrad.addColorStop(1,   `rgba(0,0,0,${0.12 + n1*0.06})`);
        g.fillStyle = sideGrad;
        g.fillRect(bx0, by0, BW, BH);

        /* heat-craze cracks on some bricks */
        if(n1 > 0.62){
          const cx1 = bx0 + BW * (0.2 + n2 * 0.5);
          const cy1 = by0 + BH * (0.1 + n3 * 0.3);
          const cx2 = cx1 + (-8 + n1 * 16);
          const cy2 = cy1 + BH * (0.4 + n2 * 0.4);
          g.strokeStyle = `rgba(8,5,2,${0.25 + n3*0.2})`;
          g.lineWidth = 0.7 + n2 * 0.6;
          g.beginPath(); g.moveTo(cx1, cy1); g.lineTo(cx2, cy2); g.stroke();
        }

        /* soot smudge on top edge of some bricks */
        if(n2 > 0.55){
          const sg = g.createLinearGradient(bx0, by0, bx0, by0 + BH * 0.4);
          sg.addColorStop(0, `rgba(4,3,2,${0.22 + n1*0.14})`);
          sg.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = sg;
          g.fillRect(bx0, by0, BW, Math.round(BH * 0.4));
        }
      }
    }

    /* 4 — mortar joints as slightly lighter recessed lines */
    g.strokeStyle = "rgba(28,18,8,0.90)";
    g.lineWidth   = MORTAR;
    // horizontal joints
    for(let row = 0; row <= rows; row++){
      const jy = row * (BH + MORTAR) - MORTAR * 0.5;
      g.beginPath(); g.moveTo(0, jy); g.lineTo(W, jy); g.stroke();
    }
    // vertical joints — two passes for even/odd rows
    for(let row = 0; row < rows; row++){
      const by0 = row * (BH + MORTAR);
      const offset = (row % 2 === 0) ? 0 : Math.round((BW + MORTAR) * 0.5);
      for(let col = -1; col < cols; col++){
        const jx = col * (BW + MORTAR) - offset + BW + MORTAR * 0.5;
        g.beginPath(); g.moveTo(jx, by0); g.lineTo(jx, by0 + BH + MORTAR); g.stroke();
      }
    }

    /* 5 — mortar subtle highlight (raised look) */
    g.strokeStyle = "rgba(50,32,14,0.30)";
    g.lineWidth   = 1;
    for(let row = 0; row <= rows; row++){
      const jy = row * (BH + MORTAR) - MORTAR * 0.5 - 1;
      g.beginPath(); g.moveTo(0, jy); g.lineTo(W, jy); g.stroke();
    }

    /* 6 — radial heat glow from centre */
    const heatGlow = g.createRadialGradient(W*0.5, H*0.62, 0, W*0.5, H*0.62, W*0.52);
    heatGlow.addColorStop(0,   "rgba(255,110,10,0.13)");
    heatGlow.addColorStop(0.4, "rgba(200,70,5,0.07)");
    heatGlow.addColorStop(1,   "rgba(0,0,0,0)");
    g.fillStyle = heatGlow; g.fillRect(0, 0, W, H);

    /* 7 — vignette darkening at edges */
    const vign = g.createRadialGradient(W*0.5, H*0.5, H*0.28, W*0.5, H*0.5, W*0.68);
    vign.addColorStop(0, "rgba(0,0,0,0)");
    vign.addColorStop(1, "rgba(0,0,0,0.45)");
    g.fillStyle = vign; g.fillRect(0, 0, W, H);

    /* 8 — overall soot darkening at top */
    const sootGrad = g.createLinearGradient(0, 0, 0, H * 0.35);
    sootGrad.addColorStop(0, "rgba(4,3,2,0.50)");
    sootGrad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = sootGrad; g.fillRect(0, 0, W, H * 0.35);

    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    if(typeof tex.colorSpace !== "undefined" && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.FrontSide, depthWrite: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), mat);
    mesh.position.z = zPos;
    if(flipY) mesh.rotation.y = Math.PI;
    mesh.renderOrder = -1;
    group.add(mesh);
  }
  makeBrickCanvas( FD/2 - 0.02, false);
  makeBrickCanvas(-FD/2 + 0.02, true);
})();

(function addLiveFaceOverlays(){
  function makeOverlay(faceName, wallKey, zPos, flipY){
    const canvas = document.createElement("canvas");
    canvas.width = 2048;
    canvas.height = 1024;
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    if(typeof texture.colorSpace !== "undefined" && THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;
    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.FrontSide,
      depthWrite: false,
      depthTest: true
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), material);
    mesh.position.z = zPos;
    if(flipY) mesh.rotation.y = Math.PI;
    mesh.renderOrder = 0;
    group.add(mesh);
    liveFaceOverlays[faceName] = { wallKey, canvas, texture, mesh };
  }

  makeOverlay("front", chamberWalls[0], FD/2 + 0.004, false);
  makeOverlay("back", chamberWalls[1], -FD/2 - 0.004, true);
})();

function createBurnerWallFace(faceName){
  const dir   = faceName === "front" ? -1 : 1;
  const wallZ = faceName === "front" ? ( FD/2 - 0.07) : (-FD/2 + 0.07);
  const mirrorBackFace = faceName === "back";
  const wallKey = faceName === "front" ? chamberWalls[0] : chamberWalls[1];
  const burnerColumns = [1,3,5,8,11,13,15];
  const cols = burnerColumns.length;
  const rowNumbers = [6,5,4,3,2,1];
  const spanX = FW * 0.82;
  const wallBottomInset = FH * 0.11;
  const wallTopInset    = FH * 0.18;
  const topY            = FH/2 - wallTopInset;
  const bottomY         = -FH/2 + wallBottomInset;
  const spanY           = topY - bottomY;

  for(let ri = 0; ri < rowNumbers.length; ri++){
    const y = topY - (spanY/(rowNumbers.length-1)) * ri;
    for(let ci = 0; ci < cols; ci++){
      const baseX = -spanX/2 + (spanX/(cols-1)) * ci;
      const x    = mirrorBackFace ? -baseX : baseX;
      const seed = ri * 31 + ci * 3 + (faceName === "front" ? 1 : 7);

      const ring = new THREE.Mesh(ringGeo, hotPortMat.clone());
      ring.position.set(x, y, wallZ + dir * 0.01);
      group.add(ring);

      const port = new THREE.Mesh(nozzlePortGeo, darkPortMat.clone());
      port.rotation.x = Math.PI/2;
      port.position.set(x, y, wallZ + dir * 0.038);
      group.add(port);

      const glow = new THREE.Sprite(flameMats.glow.clone());
      glow.scale.set(0.42, 0.42, 1);
      glow.position.set(x, y, wallZ + dir * 0.08);
      group.add(glow);

      const auraFlame = new THREE.Mesh(flameAuraGeo, flameMats.aura.clone());
      auraFlame.rotation.x = dir === -1 ? -Math.PI/2 : Math.PI/2;
      auraFlame.position.set(x, y, wallZ + dir * 0.22);
      group.add(auraFlame);

      const outerFlame = new THREE.Mesh(flameOuterGeo, flameMats.outer.clone());
      outerFlame.rotation.x = dir === -1 ? -Math.PI/2 : Math.PI/2;
      outerFlame.position.set(x, y, wallZ + dir * 0.19);
      group.add(outerFlame);

      const innerFlame = new THREE.Mesh(flameInnerGeo, flameMats.inner.clone());
      innerFlame.rotation.x = dir === -1 ? -Math.PI/2 : Math.PI/2;
      innerFlame.position.set(x, y, wallZ + dir * 0.17);
      group.add(innerFlame);

      const flameTip = new THREE.Mesh(tipGeo, flameMats.tip.clone());
      flameTip.position.set(x, y, wallZ + dir * 0.35);
      group.add(flameTip);

      const burnerItem = {
        seed, dir,
        wallKey,
        rowNumber: rowNumbers[ri],
        burnerNumber: burnerColumns[ci],
        ring, port,
        glow, auraFlame, outerFlame, innerFlame, flameTip,
        baseX: x, baseY: y,
        baseZGlow:  wallZ + dir * 0.06,
        baseZAura:  wallZ + dir * 0.14,
        baseZOuter: wallZ + dir * 0.12,
        baseZInner: wallZ + dir * 0.10,
        baseZTip:   wallZ + dir * 0.20
      };
      burnerPortObjects.push(burnerItem);
      liveBurnerObjects.push(burnerItem);
      stampFlameOrder(burnerItem);
    }
  }
}
createBurnerWallFace("front");
createBurnerWallFace("back");
refreshLivePresentation(true);

/* ── 3D burner animation function ── */
function animateBurners(time){
  burnerPortObjects.forEach(function(item){
    const liveLevel = typeof item.liveFlameLevel === "number" ? item.liveFlameLevel : 1;
    if(liveLevel <= 0.001){
      if(item.glow && item.glow.material) item.glow.material.opacity = 0;
      if(item.auraFlame && item.auraFlame.material) item.auraFlame.material.opacity = 0;
      if(item.outerFlame && item.outerFlame.material) item.outerFlame.material.opacity = 0;
      if(item.innerFlame && item.innerFlame.material) item.innerFlame.material.opacity = 0;
      if(item.flameTip && item.flameTip.material) item.flameTip.material.opacity = 0;
      return;
    }

    const pulse   = 0.94 + Math.sin(time * 5.4 + item.seed) * 0.10 + Math.sin(time * 8.6 + item.seed * 1.7) * 0.05;
    const sway    = Math.sin(time * 3.1 + item.seed * 0.9) * 0.045;
    const flutter = Math.sin(time * 7.2 + item.seed * 1.4) * 0.03;
    const cross   = Math.cos(time * 4.1 + item.seed * 0.7) * 0.026;
    const flameScale = 0.36 + (liveLevel * 0.84);
    const motionScale = 0.42 + (liveLevel * 0.58);

    if(item.verticalRise){
      const flameLeanX = item.dir * ((sway * 0.18) + (flutter * 0.08)) * motionScale;
      const flameLeanZ = ((cross * 0.14) + (flutter * 0.05)) * motionScale;
      const auraScaleX = (0.92 + pulse*0.16) * flameScale;
      const auraScaleY = (1.08 + pulse*0.16) * flameScale;
      const outerScaleX = (0.84 + pulse*0.14) * flameScale;
      const outerScaleY = (1.12 + pulse*0.20) * flameScale;
      const innerScaleX = (0.66 + pulse*0.10) * flameScale;
      const innerScaleY = (0.94 + pulse*0.14) * flameScale;
      const tipLift = (FLAME_OUTER_H * 0.90) * flameScale;

      item.flameAnchor.position.y = (item.baseAnchorY || item.flameAnchor.position.y) + ((0.006 + pulse*0.006) * liveLevel);
      item.flameAnchor.rotation.x = flameLeanX;
      item.flameAnchor.rotation.z = flameLeanZ;

      item.glow.position.set(0, 0.045 + pulse*0.020*motionScale, 0);
      item.glow.scale.set((0.46 + pulse*0.12) * flameScale, (0.46 + pulse*0.12) * flameScale, 1);
      item.glow.material.opacity = (0.14 + pulse*0.08) * liveLevel;

      item.auraFlame.position.set(0, item.baseLiftAura * auraScaleY, 0);
      item.auraFlame.scale.set(auraScaleX, auraScaleY, auraScaleX);
      item.auraFlame.material.opacity = (0.06 + pulse*0.04) * liveLevel;
      item.auraFlame.rotation.set(0, 0, 0);

      item.outerFlame.position.set(0, item.baseLiftOuter * outerScaleY, 0);
      item.outerFlame.scale.set(outerScaleX, outerScaleY, outerScaleX);
      item.outerFlame.material.opacity = (0.44 + pulse*0.12) * (0.42 + liveLevel*0.58);
      item.outerFlame.rotation.set(0, 0, 0);

      item.innerFlame.position.set(0, item.baseLiftInner * innerScaleY, 0);
      item.innerFlame.scale.set(innerScaleX, innerScaleY, innerScaleX);
      item.innerFlame.material.opacity = (0.56 + pulse*0.14) * (0.40 + liveLevel*0.60);
      item.innerFlame.rotation.set(0, 0, 0);

      if(item.flameTip){
        item.flameTip.position.set(0, tipLift + (pulse * 0.024), 0);
        item.flameTip.scale.setScalar((0.60 + pulse * 0.12) * flameScale);
        item.flameTip.material.opacity = (0.66 + pulse * 0.14) * liveLevel;
      }
      return;
    }

    item.glow.position.set(item.baseX + cross*0.22*motionScale, item.baseY + sway*0.18*motionScale, item.baseZGlow + item.dir*(0.01 + pulse*0.006*motionScale));
    item.glow.scale.set((0.28 + pulse*0.10) * flameScale, (0.28 + pulse*0.10) * flameScale, 1);
    item.glow.material.opacity = (0.10 + pulse*0.06) * liveLevel;

    item.auraFlame.position.set(item.baseX + cross*0.45*motionScale, item.baseY + sway*0.2*motionScale, item.baseZAura + item.dir*(0.01 + pulse*0.014*motionScale));
    item.auraFlame.scale.set((0.62 + pulse*0.10) * flameScale, (1.0 + pulse*0.16) * flameScale, (0.62 + pulse*0.10) * flameScale);
    item.auraFlame.material.opacity = (0.05 + pulse*0.04) * liveLevel;
    item.auraFlame.rotation.z = (sway*1.34 + flutter*0.5) * motionScale;
    item.auraFlame.rotation.y = item.dir === -1 ? cross*0.9*motionScale : Math.PI + cross*0.9*motionScale;

    item.outerFlame.position.set(item.baseX + cross*0.62*motionScale, item.baseY + sway*0.28*motionScale, item.baseZOuter + item.dir*(pulse*0.020*motionScale));
    item.outerFlame.scale.set((0.58 + pulse*0.10) * flameScale, (1.0 + pulse*0.22) * flameScale, (0.58 + pulse*0.10) * flameScale);
    item.outerFlame.material.opacity = (0.38 + pulse*0.10) * (0.38 + liveLevel*0.62);

    item.innerFlame.position.set(item.baseX + cross*0.34*motionScale, item.baseY + sway*0.22*motionScale, item.baseZInner + item.dir*(pulse*0.016*motionScale));
    item.innerFlame.scale.set((0.54 + pulse*0.08) * flameScale, (0.92 + pulse*0.18) * flameScale, (0.54 + pulse*0.08) * flameScale);
    item.innerFlame.material.opacity = (0.52 + pulse*0.12) * (0.38 + liveLevel*0.62);

    item.flameTip.position.set(item.baseX + cross*0.9*motionScale, item.baseY + sway*0.34*motionScale + flutter*0.16*motionScale, item.baseZTip + item.dir*(pulse*0.024*motionScale));
    item.flameTip.scale.setScalar((0.58 + pulse*0.10) * flameScale);
    item.flameTip.material.opacity = (0.62 + pulse*0.14) * liveLevel;

    item.outerFlame.rotation.z = (sway + flutter*0.9) * motionScale;
    item.innerFlame.rotation.z = (sway*1.22 - flutter*0.84) * motionScale;
    item.outerFlame.rotation.y = item.dir === -1 ? cross*0.5*motionScale : Math.PI + cross*0.5*motionScale;
    item.innerFlame.rotation.y = item.dir === -1 ? cross*0.32*motionScale : Math.PI + cross*0.32*motionScale;
  });
}

/* ── render loop state ───────────────────────────────── */
let rotY = 0, targetRotY = 0, autoSpin = false;
let activePtr = null, isDrag = false, lastX = 0, dragDist = 0;
let touchMoved = false, lastTap = 0, lastFrameTs = 0, lastRenderTs = 0;
let forceRender = true;

const DRAG_SPAN  = Math.PI * 1.5;
const AUTO_SPEED = 0.34;
const SETTLE_RATE = 26;
const SNAP_EPS   = 0.0012;
const SNAP_INST  = 0.07;
const MAX_DX     = 42;
const TAP_TOL    = 10;
const FACE_STEP  = Math.PI / 2;
const ACTIVE_MS  = 16;
const BG_MS      = isChrome ? 420 : 300;
const SLEEP_MS   = 900;

let tabActive = true, inView = true, focused = true;
document.addEventListener("visibilitychange", () => markDirty());
window.addEventListener("message", function(ev){
  const d = ev && ev.data;
  if(!d) return;
  if(d.type === "cuboid-live-data"){
    if(cuboidConsumeLiveState(d.payload, d.digest)){
      refreshLivePresentation(true);
      markDirty();
    }
    return;
  }
  if(d.type === "cuboid-host-state"){
    tabActive = !!d.active; inView = d.inView !== false; focused = d.focused !== false; markDirty();
  }
});

function canRender(){ return !document.hidden && (isFs() || (tabActive && inView)); }
function hasMotion(){ return isDrag || autoSpin || Math.abs(shortDelta(rotY, targetRotY)) > SNAP_EPS; }
function markDirty(){ forceRender = true; lastFrameTs = 0; lastRenderTs = 0; }

function norm(a){ const t=Math.PI*2; while(a<=-Math.PI) a+=t; while(a>Math.PI) a-=t; return a; }
function shortDelta(from, to){ let d=norm(to)-norm(from); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }
function setTarget(a){ targetRotY = norm(rotY + shortDelta(rotY, a)); }

function settle(dt){
  const d = shortDelta(rotY, targetRotY);
  if(Math.abs(d) <= SNAP_EPS){ rotY = targetRotY; return false; }
  rotY = norm(rotY + d*(1-Math.exp(-SETTLE_RATE*dt)));
  if(Math.abs(shortDelta(rotY, targetRotY)) <= SNAP_EPS) rotY = targetRotY;
  return true;
}

function snapFace(){ setTarget(Math.round(norm(rotY)/FACE_STEP)*FACE_STEP); }

function syncAutoBtn(){ btnAuto.textContent = autoSpin ? "Stop" : "Auto Rotate"; }

/* ── pointer ──────────────────────────────────────────── */
vp.addEventListener("pointerdown", function(e){
  if(e.pointerType==="mouse" && e.button!==0) return;
  activePtr = e.pointerId;
  if(vp.setPointerCapture) vp.setPointerCapture(e.pointerId);
  autoSpin = false; syncAutoBtn();
  isDrag = true; lastX = e.clientX; dragDist = 0; touchMoved = false;
  targetRotY = rotY; markDirty();
});
vp.addEventListener("pointermove", function(e){
  if(activePtr !== e.pointerId || !isDrag) return;
  const raw = e.clientX - lastX;
  const dx = Math.max(-MAX_DX, Math.min(MAX_DX, raw));
  dragDist += Math.abs(raw);
  if(Math.abs(raw) > 2) touchMoved = true;
  rotY = norm(rotY + (dx / Math.max(320, GW())) * DRAG_SPAN);
  targetRotY = rotY; lastX = e.clientX; markDirty();
});
function endPtr(e){
  if(activePtr !== e.pointerId) return;
  try{ if(vp.releasePointerCapture) vp.releasePointerCapture(e.pointerId); }catch(_){}
  activePtr = null;
  const wasTap = dragDist <= TAP_TOL && !touchMoved;
  isDrag = false; snapFace();
  if(Math.abs(shortDelta(rotY, targetRotY)) <= SNAP_INST) rotY = targetRotY;
  markDirty();
  if(!wasTap){ lastTap = 0; return; }
  const now = Date.now();
  if(now - lastTap < 320){ toggleFs(); lastTap = 0; } else { lastTap = now; }
}
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);
vp.addEventListener("lostpointercapture", function(e){ if(activePtr===e.pointerId){ activePtr=null; isDrag=false; } });
window.addEventListener("blur", function(){ activePtr=null; isDrag=false; });
vp.addEventListener("dblclick", function(e){ e.preventDefault(); toggleFs(); });

/* ── buttons ─────────────────────────────────────────── */
btnFront.addEventListener("click", function(){ autoSpin=false; syncAutoBtn(); setTarget(0); markDirty(); });
btnBack.addEventListener("click",  function(){ autoSpin=false; syncAutoBtn(); setTarget(Math.PI); markDirty(); });
btnAuto.addEventListener("click",  function(){
  autoSpin = !autoSpin;
  if(!autoSpin) snapFace(); else targetRotY = rotY;
  syncAutoBtn(); markDirty();
});
btnReset.addEventListener("click", function(){ autoSpin=false; syncAutoBtn(); setTarget(0); markDirty(); });

/* ── resize ──────────────────────────────────────────── */
const ro = new ResizeObserver(function(){ applyQuality(true); fitCamera(); markDirty(); });
ro.observe(vp);
applyQuality(true);

/* ── animate ─────────────────────────────────────────── */
function animate(t){
  requestAnimationFrame(animate);
  const ok = canRender();
  const uni = ok && (isFs() || focused);
  const targetMs = ok ? (uni ? ACTIVE_MS : BG_MS) : SLEEP_MS;
  if(lastRenderTs && (t - lastRenderTs) < targetMs) return;
  lastRenderTs = t;
  const dt = lastFrameTs ? Math.min(0.05, Math.max(0.001, (t-lastFrameTs)/1000)) : 1/60;
  lastFrameTs = t;
  let dirty = forceRender || applyQuality(false);
  if(!ok) return;

  if(isDrag){
    targetRotY = rotY; dirty = true;
  } else if(autoSpin){
    rotY = norm(rotY + AUTO_SPEED * dt); targetRotY = rotY; dirty = true;
  } else {
    dirty = settle(dt) || dirty;
  }

  // gentle inner light pulse
  innerL.intensity = 1.2 + 0.5*Math.sin(t*0.007) + 0.2*Math.sin(t*0.013);

  if(refreshLivePresentation(false)) dirty = true;

  // 3D burner flame animation
  animateBurners(t * 0.001);
  dirty = true;

  rigGroup.rotation.y = rotY;
  if(!dirty) return;
  renderer.render(scene, camera);
  forceRender = false;
}
requestAnimationFrame(animate);

})();
</script>
