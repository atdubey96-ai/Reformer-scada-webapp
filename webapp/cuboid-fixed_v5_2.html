<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cuboid — Bare Shell</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#08090d;
  overflow:hidden;
  font-family:"Courier New",Courier,monospace;
}
body{color:rgba(140,180,220,0.85);}
#app{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;padding:10px;
}
#topbar{
  width:min(97vw,1680px);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
#viewerTag{
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  min-height:44px;
  width:clamp(300px,32vw,520px);max-width:100%;
  padding:8px 20px 9px 18px;
  position:relative;overflow:hidden;border-radius:14px;
  border:1px solid rgba(110,150,220,0.34);
  background:linear-gradient(135deg,rgba(20,31,54,0.97) 0%,rgba(25,20,38,0.95) 38%,rgba(9,24,38,0.96) 100%);
  box-shadow:0 12px 28px rgba(0,0,0,0.24),inset 0 1px 0 rgba(255,255,255,0.08),inset 0 0 28px rgba(74,126,214,0.09);
}
#viewerTag::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 16% 18%,rgba(102,180,255,0.16),transparent 42%),
             radial-gradient(circle at 86% 78%,rgba(255,168,82,0.14),transparent 36%);
}
.vt-title{
  position:relative;font-size:12px;font-weight:700;letter-spacing:1.15px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff7d2 0%,#cfe5ff 42%,#8ef0d3 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.vt-sub{
  position:relative;font-size:8px;letter-spacing:0.9px;color:rgba(199,218,242,0.88);white-space:nowrap;
}
#vp{
  position:relative;
  width:min(97vw,1680px);
  height:min(calc(100vh - 110px),90vh);
  overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(58,78,104,0.52) 0%,rgba(26,33,45,0.88) 22%,rgba(10,13,19,0.97) 54%,#06070b 100%);
  border:1px solid rgba(60,90,130,0.3);border-radius:10px;
  box-shadow:inset 0 0 90px rgba(80,115,165,0.12);
  cursor:grab;touch-action:none;
}
#vp:active{cursor:grabbing;}
#vp canvas{position:absolute;inset:0;width:100%;height:100%;}
#hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:8px;letter-spacing:2px;color:rgba(100,130,160,0.4);
  pointer-events:none;white-space:nowrap;
}
#ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;flex:1 1 400px;}
.btn{
  background:rgba(10,18,32,0.92);border:1px solid rgba(50,90,140,0.4);
  color:rgba(140,180,220,0.85);padding:6px 16px;border-radius:6px;
  font-family:"Courier New",Courier,monospace;font-size:10px;letter-spacing:1.8px;
  cursor:pointer;text-transform:uppercase;
}
.btn:hover{background:rgba(25,50,90,0.9);border-color:rgba(90,150,220,0.7);}
@media(max-width:760px){
  #topbar{width:100%;gap:8px;justify-content:center;}
  #viewerTag{width:100%;min-height:42px;padding:8px 12px 9px;text-align:center;align-items:center;}
  .vt-title{font-size:11px;line-height:1.15;}
  .vt-sub{font-size:7px;letter-spacing:0.8px;white-space:normal;}
  #vp{width:100%;height:min(calc(100vh - 138px),86vh);}
  #ctrls{width:100%;gap:6px;justify-content:center;flex:1 1 auto;}
  .btn{flex:1 1 calc(50% - 6px);min-width:118px;padding:8px 10px;font-size:9px;letter-spacing:1.2px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="viewerTag">
      <span class="vt-title">Furnace Cuboid — Bare Shell</span>
      <span class="vt-sub">FW 13.8 · FH 6.08 · FD 1.5 · clean geometry</span>
    </div>
    <div id="ctrls">
      <button class="btn" id="btnFront">Front</button>
      <button class="btn" id="btnBack">Back</button>
      <button class="btn" id="btnAuto">Auto Rotate</button>
      <button class="btn" id="btnReset">Reset View</button>
    </div>
  </div>
  <div id="vp"><div id="hint">DRAG TO ROTATE · DOUBLE-TAP FULLSCREEN</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ── dimensions (exact from original) ─────────────────── */
const FW = 13.8, FH = 6.08, FD = 1.5;

/* ── DOM refs ─────────────────────────────────────────── */
const app   = document.getElementById("app");
const vp    = document.getElementById("vp");
const hint  = document.getElementById("hint");
const btnFront = document.getElementById("btnFront");
const btnBack  = document.getElementById("btnBack");
const btnAuto  = document.getElementById("btnAuto");
const btnReset = document.getElementById("btnReset");
const tagTitle = document.querySelector(".vt-title");
const tagSub   = document.querySelector(".vt-sub");

const params = new URLSearchParams(window.location.search);
const chamberKey = String(params.get("chamber") || "ab").toLowerCase() === "cd" ? "cd" : "ab";
const chamberWalls = chamberKey === "cd" ? ["C","D"] : ["A","B"];

if(tagTitle) tagTitle.textContent = chamberKey === "cd" ? "Furnace Cuboid — CD Walls" : "Furnace Cuboid — AB Walls";
if(tagSub) tagSub.textContent = chamberKey === "cd"
  ? "Front Wall C · Back Wall D · live burner + TST view"
  : "Front Wall A · Back Wall B · live burner + TST view";
document.title = chamberKey === "cd" ? "Cuboid — CD Walls" : "Cuboid — AB Walls";

let pushedCuboidLiveDigest = "";
let pushedCuboidLiveData = null;
let liveSnapshot = null;
let livePresentationDirty = true;
const liveBurnerObjects = [];
const liveFaceOverlays = {};

function cuboidGetParentApp(){
  try{
    if(window.parent && window.parent !== window && window.parent.location && window.parent.location.origin === window.location.origin){
      return window.parent;
    }
  }catch(_e){}
  return null;
}

function cuboidCloneJson(value){
  try{ return JSON.parse(JSON.stringify(value == null ? null : value)); }catch(_e){}
  return null;
}

function cuboidConsumeLiveState(payload, digest){
  const nextDigest = String(digest || "");
  const nextPayload = (payload && typeof payload === "object") ? cuboidCloneJson(payload) : null;
  if(!nextPayload) return false;
  if(nextDigest && nextDigest === pushedCuboidLiveDigest) return false;
  pushedCuboidLiveDigest = nextDigest || ("cuboid-live-" + Date.now());
  pushedCuboidLiveData = nextPayload;
  livePresentationDirty = true;
  return true;
}

function cuboidPrimeLiveDataFromHost(){
  const appHost = cuboidGetParentApp();
  if(!appHost || typeof appHost.cuboidHostGetLiveState !== "function") return false;
  try{
    const state = appHost.cuboidHostGetLiveState();
    if(!state || !state.payload) return false;
    return cuboidConsumeLiveState(state.payload, state.digest);
  }catch(_e){}
  return false;
}

function cuboidNormalizeBurnerState(raw){
  const s = String(raw == null ? "" : raw).toUpperCase().trim();
  return (s === "O" || s === "N" || s === "B" || s === "C") ? s : "C";
}

function cuboidBuildDefaultBurnerData(){
  const defaultPatterns = [
    ["N","O","N","B","N","O","N","O","B","N","O","N","O","N","O"],
    ["O","N","O","N","O","B","O","N","O","N","B","O","N","O","N"],
    ["B","N","O","N","N","O","N","O","N","O","N","O","B","N","O"],
    ["N","O","B","O","N","O","N","B","O","N","O","N","O","O","N"],
    ["O","N","N","O","B","N","O","N","O","B","N","O","N","N","O"],
    ["N","B","O","N","O","N","O","N","B","O","N","O","N","O","N"]
  ];
  const walls = ["A","B","C","D"];
  const hmData = {};
  for(let wi = 0; wi < walls.length; wi++){
    hmData[walls[wi]] = [];
    for(let ri = 0; ri < 6; ri++){
      hmData[walls[wi]].push(defaultPatterns[(ri + wi) % defaultPatterns.length].slice());
    }
  }
  return hmData;
}

function cuboidSanitizeBurnerSnapshot(source){
  const walls = ["A","B","C","D"];
  const out = {};
  const src = source && typeof source === "object" ? source : {};
  for(let wi = 0; wi < walls.length; wi++){
    const wall = walls[wi];
    const srcRows = Array.isArray(src[wall]) ? src[wall] : [];
    out[wall] = [];
    for(let ri = 0; ri < 6; ri++){
      const srcRow = Array.isArray(srcRows[ri]) ? srcRows[ri] : [];
      const row = [];
      for(let bi = 0; bi < 15; bi++) row.push(cuboidNormalizeBurnerState(srcRow[bi]));
      out[wall].push(row);
    }
  }
  return out;
}

function cuboidNormalizeOpeningValue(raw, state){
  const fallback = cuboidNormalizeBurnerState(state) === "C" ? 0 : 100;
  const hasRaw = !(raw == null || raw === "");
  let n = Number(raw);
  if(!hasRaw || !isFinite(n) || n < 0) n = fallback;
  n = Math.round(n / 25) * 25;
  return Math.max(0, Math.min(100, n));
}

function cuboidBuildDefaultOpeningData(stateSource){
  const states = stateSource && typeof stateSource === "object" ? stateSource : cuboidBuildDefaultBurnerData();
  const walls = ["A","B","C","D"];
  const out = {};
  for(let wi = 0; wi < walls.length; wi++){
    const wall = walls[wi];
    const stateRows = Array.isArray(states[wall]) ? states[wall] : [];
    out[wall] = [];
    for(let ri = 0; ri < 6; ri++){
      const stateRow = Array.isArray(stateRows[ri]) ? stateRows[ri] : [];
      const row = [];
      for(let bi = 0; bi < 15; bi++) row.push(cuboidNormalizeOpeningValue(null, stateRow[bi]));
      out[wall].push(row);
    }
  }
  return out;
}

function cuboidSanitizeOpeningSnapshot(source, stateSource){
  const src = source && typeof source === "object" ? source : {};
  const states = stateSource && typeof stateSource === "object" ? stateSource : cuboidBuildDefaultBurnerData();
  const walls = ["A","B","C","D"];
  const out = {};
  for(let wi = 0; wi < walls.length; wi++){
    const wall = walls[wi];
    const srcRows = Array.isArray(src[wall]) ? src[wall] : [];
    const stateRows = Array.isArray(states[wall]) ? states[wall] : [];
    out[wall] = [];
    for(let ri = 0; ri < 6; ri++){
      const srcRow = Array.isArray(srcRows[ri]) ? srcRows[ri] : [];
      const stateRow = Array.isArray(stateRows[ri]) ? stateRows[ri] : [];
      const row = [];
      for(let bi = 0; bi < 15; bi++){
        row.push(cuboidNormalizeOpeningValue(srcRow[bi], stateRow[bi]));
      }
      out[wall].push(row);
    }
  }
  return out;
}

function cuboidSanitizeTstRow(vals){
  const out = [];
  const src = Array.isArray(vals) ? vals : [];
  for(let i = 0; i < 15; i++){
    const n = Number(src[i]);
    out.push(isFinite(n) ? n : "");
  }
  return out;
}

function cuboidResolvePeepEntry(){
  if(!pushedCuboidLiveData) cuboidPrimeLiveDataFromHost();
  if(pushedCuboidLiveData){
    return {
      peepHoles:{
        "ab-bot": cuboidSanitizeTstRow(pushedCuboidLiveData.abBot || []),
        "ab-top": cuboidSanitizeTstRow(pushedCuboidLiveData.abTop || []),
        "cd-bot": cuboidSanitizeTstRow(pushedCuboidLiveData.cdBot || []),
        "cd-top": cuboidSanitizeTstRow(pushedCuboidLiveData.cdTop || [])
      },
      dt: pushedCuboidLiveData.entryDt || "Latest",
      selectedShift: pushedCuboidLiveData.selectedShift || "All"
    };
  }
  return {
    peepHoles:{
      "ab-bot": Array(15).fill(""),
      "ab-top": Array(15).fill(""),
      "cd-bot": Array(15).fill(""),
      "cd-top": Array(15).fill("")
    },
    dt:"Latest",
    selectedShift:"All"
  };
}

function cuboidGetPeepRow(entry, key){
  if(!entry || !entry.peepHoles || !entry.peepHoles[key]) return Array(15).fill("");
  return cuboidSanitizeTstRow(entry.peepHoles[key]);
}

function cuboidBuildLiveSnapshot(){
  if(!pushedCuboidLiveData) cuboidPrimeLiveDataFromHost();
  const hmData = pushedCuboidLiveData && pushedCuboidLiveData.hmData
    ? cuboidSanitizeBurnerSnapshot(pushedCuboidLiveData.hmData)
    : cuboidBuildDefaultBurnerData();
  const entry = cuboidResolvePeepEntry();
  return {
    hmData: hmData,
    openingData: pushedCuboidLiveData && pushedCuboidLiveData.openingData
      ? cuboidSanitizeOpeningSnapshot(pushedCuboidLiveData.openingData, hmData)
      : cuboidBuildDefaultOpeningData(hmData),
    abBot: cuboidGetPeepRow(entry, "ab-bot"),
    abTop: cuboidGetPeepRow(entry, "ab-top"),
    cdBot: cuboidGetPeepRow(entry, "cd-bot"),
    cdTop: cuboidGetPeepRow(entry, "cd-top"),
    entryDt: entry.dt || "Latest",
    selectedShift: entry.selectedShift || "All"
  };
}

const burnerStatePalette = {
  B:{ flame:"#f7b54a", core:"#fff3c4", aura:"#6f5b40", metal:"#d17b1d", ring:"#50321b", glow:"#f59e0b" },
  N:{ flame:"#61c6ff", core:"#e8f8ff", aura:"#315d79", metal:"#3b82f6", ring:"#17315e", glow:"#38bdf8" },
  O:{ flame:"#ff8c4b", core:"#ffe0bf", aura:"#704230", metal:"#f97316", ring:"#5a260c", glow:"#fb923c" },
  C:{ flame:"#76808a", core:"#d9e0e7", aura:"#2b3136", metal:"#9aa4ae", ring:"#353b43", glow:"#94a3b8" }
};

function cuboidClamp01(value){
  const n = Number(value);
  if(!isFinite(n)) return 0;
  return Math.max(0, Math.min(1, n));
}

function cuboidDarkenColor(color, amount){
  const base = new THREE.Color(color);
  const hsl = { h:0, s:0, l:0 };
  base.getHSL(hsl);
  hsl.s = Math.max(0, Math.min(1, hsl.s * (1 + amount * 0.28)));
  hsl.l = Math.max(0, Math.min(1, hsl.l * (1 - amount)));
  return "#" + (new THREE.Color().setHSL(hsl.h, hsl.s, hsl.l)).getHexString();
}

function cuboidRoundRectPath(ctx, x, y, w, h, r){
  const radius = Math.max(0, Math.min(r, Math.min(w, h) * 0.5));
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function cuboidTempCellFill(value){
  if(value === "" || value == null) return "rgba(42,48,58,0.48)";
  const n = Number(value);
  const t = cuboidClamp01((n - 700) / 550);
  const hue = 208 - (t * 176);
  const light = 31 + (t * 19);
  const alpha = 0.52 + (t * 0.22);
  return "hsla(" + hue.toFixed(1) + ",84%," + light.toFixed(1) + "%," + alpha.toFixed(3) + ")";
}

function cuboidFormatTemp(value){
  const n = Number(value);
  return isFinite(n) ? String(Math.round(n)) : "--";
}

function cuboidGetTstRowsForWall(snapshot, wallKey){
  const isAbWall = wallKey === "A" || wallKey === "B";
  return {
    top: cuboidSanitizeTstRow(isAbWall ? snapshot.abTop : snapshot.cdTop),
    bot: cuboidSanitizeTstRow(isAbWall ? snapshot.abBot : snapshot.cdBot)
  };
}

function cuboidBuildFaceRowCenters(){
  const rowMarginBottom = FH * 0.11;
  const rowMarginTop = FH * 0.18;
  const rowSpan = FH - rowMarginBottom - rowMarginTop;
  const gapWeights = [1.65, 1.00, 1.65, 1.00, 1.00];
  const totalW = gapWeights.reduce(function(sum, value){ return sum + value; }, 0);
  const centers = {};
  centers[1] = -FH/2 + rowMarginBottom;
  let acc = 0;
  for(let i = 0; i < 5; i++){
    acc += (gapWeights[i] / totalW) * rowSpan;
    centers[i + 2] = -FH/2 + rowMarginBottom + acc;
  }
  return centers;
}

const cuboidFaceRowCenters = cuboidBuildFaceRowCenters();

function cuboidWorldYToOverlayPx(worldY, canvasHeight){
  return (1 - ((worldY + FH/2) / FH)) * canvasHeight;
}

function cuboidSetMaterialTone(material, color, emissiveColor, emissiveIntensity){
  if(!material) return;
  if(material.color) material.color.set(color);
  if(material.emissive) material.emissive.set(emissiveColor || color);
  if(typeof material.emissiveIntensity === "number") material.emissiveIntensity = emissiveIntensity;
  material.needsUpdate = true;
}

function cuboidDrawCanvasText(ctx, text, x, y, opts){
  const o = opts || {};
  ctx.save();
  ctx.font = o.font || "700 24px Georgia, 'Times New Roman', serif";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.baseline || "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = o.lineWidth || 4;
  ctx.strokeStyle = o.stroke || "rgba(5,8,14,0.88)";
  ctx.shadowColor = o.shadowColor || "rgba(0,0,0,0.38)";
  ctx.shadowBlur = o.shadowBlur == null ? 8 : o.shadowBlur;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = o.fill || "#ffffff";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function cuboidDrawTempStrip(ctx, heading, values, x, y, w, h){
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.34)";
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  cuboidRoundRectPath(ctx, x, y, w, h, 20);
  const bg = ctx.createLinearGradient(x, y, x, y + h);
  bg.addColorStop(0, "rgba(5,9,16,0.90)");
  bg.addColorStop(0.52, "rgba(10,18,28,0.84)");
  bg.addColorStop(1, "rgba(6,10,18,0.88)");
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(176,206,234,0.28)";
  ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.restore();

  const gloss = ctx.createLinearGradient(x, y, x, y + h * 0.48);
  gloss.addColorStop(0, "rgba(255,255,255,0.12)");
  gloss.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gloss;
  cuboidRoundRectPath(ctx, x + 2, y + 2, w - 4, Math.max(18, h * 0.42), 18);
  ctx.fill();

  const labelW = 212;
  cuboidRoundRectPath(ctx, x + 10, y + 10, labelW, h - 20, 16);
  const labelGrad = ctx.createLinearGradient(x + 10, y + 10, x + 10 + labelW, y + h - 10);
  labelGrad.addColorStop(0, "rgba(10,18,34,0.98)");
  labelGrad.addColorStop(0.55, "rgba(18,27,48,0.94)");
  labelGrad.addColorStop(1, "rgba(8,14,24,0.96)");
  ctx.fillStyle = labelGrad;
  ctx.fill();
  ctx.strokeStyle = "rgba(108,162,224,0.40)";
  ctx.lineWidth = 1.9;
  ctx.stroke();

  cuboidDrawCanvasText(ctx, heading, x + 28, y + (h * 0.5) - 10, {
    font: "700 31px Georgia, 'Times New Roman', serif",
    fill: "#f7fbff",
    stroke: "rgba(4,8,16,0.94)",
    lineWidth: 6,
    shadowBlur: 10
  });
  cuboidDrawCanvasText(ctx, "15 burners", x + 28, y + (h * 0.5) + 18, {
    font: "700 19px Georgia, 'Times New Roman', serif",
    fill: "rgba(224,236,248,0.94)",
    stroke: "rgba(4,8,16,0.88)",
    lineWidth: 4,
    shadowBlur: 6
  });

  const cellsX = x + labelW + 22;
  const cellsW = w - labelW - 34;
  const gap = 9;
  const cellW = (cellsW - (gap * 14)) / 15;
  const cellH = h - 22;
  const cellY = y + 11;

  for(let i = 0; i < 15; i++){
    const cellX = cellsX + (i * (cellW + gap));
    const innerX = cellX + 2;
    const innerY = cellY + 2;
    const innerW = cellW - 4;
    const innerH = cellH - 4;
    cuboidRoundRectPath(ctx, cellX, cellY, cellW, cellH, 12);
    const shellGrad = ctx.createLinearGradient(cellX, cellY, cellX, cellY + cellH);
    shellGrad.addColorStop(0, "rgba(6,10,16,0.98)");
    shellGrad.addColorStop(1, "rgba(10,16,24,0.96)");
    ctx.fillStyle = shellGrad;
    ctx.fill();
    cuboidRoundRectPath(ctx, innerX, innerY, innerW, innerH, 10);
    ctx.fillStyle = cuboidTempCellFill(values[i]);
    ctx.fill();
    const capH = Math.max(14, innerH * 0.26);
    cuboidRoundRectPath(ctx, innerX + 1, innerY + 1, innerW - 2, capH, 10);
    const capGrad = ctx.createLinearGradient(innerX, innerY, innerX, innerY + capH);
    capGrad.addColorStop(0, "rgba(255,255,255,0.16)");
    capGrad.addColorStop(1, "rgba(255,255,255,0.02)");
    ctx.fillStyle = capGrad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    cuboidDrawCanvasText(ctx, "B" + (i + 1), cellX + (cellW * 0.5), cellY + 14, {
      font: "700 15px 'Courier New', monospace",
      align: "center",
      fill: "rgba(244,249,255,0.96)",
      stroke: "rgba(6,10,16,0.86)",
      lineWidth: 4,
      shadowBlur: 4
    });
    cuboidDrawCanvasText(ctx, cuboidFormatTemp(values[i]), cellX + (cellW * 0.5), cellY + (cellH * 0.63), {
      font: "700 28px Georgia, 'Times New Roman', serif",
      align: "center",
      fill: "#ffffff",
      stroke: "rgba(4,8,14,0.90)",
      lineWidth: 6,
      shadowBlur: 8
    });
  }
}

function cuboidRenderFaceOverlay(faceName){
  const overlay = liveFaceOverlays[faceName];
  if(!overlay || !overlay.canvas || !overlay.texture) return;
  const snapshot = liveSnapshot || cuboidBuildLiveSnapshot();
  const ctx = overlay.canvas.getContext("2d");
  const w = overlay.canvas.width;
  const h = overlay.canvas.height;
  const wallKey = overlay.wallKey;
  const tstRows = cuboidGetTstRowsForWall(snapshot, wallKey);
  const shiftLabel = String(snapshot && snapshot.selectedShift ? snapshot.selectedShift : "All");
  const dtLabel = String(snapshot && snapshot.entryDt ? snapshot.entryDt : "Latest");

  ctx.clearRect(0, 0, w, h);

  const edgeFade = ctx.createLinearGradient(0, 0, 0, h);
  edgeFade.addColorStop(0, "rgba(6,10,18,0.22)");
  edgeFade.addColorStop(0.18, "rgba(6,10,18,0)");
  edgeFade.addColorStop(0.82, "rgba(6,10,18,0)");
  edgeFade.addColorStop(1, "rgba(6,10,18,0.24)");
  ctx.fillStyle = edgeFade;
  ctx.fillRect(0, 0, w, h);

  cuboidRoundRectPath(ctx, 28, 24, 460, 72, 22);
  const headGrad = ctx.createLinearGradient(28, 24, 488, 96);
  headGrad.addColorStop(0, "rgba(5,10,18,0.78)");
  headGrad.addColorStop(1, "rgba(11,18,30,0.62)");
  ctx.fillStyle = headGrad;
  ctx.fill();
  ctx.strokeStyle = "rgba(134,166,204,0.28)";
  ctx.lineWidth = 2;
  ctx.stroke();

  cuboidDrawCanvasText(ctx, "WALL " + wallKey, 52, 58, {
    font: "700 34px Georgia, 'Times New Roman', serif",
    fill: "#f6f9ff",
    stroke: "rgba(4,8,16,0.92)",
    lineWidth: 6,
    shadowBlur: 8
  });
  cuboidDrawCanvasText(ctx, shiftLabel + " · " + dtLabel, w - 42, 58, {
    font: "700 20px Georgia, 'Times New Roman', serif",
    align: "right",
    fill: "rgba(244,248,255,0.94)",
    stroke: "rgba(4,8,14,0.88)",
    lineWidth: 4,
    shadowBlur: 6
  });

  const stripH = 74;
  const topMidY = cuboidWorldYToOverlayPx(((cuboidFaceRowCenters[4] + cuboidFaceRowCenters[3]) * 0.5) + 0.10, h);
  const botMidY = cuboidWorldYToOverlayPx(((cuboidFaceRowCenters[2] + cuboidFaceRowCenters[1]) * 0.5) + 0.14, h);
  cuboidDrawTempStrip(ctx, "TST TOP", tstRows.top, 28, topMidY - (stripH * 0.5), w - 56, stripH);
  cuboidDrawTempStrip(ctx, "TST BOT", tstRows.bot, 28, botMidY - (stripH * 0.5), w - 56, stripH);

  overlay.texture.needsUpdate = true;
}

function cuboidApplyBurnerPresentation(item, snapshot){
  if(!item || !snapshot || !item.wallKey) return;
  const rowIndex = Math.max(0, Math.min(5, Number(item.rowNumber || 1) - 1));
  const burnerIndex = Math.max(0, Math.min(14, Number(item.burnerNumber || 1) - 1));
  const stateRows = snapshot.hmData && Array.isArray(snapshot.hmData[item.wallKey]) ? snapshot.hmData[item.wallKey] : [];
  const openingRows = snapshot.openingData && Array.isArray(snapshot.openingData[item.wallKey]) ? snapshot.openingData[item.wallKey] : [];
  const stateRow = Array.isArray(stateRows[rowIndex]) ? stateRows[rowIndex] : [];
  const openingRow = Array.isArray(openingRows[rowIndex]) ? openingRows[rowIndex] : [];
  const state = cuboidNormalizeBurnerState(stateRow[burnerIndex]);
  const opening = cuboidNormalizeOpeningValue(openingRow[burnerIndex], state);
  const palette = burnerStatePalette[state] || burnerStatePalette.C;
  const metalTone = cuboidDarkenColor(palette.metal, 0.26);
  const collarTone = cuboidDarkenColor(palette.metal, 0.12);
  const ringTone = cuboidDarkenColor(palette.ring, 0.08);
  const portTone = cuboidDarkenColor(palette.metal, 0.38);
  const shadowTone = cuboidDarkenColor(palette.ring, 0.32);
  const glowTone = cuboidDarkenColor(palette.glow, 0.20);
  const flameLevel = (state === "C" || opening <= 0) ? 0 : cuboidClamp01(opening / 100);
  const showFlame = flameLevel > 0.001;

  item.liveState = state;
  item.liveOpening = opening;
  item.liveFlameLevel = flameLevel;

  cuboidSetMaterialTone(item.stub && item.stub.material, metalTone, shadowTone, 0.08 + (flameLevel * 0.14));
  cuboidSetMaterialTone(item.collar && item.collar.material, collarTone, glowTone, 0.04 + (flameLevel * 0.10));
  cuboidSetMaterialTone(item.lockRing && item.lockRing.material, collarTone, glowTone, 0.04 + (flameLevel * 0.08));
  cuboidSetMaterialTone(item.ring && item.ring.material, ringTone, shadowTone, 0.05 + (flameLevel * 0.10));
  cuboidSetMaterialTone(item.port && item.port.material, portTone, shadowTone, 0.04 + (flameLevel * 0.08));

  if(item.glow && item.glow.material && item.glow.material.color) item.glow.material.color.set(palette.glow);
  if(item.auraFlame && item.auraFlame.material && item.auraFlame.material.color) item.auraFlame.material.color.set(palette.aura);
  if(item.outerFlame && item.outerFlame.material && item.outerFlame.material.color) item.outerFlame.material.color.set(palette.flame);
  if(item.innerFlame && item.innerFlame.material && item.innerFlame.material.color) item.innerFlame.material.color.set(palette.core);
  if(item.flameTip && item.flameTip.material && item.flameTip.material.color) item.flameTip.material.color.set(palette.core);

  if(item.flameAnchor) item.flameAnchor.visible = showFlame;
  if(item.glow) item.glow.visible = showFlame;
  if(item.auraFlame) item.auraFlame.visible = showFlame;
  if(item.outerFlame) item.outerFlame.visible = showFlame;
  if(item.innerFlame) item.innerFlame.visible = showFlame;
  if(item.flameTip) item.flameTip.visible = showFlame;
}

function refreshLivePresentation(force){
  if(!force && !livePresentationDirty && liveSnapshot) return false;
  liveSnapshot = cuboidBuildLiveSnapshot();
  liveBurnerObjects.forEach(function(item){
    cuboidApplyBurnerPresentation(item, liveSnapshot);
  });
  cuboidRenderFaceOverlay("front");
  cuboidRenderFaceOverlay("back");
  livePresentationDirty = false;
  return true;
}

function targetPR(){
  const dr = Math.max(1, window.devicePixelRatio || 1);
  const active = isFs() || hasMotion();
  const cap = !canRender() ? 0.65 : active ? (isChrome ? 1.06 : 1.45) : (isChrome ? 0.88 : 1.28);

}

}

/* 25002500 DEPTH OCCLUDER BOX 2500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500
   Invisible solid box = same shell size. colorWrite:false so
   never drawn; depthWrite:true so always blocks depth buffer.
   renderOrder:-1 renders first, flames never bleed through.
   25002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500 */
/* ── PER-FACE DEPTH OCCLUDERS ────────────────────────────────────────
   One invisible depth-write plane per solid shell face.
   colorWrite:false → invisible. depthWrite:true → stamps depth buffer.
   renderOrder:-2 → renders before everything else.
   Side panels use ShapeGeometry with peephole cutouts so the holes
   remain transparent (no depth written there = interior visible).
   ─────────────────────────────────────────────────────────────────── */
(function buildOccluders(){
  const mat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, side: THREE.DoubleSide });

  // Front face occluder
  const oFront = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), mat.clone());
  oFront.position.z = FD/2; oFront.renderOrder = -2; group.add(oFront);

  // Back face occluder
  const oBack = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), mat.clone());
  oBack.position.z = -FD/2; oBack.rotation.y = Math.PI; oBack.renderOrder = -2; group.add(oBack);

  // Top cap occluder
  const oTop = new THREE.Mesh(new THREE.PlaneGeometry(FW, FD), mat.clone());
  oTop.rotation.x = -Math.PI/2; oTop.position.y = FH/2; oTop.renderOrder = -2; group.add(oTop);

  // Bottom cap occluder
  const oBot = new THREE.Mesh(new THREE.PlaneGeometry(FW, FD), mat.clone());
  oBot.rotation.x = Math.PI/2; oBot.position.y = -FH/2; oBot.renderOrder = -2; group.add(oBot);

  // Side panel occluders — ShapeGeometry with peephole cutouts (mirrors makeSide geometry)
  [true, false].forEach(function(isLeft){
    const pw = FD * 0.52, ph = pw;
    const sh = new THREE.Shape();
    sh.moveTo(-FD/2, -FH/2); sh.lineTo(FD/2, -FH/2);
    sh.lineTo(FD/2, FH/2);   sh.lineTo(-FD/2, FH/2); sh.lineTo(-FD/2, -FH/2);
    [FH*0.18, -FH*0.18].forEach(function(cy){
      const hole = new THREE.Path();
      hole.moveTo(-pw/2, cy-ph/2); hole.lineTo(pw/2, cy-ph/2);
      hole.lineTo(pw/2, cy+ph/2);  hole.lineTo(-pw/2, cy+ph/2); hole.lineTo(-pw/2, cy-ph/2);
      sh.holes.push(hole);
    });
    const oSide = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat.clone());
    oSide.rotation.y = isLeft ? -Math.PI/2 : Math.PI/2;
    oSide.position.x = isLeft ? -FW/2 : FW/2;
    oSide.renderOrder = -2;
    group.add(oSide);
  });
})();

/* ── furnace steel texture — dark iron, rust, heat stain, grime ── */
function makeMetalCanvas(w, h, opts){
  const o = opts || {};
  const ss = Number(o.seedShift) || 0;
  const mc = document.createElement("canvas");
  mc.width = w; mc.height = h;
  const g = mc.getContext("2d");

  function noise(s){ let x = Math.sin(s*127.1 + ss*311.7)*43758.5453123; return x - Math.floor(x); }
  function clamp(v){ return Math.max(0,Math.min(255,Math.round(v))); }
  function rgba(r,gg,b,a){ return "rgba("+clamp(r)+","+clamp(gg)+","+clamp(b)+","+a+")"; }

  /* 1 ── STEEL BASE — blue-grey industrial steel tones */
  const base = g.createLinearGradient(0,0,w,h);
  base.addColorStop(0.00,"#6e7880");
  base.addColorStop(0.15,"#7e8a92");
  base.addColorStop(0.32,"#727e86");
  base.addColorStop(0.50,"#6a7680");
  base.addColorStop(0.68,"#788490");
  base.addColorStop(0.84,"#6c7880");
  base.addColorStop(1.00,"#606c74");
  g.fillStyle = base; g.fillRect(0,0,w,h);

  /* 2 ── PLATE PANELS — each plate slightly different steel shade */
  const pXs=[0,Math.round(w*.26),Math.round(w*.52),Math.round(w*.78),w];
  const pYs=[0,Math.round(h*.35),Math.round(h*.68),h];
  for(let py=0;py<pYs.length-1;py++) for(let px=0;px<pXs.length-1;px++){
    const idx=py*(pXs.length-1)+px;
    const x0=pXs[px],y0=pYs[py],x1=pXs[px+1],y1=pYs[py+1];
    const br = -10 + noise(idx*7+1)*22;
    const blue = noise(idx*3+2)<0.5 ? 6 : -4;  // some plates bluer, some greyer
    const alpha = 0.09 + noise(idx*11+3)*0.10;
    g.fillStyle = rgba(108+br, 116+br, 124+br+blue, alpha);
    g.fillRect(x0,y0,x1-x0,y1-y0);
    // subtle cross-hatch light/shadow per plate
    const pg = g.createLinearGradient(x0,y0,x1,y1);
    pg.addColorStop(0,   rgba(240,244,248, 0.06+noise(idx*5+4)*0.04));
    pg.addColorStop(0.5, "rgba(0,0,0,0)");
    pg.addColorStop(1,   rgba(20,22,24,   0.08+noise(idx*9+5)*0.05));
    g.fillStyle=pg; g.fillRect(x0,y0,x1-x0,y1-y0);
  }

  /* 3 ── RUST ACCENT PATCHES — moderate, not dominant */
  const rustPalette=[
    [158,78,22],[136,58,14],[170,90,28],[118,50,12],[148,68,20]
  ];
  for(let r=0;r<32;r++){
    const rx=noise(r*13+10)*w, ry=noise(r*17+20)*h;
    const rsz=12+noise(r*23+30)*70;
    const col=rustPalette[Math.floor(noise(r*7+40)*rustPalette.length)];
    const alpha=0.10+noise(r*31+50)*0.22;  // kept light — accent only
    const rg=g.createRadialGradient(rx,ry,0,rx,ry,rsz);
    rg.addColorStop(0,  rgba(col[0],col[1],col[2],alpha));
    rg.addColorStop(0.5,rgba(col[0],col[1],col[2],alpha*0.4));
    rg.addColorStop(1,  "rgba(0,0,0,0)");
    g.fillStyle=rg;
    g.beginPath();
    g.ellipse(rx,ry,rsz,rsz*(0.4+noise(r*19+60)*0.7),noise(r*29+70)*Math.PI,0,Math.PI*2);
    g.fill();
  }

  /* 4 ── HEAT TINT — subtle blue-purple oxidation zones */
  for(let h2=0;h2<6;h2++){
    const hy=noise(h2*41+80)*h, hspan=50+noise(h2*37+90)*160;
    const hAlpha=0.03+noise(h2*53+100)*0.06;
    const hg=g.createRadialGradient(w*0.5,hy,0,w*0.5,hy,hspan);
    hg.addColorStop(0,  rgba(80,78,120,hAlpha));
    hg.addColorStop(0.5,rgba(60,58,100,hAlpha*0.3));
    hg.addColorStop(1,  "rgba(0,0,0,0)");
    g.fillStyle=hg; g.fillRect(0,0,w,h);
  }

  /* 5 ── GRIME STREAKS — dark vertical drips */
  for(let d=0;d<35;d++){
    const dx=noise(d*61+110)*w, dlen=50+noise(d*47+120)*280;
    const dy=noise(d*53+130)*(h-dlen), dw=1+noise(d*43+140)*4;
    const da=0.05+noise(d*37+150)*0.11;
    const dg=g.createLinearGradient(0,dy,0,dy+dlen);
    dg.addColorStop(0,  "rgba(14,14,16,0)");
    dg.addColorStop(0.2,rgba(14,14,16,da));
    dg.addColorStop(0.8,rgba(10,10,12,da*0.6));
    dg.addColorStop(1,  "rgba(10,10,12,0)");
    g.fillStyle=dg; g.fillRect(dx-dw/2,dy,dw,dlen);
  }

  /* 6 ── SURFACE MICRO-TEXTURE — pitting and scale */
  for(let s=0;s<280;s++){
    const sx=noise(s*17+160)*w, sy=noise(s*23+170)*h;
    const ssz=1.5+noise(s*31+180)*9;
    const bright=noise(s*41+190)<0.35;
    const sa=0.03+noise(s*37+200)*0.06;
    g.fillStyle=bright ? rgba(200,206,212,sa) : rgba(18,20,22,sa);
    g.beginPath();
    g.ellipse(sx,sy,ssz,ssz*(0.25+noise(s*29+210)*0.45),noise(s*13+220)*Math.PI,0,Math.PI*2);
    g.fill();
  }

  /* 7 ── WELD SEAMS */
  const hSeams=[Math.round(h*0.35),Math.round(h*0.68)];
  hSeams.forEach(function(sy){
    g.strokeStyle="rgba(20,20,22,0.85)"; g.lineWidth=3.5;
    g.beginPath(); g.moveTo(0,sy); g.lineTo(w,sy); g.stroke();
    const wg=g.createLinearGradient(0,sy-7,0,sy);
    wg.addColorStop(0,"rgba(220,210,190,0)");
    wg.addColorStop(1,"rgba(200,190,160,0.18)");
    g.fillStyle=wg; g.fillRect(0,sy-7,w,7);
    const sg=g.createLinearGradient(0,sy,0,sy+8);
    sg.addColorStop(0,"rgba(10,10,12,0.52)");
    sg.addColorStop(1,"rgba(10,10,12,0)");
    g.fillStyle=sg; g.fillRect(0,sy,w,8);
  });
  const vSeams=[Math.round(w*0.26),Math.round(w*0.52),Math.round(w*0.78)];
  vSeams.forEach(function(sx){
    g.strokeStyle="rgba(18,18,20,0.80)"; g.lineWidth=2.8;
    g.beginPath(); g.moveTo(sx,0); g.lineTo(sx,h); g.stroke();
    const lg=g.createLinearGradient(sx,0,sx+6,0);
    lg.addColorStop(0,"rgba(210,200,180,0.14)");
    lg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=lg; g.fillRect(sx,0,6,h);
  });

  /* 8 ── BOLTS & NUTS — raised hex-nut style, body + seam positions */
  // seam intersections
  const boltPos=[];
  hSeams.forEach(function(sy){
    vSeams.forEach(function(sx){ boltPos.push([sx,sy]); });
    // extra bolts along each horizontal seam
    for(let b=0;b<7;b++) boltPos.push([Math.round(w*(0.07+b*0.145)),sy]);
  });
  // body bolts — scattered on panels between seams
  const bodyZones=[
    [0,0,w*0.26,h*0.35],[w*0.26,0,w*0.52,h*0.35],[w*0.52,0,w*0.78,h*0.35],[w*0.78,0,w,h*0.35],
    [0,h*0.35,w*0.26,h*0.68],[w*0.26,h*0.35,w*0.52,h*0.68],[w*0.52,h*0.35,w*0.78,h*0.68],[w*0.78,h*0.35,w,h*0.68],
    [0,h*0.68,w*0.26,h],[w*0.26,h*0.68,w*0.52,h],[w*0.52,h*0.68,w*0.78,h],[w*0.78,h*0.68,w,h]
  ];
  bodyZones.forEach(function(z,zi){
    const zx0=z[0],zy0=z[1],zx1=z[2],zy1=z[3];
    const pad=w*0.04;
    // 2 corner bolts per panel
    [[zx0+pad,zy0+pad],[zx1-pad,zy0+pad],[zx0+pad,zy1-pad],[zx1-pad,zy1-pad]].forEach(function(pt,pi){
      if(noise(zi*31+pi*17+500)>0.45) boltPos.push([pt[0],pt[1]]);
    });
  });

  boltPos.forEach(function(bp,idx){
    const bx=bp[0], by=bp[1];
    const br=7.5+noise(idx*17+230)*2.0;  // slightly larger for visibility

    /* drop shadow */
    g.fillStyle="rgba(8,8,10,0.60)";
    g.beginPath(); g.arc(bx+2,by+2,br,0,Math.PI*2); g.fill();

    /* ── nut body: hexagonal raised steel shape ── */
    // outer hex border (slightly larger, dark edge)
    g.fillStyle=rgba(38,40,44,0.95);
    g.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+Math.PI/6;
      const px=bx+Math.cos(a)*(br+1.8), py=by+Math.sin(a)*(br+1.8);
      i===0?g.moveTo(px,py):g.lineTo(px,py);
    }
    g.closePath(); g.fill();

    // hex face — steel gradient with specular highlight (top-left lit)
    const bg=g.createRadialGradient(bx-br*0.35,by-br*0.35,br*0.1,bx,by,br*1.1);
    bg.addColorStop(0,   rgba(210,216,222,0.98));  // bright steel highlight
    bg.addColorStop(0.25,rgba(160,168,176,0.98));  // mid steel
    bg.addColorStop(0.55,rgba(110,118,126,0.98));  // darker steel
    bg.addColorStop(0.80,rgba(70,76,84,0.98));     // shadow edge
    bg.addColorStop(1,   rgba(44,48,54,0.98));
    g.fillStyle=bg;
    g.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+Math.PI/6;
      const px=bx+Math.cos(a)*br, py=by+Math.sin(a)*br;
      i===0?g.moveTo(px,py):g.lineTo(px,py);
    }
    g.closePath(); g.fill();

    // hex edge facets — subtle chamfer lines
    g.strokeStyle=rgba(240,244,248,0.30);
    g.lineWidth=0.9;
    g.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+Math.PI/6;
      const px=bx+Math.cos(a)*(br*0.88), py=by+Math.sin(a)*(br*0.88);
      i===0?g.moveTo(px,py):g.lineTo(px,py);
    }
    g.closePath(); g.stroke();

    // rust staining ring around nut base
    const rRing=g.createRadialGradient(bx,by,br*0.85,bx,by,br*1.7);
    rRing.addColorStop(0,rgba(140,62,14,0.22));
    rRing.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=rRing;
    g.beginPath(); g.arc(bx,by,br*1.7,0,Math.PI*2); g.fill();

    // centre bolt hole
    const hole=g.createRadialGradient(bx-1,by-1,0.5,bx,by,br*0.28);
    hole.addColorStop(0,"rgba(8,8,10,0.95)");
    hole.addColorStop(0.6,"rgba(20,20,24,0.80)");
    hole.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=hole;
    g.beginPath(); g.arc(bx,by,br*0.30,0,Math.PI*2); g.fill();
  });

  /* 9 ── SOOT / SMOKE — top darkening */
  const sootG=g.createLinearGradient(0,0,0,h*0.38);
  sootG.addColorStop(0,  "rgba(8,8,10,0.38)");
  sootG.addColorStop(0.5,"rgba(8,8,10,0.14)");
  sootG.addColorStop(1,  "rgba(0,0,0,0)");
  g.fillStyle=sootG; g.fillRect(0,0,w,h*0.38);

  /* 10 ── SPECULAR GLINTS — worn steel high spots */
  for(let gs=0;gs<28;gs++){
    const gsx=noise(gs*59+300)*w, gsy=noise(gs*67+310)*h;
    const gsl=20+noise(gs*71+320)*120;
    const gsang=-0.15+noise(gs*83+330)*0.3;
    const gAlpha=0.04+noise(gs*97+340)*0.06;
    g.strokeStyle=rgba(230,236,242,gAlpha);
    g.lineWidth=0.7+noise(gs*53+350)*1.4;
    g.beginPath();
    g.moveTo(gsx,gsy);
    g.lineTo(gsx+Math.cos(gsang)*gsl,gsy+Math.sin(gsang)*gsl);
    g.stroke();
  }

  return mc;
}

/* ── paint row + burner labels directly onto face canvas ──────────────
   The face plane spans FW × FH world units mapped to 1024×1024 px.
   Outer piping constants are replicated here to get exact UV positions.
   Row labels R1(bottom)–R6(top) on left edge.
   Burner labels B1–B15 left→right along bottom.
   ──────────────────────────────────────────────────────────────────── */
function paintFaceLabels(mc){
  const W = mc.width, H = mc.height;
  const g = mc.getContext("2d");

  /* ── replicate outer piping geometry in UV space ── */
  /* world → UV: uX = (worldX + FW/2) / FW,  uY = 1 - (worldY + FH/2) / FH */
  function wx2px(wx){ return ((wx + FW/2) / FW) * W; }
  function wy2py(wy){ return (1 - (wy + FH/2) / FH) * H; }

  const VERT_R_L  = 0.055;
  const vertXL_L  = -FW/2 + 0.18 + VERT_R_L;
  const vertXR_L  =  FW/2 - 0.18 - VERT_R_L;
  const MAN_R_L   = 0.038;
  const FLANGE_R_L= VERT_R_L * 1.65;
  const B_COUNT_L = 15;
  const EDGE_CLR_L= Math.max(FLANGE_R_L * 2.8, MAN_R_L * 7.0);
  const bXMin     = vertXL_L + EDGE_CLR_L + 1.0;  // matches 3D geometry shift
  const bXMax     = vertXR_L - EDGE_CLR_L;
  const bSpan     = bXMax - bXMin;
  const bXs       = [];
  for(let b=0;b<B_COUNT_L;b++) bXs[b] = bXMin + (bSpan/(B_COUNT_L-1))*b;

  const ROW_MAR_BOT = FH * 0.11;
  const ROW_MAR_TOP = FH * 0.18;
  const ROW_SP      = FH - ROW_MAR_BOT - ROW_MAR_TOP;
  const gW        = [1.65,1.00,1.65,1.00,1.00];
  const totW      = gW.reduce(function(a,b){return a+b;},0);
  const rY        = [];
  rY[0] = -FH/2 + ROW_MAR_BOT;
  let ac=0;
  for(let i=0;i<5;i++){ ac+=(gW[i]/totW)*ROW_SP; rY[i+1]=-FH/2+ROW_MAR_BOT+ac; }

  /* ── label draw helper ── */
  function drawLabel(text, cx, cy, opts){
    const o    = opts || {};
    const pw   = o.pw || 72;   // pill width px
    const ph   = o.ph || 32;   // pill height px
    const rad  = ph * 0.35;
    const x0   = cx - pw/2, y0 = cy - ph/2;

    /* dark pill background */
    g.beginPath();
    g.moveTo(x0+rad,y0); g.lineTo(x0+pw-rad,y0);
    g.quadraticCurveTo(x0+pw,y0,x0+pw,y0+rad);
    g.lineTo(x0+pw,y0+ph-rad); g.quadraticCurveTo(x0+pw,y0+ph,x0+pw-rad,y0+ph);
    g.lineTo(x0+rad,y0+ph); g.quadraticCurveTo(x0,y0+ph,x0,y0+ph-rad);
    g.lineTo(x0,y0+rad); g.quadraticCurveTo(x0,y0,x0+rad,y0);
    g.closePath();
    g.fillStyle   = o.bg || "rgba(6,12,22,0.88)";  g.fill();
    g.strokeStyle = o.border || "rgba(80,150,230,0.80)";
    g.lineWidth   = 3.5; g.stroke();

    /* text */
    const fs = o.fs || Math.round(ph * 0.52);
    g.font          = "bold " + fs + "px 'Courier New',monospace";
    g.textAlign     = "center";
    g.textBaseline  = "middle";
    g.shadowColor   = o.glow  || "rgba(100,200,255,0.90)";
    g.shadowBlur    = 7;
    g.fillStyle     = o.color || "#cce8ff";
    g.fillText(text, cx, cy);
    g.shadowBlur = 0;
  }

  /* ── ROW LABELS R1(bottom) → R6(top) — left of leftmost burner ── */
  const rowLabelX = wx2px(-FW/2 + 0.72);  // centred in freed left strip
  const rowLabelLift = 0.12;              // world-unit lift so labels clear the manifold tubes
  for(let r=0; r<6; r++){
    const cy = wy2py(rY[r] + rowLabelLift);
    drawLabel("R"+(r+1), rowLabelX, cy, {
      pw:190, ph:88,
      bg:"rgba(6,12,24,0.93)",
      border:"rgba(70,140,220,0.95)",
      color:"#cce8ff",
      glow:"rgba(80,180,255,0.95)",
      fs:52
    });
  }

  /* ── BURNER LABELS B1–B15 — below bottom row ── */
  const burnerLabelY = wy2py(rY[0] - 0.40);
  for(let b=0; b<B_COUNT_L; b++){
    const cx = wx2px(bXs[b]);
    drawLabel("B"+(b+1), cx, burnerLabelY, {
      pw:110, ph:76,
      bg:"rgba(22,8,4,0.93)",
      border:"rgba(210,110,30,0.95)",
      color:"#ffd090",
      glow:"rgba(255,140,30,0.95)",
      fs:48
    });
  }
}

/* ── SIDE PANELS with peep holes (exact from original) ── */
function makeSide(isLeft){
  const pw = FD * 0.52, ph = pw;
  const pms = 1.2; // peepFrameMarginScale
  const sideX = isLeft ? -FW/2 : FW/2;
  const inward = isLeft ? 1 : -1;
  const peepBaffleDepth = Math.min(0.58, FD * 0.38);
  const peepBaffleThk = Math.max(0.045, pw * 0.055);
  const peepFrameMat = new THREE.MeshStandardMaterial({
    color: 0x6e7c88,    // steel frame
    map: texFrame,
    roughness: 0.62,
    metalness: 0.85,
    emissive: 0x0a1016,
    emissiveIntensity: 0.16,
    side: THREE.DoubleSide
  });
  const peepBaffleMat = new THREE.MeshStandardMaterial({
    color: 0x111418,
    roughness: 0.92,
    metalness: 0.08,
    emissive: 0x040608,
    emissiveIntensity: 0.05
  });

  // panel shape with two square peep holes
  const sh = new THREE.Shape();
  sh.moveTo(-FD/2, -FH/2);
  sh.lineTo( FD/2, -FH/2);
  sh.lineTo( FD/2,  FH/2);
  sh.lineTo(-FD/2,  FH/2);
  sh.lineTo(-FD/2, -FH/2);

  [FH*0.18, -FH*0.18].forEach(function(cy){
    const hole = new THREE.Path();
    hole.moveTo(-pw/2, cy-ph/2);
    hole.lineTo( pw/2, cy-ph/2);
    hole.lineTo( pw/2, cy+ph/2);
    hole.lineTo(-pw/2, cy+ph/2);
    hole.lineTo(-pw/2, cy-ph/2);
    sh.holes.push(hole);
  });

  const panel = new THREE.Mesh(new THREE.ShapeGeometry(sh), shellM(texSide));
  panel.rotation.y = isLeft ? -Math.PI/2 : Math.PI/2;
  panel.position.x = sideX;
  group.add(panel);

  // peep-hole frames + slim side baffles to block cross-face flame bleed
  [FH*0.18, -FH*0.18].forEach(function(cy){
    const fmx = pw*0.045*pms, fmy = ph*0.045*pms;
    const fw = pw + fmx*2, fhh = ph + fmy*2;
    const fs = new THREE.Shape();
    fs.moveTo(-fw/2, cy-fhh/2);
    fs.lineTo( fw/2, cy-fhh/2);
    fs.lineTo( fw/2, cy+fhh/2);
    fs.lineTo(-fw/2, cy+fhh/2);
    fs.lineTo(-fw/2, cy-fhh/2);
    const fh2 = new THREE.Path();
    fh2.moveTo(-pw/2, cy-ph/2);
    fh2.lineTo( pw/2, cy-ph/2);
    fh2.lineTo( pw/2, cy+ph/2);
    fh2.lineTo(-pw/2, cy+ph/2);
    fh2.lineTo(-pw/2, cy-ph/2);
    fs.holes.push(fh2);
    const frameMesh = new THREE.Mesh(
      new THREE.ShapeGeometry(fs),
      peepFrameMat.clone()
    );
    frameMesh.rotation.y = isLeft ? -Math.PI/2 : Math.PI/2;
    frameMesh.position.x = sideX + (isLeft ? -0.02 : 0.02);
    group.add(frameMesh);

    const baffleLen = peepBaffleDepth;
    const baffleCx = sideX + inward * (baffleLen * 0.5 - 0.01);
    [
      { size: [baffleLen, ph + peepBaffleThk * 1.2, peepBaffleThk], pos: [baffleCx, cy,  pw * 0.5 + peepBaffleThk * 0.5] },
      { size: [baffleLen, ph + peepBaffleThk * 1.2, peepBaffleThk], pos: [baffleCx, cy, -pw * 0.5 - peepBaffleThk * 0.5] }
    ].forEach(function(part){
      const baffle = new THREE.Mesh(
        new THREE.BoxGeometry(part.size[0], part.size[1], part.size[2]),
        peepBaffleMat.clone()
      );
      baffle.position.set(part.pos[0], part.pos[1], part.pos[2]);
      group.add(baffle);
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   8 TUBES (full height) + TOP COMMON HEADER
   Tubes run from bottom-face protrusion all the way up through
   the cuboid body, protrude above top face, and connect to a
   single horizontal header pipe spanning full FW.
   ═══════════════════════════════════════════════════════════ */

(function buildTubesAndHeader(){

  /* ── materials ─────────────────────────────────────────── */
  const mTube = new THREE.MeshStandardMaterial({
    color: 0x5c6b75,
    roughness: 0.30,
    metalness: 0.95,
    emissive: 0x0a1018,
    emissiveIntensity: 0.20
  });

  const mCollar = new THREE.MeshStandardMaterial({
    color: 0xa8b4be,
    roughness: 0.14,
    metalness: 0.98,
    emissive: 0x16222c,
    emissiveIntensity: 0.16
  });

  const mHeader = new THREE.MeshStandardMaterial({
    color: 0x78909c,
    roughness: 0.18,
    metalness: 0.97,
    emissive: 0x0f1c25,
    emissiveIntensity: 0.28
  });

  const mCap = new THREE.MeshStandardMaterial({
    color: 0x9baebb,
    roughness: 0.12,
    metalness: 0.99,
    emissive: 0x182530,
    emissiveIntensity: 0.18
  });

  const mRust = new THREE.MeshStandardMaterial({
    color: 0x7a3a14,
    roughness: 0.94,
    metalness: 0.06,
    emissive: 0x2a0e04,
    emissiveIntensity: 0.10,
    transparent: true,
    opacity: 0.28
  });

  /* ── dimensions ─────────────────────────────────────────── */
  const N          = 8;
  const TUBE_R     = 0.090;
  const PROTRUDE_T = 0.40;          // how much tube sticks above top face
  const PROTRUDE_B = 0.0;           // tube lands flush at bottom face, no protrusion
  const COLLAR_R   = TUBE_R * 1.38;
  const COLLAR_H   = 0.072;
  const HDR_R      = 0.130;
  const HDR_Y      = FH/2 + PROTRUDE_T + HDR_R * 1.1;  // header centre Y

  // full tube length: protrusion below + full body height + protrusion above
  const TUBE_TOTAL = PROTRUDE_B + FH + PROTRUDE_T;
  // tube centre Y: midpoint between bottom protrusion tip and top protrusion tip
  const TUBE_CY    = -FH/2 - PROTRUDE_B + TUBE_TOTAL/2;

  /* ── even spacing across FW ─────────────────────────────── */
  const margin = FW * 0.055;
  const span   = FW - margin * 2;

  function tx(i){ return -FW/2 + margin + (span / (N-1)) * i; }

  for(let i = 0; i < N; i++){
    const x = tx(i);

    /* tube body — full height */
    const tube = new THREE.Mesh(
      new THREE.CylinderGeometry(TUBE_R, TUBE_R, TUBE_TOTAL, 22, 1),
      mTube.clone()
    );
    tube.position.set(x, TUBE_CY, 0);
    group.add(tube);

    /* rust sleeve — mid-section only */
    const rustH = TUBE_TOTAL * 0.55;
    const rust = new THREE.Mesh(
      new THREE.CylinderGeometry(TUBE_R * 1.045, TUBE_R * 1.06, rustH, 22, 1),
      mRust.clone()
    );
    rust.position.set(x, TUBE_CY + (Math.sin(i * 1.3) * FH * 0.12), 0);
    group.add(rust);

    /* collar at top face (tube exits top) */
    const colT = new THREE.Mesh(
      new THREE.CylinderGeometry(COLLAR_R, COLLAR_R * 0.90, COLLAR_H, 20),
      mCollar.clone()
    );
    colT.position.set(x, FH/2 + COLLAR_H * 0.5, 0);
    group.add(colT);

    /* tube lands flush at bottom face — no collar needed */

    /* junction ring where tube meets header */
    const junc = new THREE.Mesh(
      new THREE.TorusGeometry(HDR_R * 1.08, HDR_R * 0.16, 12, 24),
      mCollar.clone()
    );
    junc.rotation.y = Math.PI/2;
    junc.position.set(x, HDR_Y, 0);
    group.add(junc);
  }

  /* ── header pipe (horizontal, along X) ──────────────────── */
  const header = new THREE.Mesh(
    new THREE.CylinderGeometry(HDR_R, HDR_R, FW, 30, 1),
    mHeader
  );
  header.rotation.z = Math.PI/2;
  header.position.set(0, HDR_Y, 0);
  group.add(header);

  /* rust patch on header */
  const hRust = new THREE.Mesh(
    new THREE.CylinderGeometry(HDR_R * 1.035, HDR_R * 1.025, FW * 0.62, 30, 1),
    mRust.clone()
  );
  hRust.rotation.z = Math.PI/2;
  hRust.position.set(FW * 0.06, HDR_Y, 0);
  group.add(hRust);

  /* end caps */
  [-FW/2, FW/2].forEach(function(ex, side){
    // hemisphere cap
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(HDR_R * 1.04, 20, 12, 0, Math.PI*2, 0, Math.PI/2),
      mCap.clone()
    );
    cap.rotation.z = side === 0 ? Math.PI/2 : -Math.PI/2;
    cap.position.set(ex, HDR_Y, 0);
    group.add(cap);

    // end flange ring
    const fl = new THREE.Mesh(
      new THREE.CylinderGeometry(HDR_R * 1.30, HDR_R * 1.30, 0.095, 22),
      mCap.clone()
    );
    fl.rotation.z = Math.PI/2;
    fl.position.set(ex, HDR_Y, 0);
    group.add(fl);
  });

})();

  const cv = document.createElement("canvas");

  const c = 128;
  const g = ctx.createRadialGradient(c, c, 6, c, c, 128);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.18, "rgba(255,247,220,0.96)");
  g.addColorStop(0.44, "rgba(255,195,124,0.46)");

  ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;

}

function createFlameLathe(radius, height){

    new THREE.Vector2(0.18 *radius, 0),
    new THREE.Vector2(0.82 *radius, 0.10*height),
    new THREE.Vector2(1.00 *radius, 0.28*height),
    new THREE.Vector2(0.96 *radius, 0.42*height),
    new THREE.Vector2(0.80 *radius, 0.58*height),
    new THREE.Vector2(0.56 *radius, 0.74*height),
    new THREE.Vector2(0.36 *radius, 0.88*height),
    new THREE.Vector2(0.18 *radius, 0.96*height),
    new THREE.Vector2(0.04 *radius, height)
  ];
  const geo = new THREE.LatheGeometry(pts, 28);
  geo.translate(0, -height * 0.18, 0);
  return geo;
}
