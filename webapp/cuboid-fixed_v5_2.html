<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reformer Shell Study</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  background:#06080b;
  overflow:hidden;
  font-family:"Courier New",Courier,monospace;
}
body{color:#d9dfe6;}
#app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:10px;
}
#topbar{
  width:min(97vw,1680px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
#viewerTag{
  width:clamp(320px,36vw,620px);
  max-width:100%;
  min-height:46px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  padding:9px 16px 10px;
  border:1px solid rgba(180,192,205,0.22);
  border-radius:12px;
  background:linear-gradient(180deg,rgba(17,20,24,0.98),rgba(10,12,15,0.98));
  box-shadow:0 10px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.05);
}
.vt-title{
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#f3f6fa;
}
.vt-sub{
  font-size:8px;
  letter-spacing:0.8px;
  color:#9ea8b4;
  white-space:nowrap;
}
.vt-mode{
  font-size:8px;
  letter-spacing:1px;
  color:#d8e0e8;
  text-transform:uppercase;
}
#ctrls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:center;
  flex:1 1 520px;
}
.btn{
  min-width:92px;
  padding:7px 12px;
  border:1px solid rgba(180,192,205,0.22);
  border-radius:8px;
  background:#12161a;
  color:#e9edf2;
  font-family:"Courier New",Courier,monospace;
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  cursor:pointer;
}
.btn:hover{
  background:#1a2025;
  border-color:rgba(225,231,238,0.38);
}
#vp{
  position:relative;
  width:min(97vw,1680px);
  height:min(calc(100vh - 118px),90vh);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(46,54,64,0.26) 0%, rgba(16,20,25,0.78) 34%, rgba(8,10,12,0.96) 70%, #040506 100%);
  border:1px solid rgba(180,192,205,0.16);
  border-radius:14px;
  box-shadow:inset 0 0 70px rgba(255,255,255,0.03);
  cursor:grab;
  touch-action:none;
}
#vp:active{cursor:grabbing;}
#vp canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#hint{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:1.8px;
  color:rgba(160,170,180,0.56);
  white-space:nowrap;
  pointer-events:none;
  text-align:center;
}
@media (max-width:760px){
  #topbar{
    width:100%;
    justify-content:center;
  }
  #viewerTag{
    width:100%;
    text-align:center;
    align-items:center;
  }
  .vt-title{font-size:11px;line-height:1.18;}
  .vt-sub{font-size:7px;white-space:normal;}
  .vt-mode{font-size:7px;}
  #ctrls{
    width:100%;
    justify-content:center;
    flex:1 1 auto;
  }
  .btn{
    flex:1 1 calc(33.333% - 8px);
    min-width:104px;
  }
  #vp{
    width:100%;
    height:min(calc(100vh - 158px),86vh);
  }
  #hint{
    width:calc(100% - 20px);
    white-space:normal;
    line-height:1.45;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="viewerTag">
      <span class="vt-title" id="viewerTagTitle">AB Reformer Shell Study</span>
      <span class="vt-sub" id="viewerTagSub">X 13.8 | Y 6.08 | Z 1.5 | shell + peephole study</span>
      <span class="vt-mode" id="viewerModeTag">Mode: Front Study</span>
    </div>
    <div id="ctrls">
      <button class="btn" id="btnFront">Front</button>
      <button class="btn" id="btnBack">Back</button>
      <button class="btn" id="btnLeft">Left</button>
      <button class="btn" id="btnRight">Right</button>
      <button class="btn" id="btnPeep">Inside Prep</button>
      <button class="btn" id="btnAuto">Auto Rotate</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
  </div>
  <div id="vp"><div id="hint">DRAG TO ORBIT THE SHELL | INSIDE PREP LOCKS TO THE UPPER PEEPHOLE CAMERA</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const BOX_WIDTH_X = 13.8;
const BOX_HEIGHT_Y = 6.08;
const BOX_DEPTH_Z = 1.5;
const FUTURE_MARGIN_X = 1.1;
const FUTURE_MARGIN_Y = 0.8;
const FUTURE_MARGIN_Z = 1.35;
const PEEPHOLE_SIZE = BOX_DEPTH_Z * 0.52;
const PEEPHOLE_FRAME_MARGIN = PEEPHOLE_SIZE * 0.054;
const PEEPHOLE_CENTER_TOP_Y = BOX_HEIGHT_Y * 0.18;
const PEEPHOLE_CENTER_BOTTOM_Y = -BOX_HEIGHT_Y * 0.18;
const PEEPHOLE_FRAME_OFFSET = 0.018;
const AUTO_ROTATE_SPEED = 0.34;
const DRAG_ROTATION_SPAN = Math.PI * 1.5;
const MAX_DRAG_DELTA = 42;
const SNAP_EPSILON = 0.0012;
const SNAP_SETTLE_RATE = 24;
const TRANSITION_RATE = 8.5;
const TAP_MOVE_TOLERANCE = 10;
const BOX_CENTER = new THREE.Vector3(0, 0, 0);

const app = document.getElementById("app");
const vp = document.getElementById("vp");
const hint = document.getElementById("hint");
const viewerTagTitle = document.getElementById("viewerTagTitle");
const viewerTagSub = document.getElementById("viewerTagSub");
const viewerModeTag = document.getElementById("viewerModeTag");
const btnFront = document.getElementById("btnFront");
const btnBack = document.getElementById("btnBack");
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnPeep = document.getElementById("btnPeep");
const btnAuto = document.getElementById("btnAuto");
const btnReset = document.getElementById("btnReset");

const params = new URLSearchParams(window.location.search);
const chamberKey = String(params.get("chamber") || "ab").toLowerCase() === "cd" ? "cd" : "ab";
const chamberLabel = chamberKey === "cd" ? "CD" : "AB";
const chamberWalls = chamberKey === "cd" ? ["C", "D"] : ["A", "B"];

if(viewerTagTitle) viewerTagTitle.textContent = chamberLabel + " Reformer Shell Study";
if(viewerTagSub) viewerTagSub.textContent =
  "Walls " + chamberWalls[0] + " + " + chamberWalls[1] + " | X " + BOX_WIDTH_X + " | Y " + BOX_HEIGHT_Y + " | Z " + BOX_DEPTH_Z;
document.title = chamberLabel + " Reformer Shell Study";

let hostTabActive = true;
let hostInView = true;
let needsRender = true;

function viewportWidth(){ return Math.max(1, vp.clientWidth || 1); }
function viewportHeight(){ return Math.max(1, vp.clientHeight || 1); }

function normalizeAngle(angle){
  let next = angle;
  const turn = Math.PI * 2;
  while(next <= -Math.PI) next += turn;
  while(next > Math.PI) next -= turn;
  return next;
}

function shortestAngleDelta(fromAngle, toAngle){
  let delta = normalizeAngle(toAngle) - normalizeAngle(fromAngle);
  if(delta > Math.PI) delta -= Math.PI * 2;
  if(delta < -Math.PI) delta += Math.PI * 2;
  return delta;
}

function requestRender(){
  needsRender = true;
}

function canRender(){
  return !document.hidden && hostTabActive && hostInView;
}

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});
renderer.setClearColor(0x000000, 0);
vp.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 180);
const rigGroup = new THREE.Group();
const shellGroup = new THREE.Group();
scene.add(rigGroup);
rigGroup.add(shellGroup);

scene.add(new THREE.AmbientLight(0xffffff, 1.22));
const hemiLight = new THREE.HemisphereLight(0xe8edf2, 0x1c2228, 0.82);
scene.add(hemiLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(7, 8, 10);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xcfd6de, 0.44);
fillLight.position.set(-9, -2, -6);
scene.add(fillLight);

function createShellMaterial(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:0.72,
    metalness:0.16,
    side:THREE.DoubleSide
  });
}

function buildPeepholeShape(frameWidth, frameHeight, holeWidth, holeHeight, centerY){
  const shape = new THREE.Shape();
  shape.moveTo(-frameWidth / 2, centerY - frameHeight / 2);
  shape.lineTo(frameWidth / 2, centerY - frameHeight / 2);
  shape.lineTo(frameWidth / 2, centerY + frameHeight / 2);
  shape.lineTo(-frameWidth / 2, centerY + frameHeight / 2);
  shape.lineTo(-frameWidth / 2, centerY - frameHeight / 2);

  const hole = new THREE.Path();
  hole.moveTo(-holeWidth / 2, centerY - holeHeight / 2);
  hole.lineTo(holeWidth / 2, centerY - holeHeight / 2);
  hole.lineTo(holeWidth / 2, centerY + holeHeight / 2);
  hole.lineTo(-holeWidth / 2, centerY + holeHeight / 2);
  hole.lineTo(-holeWidth / 2, centerY - holeHeight / 2);
  shape.holes.push(hole);
  return shape;
}

function createSidePanel(isLeft){
  const panelShape = new THREE.Shape();
  panelShape.moveTo(-BOX_DEPTH_Z / 2, -BOX_HEIGHT_Y / 2);
  panelShape.lineTo(BOX_DEPTH_Z / 2, -BOX_HEIGHT_Y / 2);
  panelShape.lineTo(BOX_DEPTH_Z / 2, BOX_HEIGHT_Y / 2);
  panelShape.lineTo(-BOX_DEPTH_Z / 2, BOX_HEIGHT_Y / 2);
  panelShape.lineTo(-BOX_DEPTH_Z / 2, -BOX_HEIGHT_Y / 2);

  [PEEPHOLE_CENTER_TOP_Y, PEEPHOLE_CENTER_BOTTOM_Y].forEach(function(centerY){
    const holeShape = new THREE.Path();
    holeShape.moveTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    holeShape.lineTo(PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    holeShape.lineTo(PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    holeShape.lineTo(-PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    holeShape.lineTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    panelShape.holes.push(holeShape);
  });

  const panelMesh = new THREE.Mesh(
    new THREE.ShapeGeometry(panelShape),
    createShellMaterial(0xa5adb5)
  );
  panelMesh.rotation.y = isLeft ? -Math.PI / 2 : Math.PI / 2;
  panelMesh.position.x = isLeft ? -BOX_WIDTH_X / 2 : BOX_WIDTH_X / 2;
  shellGroup.add(panelMesh);

  [PEEPHOLE_CENTER_TOP_Y, PEEPHOLE_CENTER_BOTTOM_Y].forEach(function(centerY){
    const frameShape = buildPeepholeShape(
      PEEPHOLE_SIZE + (PEEPHOLE_FRAME_MARGIN * 2),
      PEEPHOLE_SIZE + (PEEPHOLE_FRAME_MARGIN * 2),
      PEEPHOLE_SIZE,
      PEEPHOLE_SIZE,
      centerY
    );

    [-PEEPHOLE_FRAME_OFFSET, PEEPHOLE_FRAME_OFFSET].forEach(function(frameOffset){
      const frameMesh = new THREE.Mesh(
        new THREE.ShapeGeometry(frameShape),
        createShellMaterial(frameOffset < 0 ? 0x7a838c : 0x8d96a0)
      );
      frameMesh.rotation.y = isLeft ? -Math.PI / 2 : Math.PI / 2;
      frameMesh.position.x = (isLeft ? -BOX_WIDTH_X / 2 : BOX_WIDTH_X / 2) + (isLeft ? -frameOffset : frameOffset);
      shellGroup.add(frameMesh);
    });
  });
}

const frontFace = new THREE.Mesh(
  new THREE.PlaneGeometry(BOX_WIDTH_X, BOX_HEIGHT_Y),
  createShellMaterial(0xb9c0c8)
);
frontFace.position.z = BOX_DEPTH_Z / 2;
shellGroup.add(frontFace);

const backFace = new THREE.Mesh(
  new THREE.PlaneGeometry(BOX_WIDTH_X, BOX_HEIGHT_Y),
  createShellMaterial(0xb9c0c8)
);
backFace.position.z = -BOX_DEPTH_Z / 2;
backFace.rotation.y = Math.PI;
shellGroup.add(backFace);

const topCap = new THREE.Mesh(
  new THREE.PlaneGeometry(BOX_WIDTH_X, BOX_DEPTH_Z),
  createShellMaterial(0xc7ced6)
);
topCap.rotation.x = -Math.PI / 2;
topCap.position.y = BOX_HEIGHT_Y / 2;
shellGroup.add(topCap);

const bottomCap = new THREE.Mesh(
  new THREE.PlaneGeometry(BOX_WIDTH_X, BOX_DEPTH_Z),
  createShellMaterial(0x9199a2)
);
bottomCap.rotation.x = Math.PI / 2;
bottomCap.position.y = -BOX_HEIGHT_Y / 2;
shellGroup.add(bottomCap);

createSidePanel(true);
createSidePanel(false);

const outerEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX_WIDTH_X, BOX_HEIGHT_Y, BOX_DEPTH_Z)),
  new THREE.LineBasicMaterial({
    color:0x252a30,
    transparent:true,
    opacity:0.96
  })
);
shellGroup.add(outerEdges);

const floorShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(BOX_WIDTH_X * 0.96, BOX_WIDTH_X * 0.34),
  new THREE.MeshBasicMaterial({
    color:0x000000,
    transparent:true,
    opacity:0.08
  })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = -(BOX_HEIGHT_Y * 0.5) - 0.9;
shellGroup.add(floorShadow);

function fullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function toggleFullscreen(){
  if(fullscreenElement()){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
    return;
  }
  const request = app.requestFullscreen || app.webkitRequestFullscreen;
  if(request){
    const result = request.call(app);
    if(result && typeof result.catch === "function") result.catch(function(){});
  }
}

const currentCameraPos = new THREE.Vector3();
const targetCameraPos = new THREE.Vector3();
const currentLookAt = new THREE.Vector3();
const targetLookAt = new THREE.Vector3();

let currentFov = 30;
let targetFov = 30;
let rotY = 0;
let targetRotY = 0;
let autoRotate = false;
let activeViewKey = "front";
let activePointerId = null;
let isDragging = false;
let lastPointerX = 0;
let dragDistance = 0;
let touchMoved = false;
let lastTapAt = 0;
let lastFrameAt = 0;

function getFitDistance(fovDegrees){
  const width = BOX_WIDTH_X + (FUTURE_MARGIN_X * 2);
  const height = BOX_HEIGHT_Y + (FUTURE_MARGIN_Y * 2);
  const depth = BOX_DEPTH_Z + (FUTURE_MARGIN_Z * 2);
  const radius = 0.5 * Math.sqrt((width * width) + (height * height) + (depth * depth));
  const aspect = viewportWidth() / viewportHeight();
  const verticalHalf = THREE.MathUtils.degToRad(fovDegrees) / 2;
  const horizontalHalf = Math.atan(Math.tan(verticalHalf) * aspect);
  const fitHalfAngle = Math.min(verticalHalf, horizontalHalf);
  return (radius / Math.sin(Math.max(0.001, fitHalfAngle))) * 1.06;
}

function setHintText(text){
  if(hint) hint.textContent = text;
}

function syncAutoButton(){
  btnAuto.textContent = autoRotate ? "Stop Rotate" : "Auto Rotate";
}

function syncModeLabel(){
  const labels = {
    front:"Mode: Front Study",
    back:"Mode: Back Study",
    left:"Mode: Left Side Study",
    right:"Mode: Right Side Study",
    peep:"Mode: Inside Prep Through Upper Peephole"
  };
  if(viewerModeTag) viewerModeTag.textContent = labels[activeViewKey] || "Mode: Study";
}

function snapToNearestFace(){
  const faceStep = Math.PI / 2;
  const snapped = Math.round(normalizeAngle(rotY) / faceStep) * faceStep;
  targetRotY = normalizeAngle(snapped);
}

function applyView(viewKey, instant){
  const immediate = !!instant;
  activeViewKey = viewKey;
  autoRotate = false;
  syncAutoButton();
  syncModeLabel();

  if(viewKey === "peep"){
    targetRotY = 0;
    targetFov = 24;
    targetCameraPos.set(-(BOX_WIDTH_X / 2) - 0.95, PEEPHOLE_CENTER_TOP_Y, 0);
    targetLookAt.set(0.35, PEEPHOLE_CENTER_TOP_Y, 0);
    setHintText("INSIDE PREP VIEW | CAMERA ALIGNED TO THE UPPER LEFT PEEPHOLE FOR FUTURE BURNER STUDY");
  }else{
    const viewYaw = {
      front:0,
      back:Math.PI,
      left:-Math.PI / 2,
      right:Math.PI / 2
    }[viewKey] || 0;
    targetRotY = normalizeAngle(viewYaw);
    targetFov = 30;
    targetCameraPos.set(0, BOX_HEIGHT_Y * 0.14, getFitDistance(30));
    targetLookAt.copy(BOX_CENTER);
    setHintText("DRAG TO ORBIT THE SHELL | INSIDE PREP LOCKS TO THE UPPER PEEPHOLE CAMERA");
  }

  if(immediate){
    rotY = targetRotY;
    currentFov = targetFov;
    currentCameraPos.copy(targetCameraPos);
    currentLookAt.copy(targetLookAt);
  }
  requestRender();
}

function applyAutoRotate(){
  if(activeViewKey === "peep"){
    applyView("front", false);
  }
  autoRotate = !autoRotate;
  syncAutoButton();
  requestRender();
}

function settleRotation(dt){
  const delta = shortestAngleDelta(rotY, targetRotY);
  if(Math.abs(delta) <= SNAP_EPSILON){
    rotY = targetRotY;
    return false;
  }
  rotY = normalizeAngle(rotY + delta * (1 - Math.exp(-SNAP_SETTLE_RATE * dt)));
  if(Math.abs(shortestAngleDelta(rotY, targetRotY)) <= SNAP_EPSILON){
    rotY = targetRotY;
  }
  return true;
}

function setPointerDragStart(clientX){
  if(activeViewKey === "peep") return;
  autoRotate = false;
  syncAutoButton();
  isDragging = true;
  lastPointerX = clientX;
  dragDistance = 0;
  touchMoved = false;
  targetRotY = rotY;
  requestRender();
}

function movePointerDrag(clientX){
  if(!isDragging || activeViewKey === "peep") return;
  const rawDelta = clientX - lastPointerX;
  const clampedDelta = Math.max(-MAX_DRAG_DELTA, Math.min(MAX_DRAG_DELTA, rawDelta));
  dragDistance += Math.abs(rawDelta);
  if(Math.abs(rawDelta) > 2) touchMoved = true;
  const width = Math.max(320, viewportWidth());
  rotY = normalizeAngle(rotY + ((clampedDelta / width) * DRAG_ROTATION_SPAN));
  targetRotY = rotY;
  lastPointerX = clientX;
  requestRender();
}

function stopPointerDrag(){
  if(!isDragging) return;
  isDragging = false;
  snapToNearestFace();
  requestRender();
}

vp.addEventListener("pointerdown", function(event){
  if(event.pointerType === "mouse" && event.button !== 0) return;
  if(activeViewKey === "peep") return;
  activePointerId = event.pointerId;
  if(vp.setPointerCapture) vp.setPointerCapture(event.pointerId);
  setPointerDragStart(event.clientX);
});

vp.addEventListener("pointermove", function(event){
  if(activePointerId !== event.pointerId) return;
  movePointerDrag(event.clientX);
});

function endPointerGesture(event){
  if(activePointerId !== event.pointerId) return;
  try{
    if(vp.releasePointerCapture) vp.releasePointerCapture(event.pointerId);
  }catch(_e){}
  activePointerId = null;
  const wasTapCandidate = dragDistance <= TAP_MOVE_TOLERANCE && !touchMoved;
  stopPointerDrag();
  if(!wasTapCandidate){
    lastTapAt = 0;
    return;
  }
  const now = Date.now();
  if(now - lastTapAt < 320){
    toggleFullscreen();
    lastTapAt = 0;
  }else{
    lastTapAt = now;
  }
}

vp.addEventListener("pointerup", endPointerGesture);
vp.addEventListener("pointercancel", endPointerGesture);
vp.addEventListener("lostpointercapture", function(event){
  if(activePointerId !== event.pointerId) return;
  activePointerId = null;
  stopPointerDrag();
});

window.addEventListener("blur", function(){
  activePointerId = null;
  stopPointerDrag();
});

vp.addEventListener("dblclick", function(event){
  event.preventDefault();
  toggleFullscreen();
});

btnFront.addEventListener("click", function(){ applyView("front", false); });
btnBack.addEventListener("click", function(){ applyView("back", false); });
btnLeft.addEventListener("click", function(){ applyView("left", false); });
btnRight.addEventListener("click", function(){ applyView("right", false); });
btnPeep.addEventListener("click", function(){ applyView("peep", false); });
btnAuto.addEventListener("click", applyAutoRotate);
btnReset.addEventListener("click", function(){ applyView("front", false); });

document.addEventListener("visibilitychange", requestRender);
window.addEventListener("message", function(event){
  const data = event && event.data;
  if(!data || typeof data !== "object") return;
  if(data.type === "cuboid-host-state"){
    hostTabActive = !!data.active;
    hostInView = data.inView !== false;
    requestRender();
  }
});

const resizeObserver = new ResizeObserver(function(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(viewportWidth(), viewportHeight(), false);
  camera.aspect = viewportWidth() / viewportHeight();
  camera.updateProjectionMatrix();

  if(activeViewKey === "peep"){
    targetFov = 24;
    targetCameraPos.set(-(BOX_WIDTH_X / 2) - 0.95, PEEPHOLE_CENTER_TOP_Y, 0);
  }else{
    targetCameraPos.set(0, BOX_HEIGHT_Y * 0.14, getFitDistance(30));
  }
  requestRender();
});
resizeObserver.observe(vp);

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.setSize(viewportWidth(), viewportHeight(), false);
camera.aspect = viewportWidth() / viewportHeight();
camera.updateProjectionMatrix();
syncAutoButton();
syncModeLabel();
applyView("front", true);

function animate(now){
  requestAnimationFrame(animate);
  const dt = lastFrameAt ? Math.min(0.05, Math.max(0.001, (now - lastFrameAt) / 1000)) : (1 / 60);
  lastFrameAt = now;
  if(!canRender()) return;

  let dirty = needsRender;

  if(autoRotate){
    rotY = normalizeAngle(rotY + (AUTO_ROTATE_SPEED * dt));
    targetRotY = rotY;
    dirty = true;
  }else{
    dirty = settleRotation(dt) || dirty;
  }

  const transitionFactor = 1 - Math.exp(-TRANSITION_RATE * dt);
  const previousFov = currentFov;
  currentFov += (targetFov - currentFov) * transitionFactor;
  currentCameraPos.lerp(targetCameraPos, transitionFactor);
  currentLookAt.lerp(targetLookAt, transitionFactor);

  rigGroup.rotation.y = rotY;
  camera.position.copy(currentCameraPos);
  if(Math.abs(currentFov - previousFov) > 0.0005){
    camera.fov = currentFov;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  camera.lookAt(currentLookAt);

  if(
    currentCameraPos.distanceToSquared(targetCameraPos) > 0.00001 ||
    currentLookAt.distanceToSquared(targetLookAt) > 0.00001 ||
    Math.abs(currentFov - targetFov) > 0.0005
  ){
    dirty = true;
  }

  if(!dirty) return;
  renderer.render(scene, camera);
  needsRender = false;
}

requestAnimationFrame(animate);
})();
</script>
