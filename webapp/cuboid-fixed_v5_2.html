<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cuboid - Bare Shell</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  background:#060708;
  overflow:hidden;
  font-family:"Courier New",Courier,monospace;
}
body{color:#d6dae0;}
#app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:10px;
}
#topbar{
  width:min(97vw,1680px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
#viewerTag{
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  width:clamp(300px,32vw,520px);
  max-width:100%;
  padding:9px 16px;
  border:1px solid rgba(185,191,200,0.22);
  border-radius:10px;
  background:#0f1114;
}
.vt-title{
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#f5f7fa;
}
.vt-sub{
  font-size:8px;
  letter-spacing:0.8px;
  color:#9ea4ad;
  white-space:nowrap;
}
#ctrls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:center;
  flex:1 1 400px;
}
.btn{
  min-width:104px;
  padding:7px 14px;
  border:1px solid rgba(185,191,200,0.22);
  border-radius:8px;
  background:#101215;
  color:#e7eaef;
  font-family:"Courier New",Courier,monospace;
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  cursor:pointer;
}
.btn:hover{
  background:#161a1f;
  border-color:rgba(226,232,240,0.34);
}
#vp{
  position:relative;
  width:min(97vw,1680px);
  height:min(calc(100vh - 112px),90vh);
  overflow:hidden;
  background:#090b0d;
  border:1px solid rgba(185,191,200,0.16);
  border-radius:12px;
  cursor:grab;
  touch-action:none;
}
#vp:active{cursor:grabbing;}
#vp canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#hint{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:2px;
  color:rgba(151,157,167,0.52);
  white-space:nowrap;
  pointer-events:none;
}
@media (max-width:760px){
  #topbar{
    width:100%;
    justify-content:center;
  }
  #viewerTag{
    width:100%;
    text-align:center;
    align-items:center;
  }
  .vt-title{font-size:11px;line-height:1.18;}
  .vt-sub{font-size:7px;white-space:normal;}
  #ctrls{
    width:100%;
    justify-content:center;
    flex:1 1 auto;
  }
  .btn{
    flex:1 1 calc(50% - 8px);
    min-width:118px;
  }
  #vp{
    width:100%;
    height:min(calc(100vh - 142px),86vh);
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="viewerTag">
      <span class="vt-title">Furnace Cuboid - Bare Shell</span>
      <span class="vt-sub">FW 13.8 · FH 6.08 · FD 1.5 · shell only</span>
    </div>
    <div id="ctrls">
      <button class="btn" id="btnFront">Front</button>
      <button class="btn" id="btnBack">Back</button>
      <button class="btn" id="btnAuto">Auto Rotate</button>
      <button class="btn" id="btnReset">Reset View</button>
    </div>
  </div>
  <div id="vp"><div id="hint">DRAG TO ROTATE · DOUBLE-TAP FULLSCREEN</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const FW = 13.8;
const FH = 6.08;
const FD = 1.5;

const app = document.getElementById("app");
const vp = document.getElementById("vp");
const hint = document.getElementById("hint");
const btnFront = document.getElementById("btnFront");
const btnBack = document.getElementById("btnBack");
const btnAuto = document.getElementById("btnAuto");
const btnReset = document.getElementById("btnReset");
const tagTitle = document.querySelector(".vt-title");
const tagSub = document.querySelector(".vt-sub");

const params = new URLSearchParams(window.location.search);
const chamberKey = String(params.get("chamber") || "ab").toLowerCase() === "cd" ? "cd" : "ab";

if(tagTitle){
  tagTitle.textContent = chamberKey === "cd"
    ? "Furnace Cuboid - CD Bare Shell"
    : "Furnace Cuboid - AB Bare Shell";
}
if(tagSub){
  tagSub.textContent = chamberKey === "cd"
    ? "Front Wall C · Back Wall D · shell only"
    : "Front Wall A · Back Wall B · shell only";
}
document.title = chamberKey === "cd" ? "Cuboid - CD Bare Shell" : "Cuboid - AB Bare Shell";

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});
renderer.setClearColor(0x000000, 0);
vp.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const rig = new THREE.Group();
const shellRig = new THREE.Group();
scene.add(rig);
rig.add(shellRig);
shellRig.rotation.x = -0.2;

const ambient = new THREE.AmbientLight(0xffffff, 1.35);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(7, 8, 10);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xd8dde5, 0.42);
fillLight.position.set(-8, -2, -6);
scene.add(fillLight);

const shellGeometry = new THREE.BoxGeometry(FW, FH, FD);
const shellMaterial = new THREE.MeshStandardMaterial({
  color:0xb6bcc4,
  roughness:0.9,
  metalness:0.04
});
const shellMesh = new THREE.Mesh(shellGeometry, shellMaterial);
shellRig.add(shellMesh);

const shellEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(shellGeometry),
  new THREE.LineBasicMaterial({
    color:0x2a2e34,
    transparent:true,
    opacity:0.92
  })
);
shellRig.add(shellEdges);

const floorShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(FW * 0.9, FW * 0.34),
  new THREE.MeshBasicMaterial({
    color:0x000000,
    transparent:true,
    opacity:0.08
  })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = -(FH * 0.5) - 0.82;
shellRig.add(floorShadow);

function viewportWidth(){ return Math.max(1, vp.clientWidth || 1); }
function viewportHeight(){ return Math.max(1, vp.clientHeight || 1); }

function fitCamera(){
  const width = viewportWidth();
  const height = viewportHeight();
  const aspect = width / height;
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
  const distW = (FW * 0.5) / Math.tan(hfov / 2);
  const distH = (FH * 0.5) / Math.tan(vfov / 2);
  const distance = Math.max(distW, distH, FD * 2.8) * 1.22;
  camera.aspect = aspect;
  camera.position.set(0, 0.45, distance);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(width, height, false);
}

function fullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function isFullscreen(){
  return fullscreenElement() === app;
}

function refreshHint(){
  hint.textContent = isFullscreen()
    ? "DRAG TO ROTATE · DOUBLE-TAP EXIT FULLSCREEN"
    : "DRAG TO ROTATE · DOUBLE-TAP FULLSCREEN";
}

function toggleFullscreen(){
  if(fullscreenElement()){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
    return;
  }
  const request = app.requestFullscreen || app.webkitRequestFullscreen;
  if(request){
    const result = request.call(app);
    if(result && typeof result.catch === "function") result.catch(function(){});
  }
}

document.addEventListener("fullscreenchange", refreshHint);
document.addEventListener("webkitfullscreenchange", refreshHint);
refreshHint();

let rotY = 0;
let targetRotY = 0;
let autoSpin = false;
let activePointerId = null;
let isDragging = false;
let dragDistance = 0;
let movedDuringDrag = false;
let lastPointerX = 0;
let lastTapAt = 0;
let tabActive = true;
let inView = true;
let forceRender = true;
let lastFrameAt = 0;

const DRAG_SPAN = Math.PI * 1.5;
const FACE_STEP = Math.PI / 2;
const AUTO_SPEED = 0.34;
const SETTLE_RATE = 24;
const SNAP_EPSILON = 0.0012;
const MAX_POINTER_DELTA = 42;
const TAP_TOLERANCE = 10;

function normalizeAngle(value){
  const turn = Math.PI * 2;
  let next = value;
  while(next <= -Math.PI) next += turn;
  while(next > Math.PI) next -= turn;
  return next;
}

function shortestDelta(from, to){
  let delta = normalizeAngle(to) - normalizeAngle(from);
  if(delta > Math.PI) delta -= Math.PI * 2;
  if(delta < -Math.PI) delta += Math.PI * 2;
  return delta;
}

function setTarget(angle){
  targetRotY = normalizeAngle(rotY + shortestDelta(rotY, angle));
}

function settleRotation(dt){
  const delta = shortestDelta(rotY, targetRotY);
  if(Math.abs(delta) <= SNAP_EPSILON){
    rotY = targetRotY;
    return false;
  }
  rotY = normalizeAngle(rotY + delta * (1 - Math.exp(-SETTLE_RATE * dt)));
  if(Math.abs(shortestDelta(rotY, targetRotY)) <= SNAP_EPSILON) rotY = targetRotY;
  return true;
}

function snapFace(){
  setTarget(Math.round(normalizeAngle(rotY) / FACE_STEP) * FACE_STEP);
}

function syncAutoButton(){
  btnAuto.textContent = autoSpin ? "Stop" : "Auto Rotate";
}

function canRender(){
  return !document.hidden && tabActive && inView;
}

function requestRender(){
  forceRender = true;
}

window.addEventListener("message", function(event){
  const data = event && event.data;
  if(!data || typeof data !== "object") return;
  if(data.type === "cuboid-host-state"){
    tabActive = !!data.active;
    inView = data.inView !== false;
    requestRender();
  }
});

vp.addEventListener("pointerdown", function(event){
  if(event.pointerType === "mouse" && event.button !== 0) return;
  activePointerId = event.pointerId;
  if(vp.setPointerCapture) vp.setPointerCapture(event.pointerId);
  autoSpin = false;
  syncAutoButton();
  isDragging = true;
  dragDistance = 0;
  movedDuringDrag = false;
  lastPointerX = event.clientX;
  targetRotY = rotY;
  requestRender();
});

vp.addEventListener("pointermove", function(event){
  if(activePointerId !== event.pointerId || !isDragging) return;
  const rawDelta = event.clientX - lastPointerX;
  const clampedDelta = Math.max(-MAX_POINTER_DELTA, Math.min(MAX_POINTER_DELTA, rawDelta));
  dragDistance += Math.abs(rawDelta);
  if(Math.abs(rawDelta) > 2) movedDuringDrag = true;
  rotY = normalizeAngle(rotY + (clampedDelta / Math.max(320, viewportWidth())) * DRAG_SPAN);
  targetRotY = rotY;
  lastPointerX = event.clientX;
  requestRender();
});

function endPointer(event){
  if(activePointerId !== event.pointerId) return;
  try{
    if(vp.releasePointerCapture) vp.releasePointerCapture(event.pointerId);
  }catch(_e){}
  activePointerId = null;
  const wasTap = dragDistance <= TAP_TOLERANCE && !movedDuringDrag;
  isDragging = false;
  snapFace();
  requestRender();
  if(!wasTap){
    lastTapAt = 0;
    return;
  }
  const now = Date.now();
  if(now - lastTapAt < 320){
    toggleFullscreen();
    lastTapAt = 0;
  }else{
    lastTapAt = now;
  }
}

vp.addEventListener("pointerup", endPointer);
vp.addEventListener("pointercancel", endPointer);
vp.addEventListener("lostpointercapture", function(event){
  if(activePointerId !== event.pointerId) return;
  activePointerId = null;
  isDragging = false;
});
window.addEventListener("blur", function(){
  activePointerId = null;
  isDragging = false;
});
vp.addEventListener("dblclick", function(event){
  event.preventDefault();
  toggleFullscreen();
});

btnFront.addEventListener("click", function(){
  autoSpin = false;
  syncAutoButton();
  setTarget(0);
  requestRender();
});
btnBack.addEventListener("click", function(){
  autoSpin = false;
  syncAutoButton();
  setTarget(Math.PI);
  requestRender();
});
btnAuto.addEventListener("click", function(){
  autoSpin = !autoSpin;
  if(!autoSpin) snapFace();
  else targetRotY = rotY;
  syncAutoButton();
  requestRender();
});
btnReset.addEventListener("click", function(){
  autoSpin = false;
  syncAutoButton();
  rotY = 0;
  targetRotY = 0;
  requestRender();
});

const resizeObserver = new ResizeObserver(function(){
  fitCamera();
  requestRender();
});
resizeObserver.observe(vp);
fitCamera();
syncAutoButton();

function animate(now){
  requestAnimationFrame(animate);
  const dt = lastFrameAt ? Math.min(0.05, Math.max(0.001, (now - lastFrameAt) / 1000)) : (1 / 60);
  lastFrameAt = now;
  if(!canRender()) return;

  let dirty = forceRender;
  if(isDragging){
    targetRotY = rotY;
    dirty = true;
  }else if(autoSpin){
    rotY = normalizeAngle(rotY + AUTO_SPEED * dt);
    targetRotY = rotY;
    dirty = true;
  }else{
    dirty = settleRotation(dt) || dirty;
  }

  rig.rotation.y = rotY;
  if(!dirty) return;
  renderer.render(scene, camera);
  forceRender = false;
}

requestAnimationFrame(animate);
})();
</script>
</body>
</html>
