<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reformer Shell Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  background:#08090d;
  overflow:hidden;
  font-family:"Courier New",Courier,monospace;
}
body{color:rgba(140,180,220,0.85);}
#app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px;
}
#topbar{
  width:min(97vw,1680px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
#viewerTag{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
  min-height:44px;
  width:clamp(430px,40vw,640px);
  max-width:100%;
  padding:8px 20px 9px 18px;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid rgba(110,150,220,0.34);
  background:
    linear-gradient(135deg,rgba(20,31,54,0.97) 0%,rgba(25,20,38,0.95) 38%,rgba(9,24,38,0.96) 100%);
  box-shadow:
    0 12px 28px rgba(0,0,0,0.24),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 28px rgba(74,126,214,0.09);
  text-align:left;
  flex:0 1 auto;
}
#viewerTag::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 16% 18%, rgba(102,180,255,0.16), transparent 42%),
    radial-gradient(circle at 86% 78%, rgba(255,168,82,0.14), transparent 36%);
  pointer-events:none;
}
.viewer-tag-title{
  position:relative;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.15px;
  text-transform:uppercase;
  color:#eaf2ff;
  background:linear-gradient(90deg,#fff7d2 0%,#cfe5ff 42%,#8ef0d3 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 16px rgba(104,156,232,0.16);
}
.viewer-tag-summary{
  position:relative;
  font-size:8px;
  letter-spacing:0.9px;
  color:rgba(199,218,242,0.88);
  white-space:nowrap;
}
#vp{
  position:relative;
  width:min(97vw,1680px);
  height:min(calc(100vh - 110px),90vh);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, rgba(58,78,104,0.52) 0%, rgba(26,33,45,0.88) 22%, rgba(10,13,19,0.97) 54%, #06070b 100%);
  border:1px solid rgba(60,90,130,0.3);
  border-radius:10px;
  box-shadow:inset 0 0 90px rgba(80,115,165,0.12);
  cursor:grab;
  touch-action:none;
}
#vp:active{cursor:grabbing;}
#vp canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#hint{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:2px;
  color:rgba(100,130,160,0.4);
  pointer-events:none;
  white-space:nowrap;
}
#ctrls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:center;
  flex:1 1 520px;
}
.btn{
  background:rgba(10,18,32,0.92);
  border:1px solid rgba(50,90,140,0.4);
  color:rgba(140,180,220,0.85);
  padding:6px 16px;
  border-radius:6px;
  font-family:"Courier New",Courier,monospace;
  font-size:10px;
  letter-spacing:1.8px;
  cursor:pointer;
  text-transform:uppercase;
}
.btn:hover{
  background:rgba(25,50,90,0.9);
  border-color:rgba(90,150,220,0.7);
}
@media (max-width:760px){
  #app{
    gap:8px;
    padding:8px;
  }
  #topbar{
    width:100%;
    gap:8px;
    justify-content:center;
  }
  #viewerTag{
    width:100%;
    min-height:42px;
    padding:8px 12px 9px;
    text-align:center;
    align-items:center;
  }
  .viewer-tag-title{
    font-size:11px;
    line-height:1.15;
  }
  .viewer-tag-summary{
    font-size:7px;
    letter-spacing:0.8px;
    white-space:normal;
  }
  #vp{
    width:100%;
    height:min(calc(100vh - 138px),86vh);
  }
  #hint{
    font-size:7px;
    letter-spacing:1.4px;
    bottom:6px;
  }
  #ctrls{
    width:100%;
    gap:6px;
    justify-content:center;
    flex:1 1 auto;
  }
  .btn{
    flex:1 1 calc(50% - 6px);
    min-width:118px;
    padding:8px 10px;
    font-size:9px;
    letter-spacing:1.2px;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="viewerTag">
      <span class="viewer-tag-title" id="viewerTagTitle">AB Reformer Structure Study</span>
      <span class="viewer-tag-summary" id="viewerTagSummary">Dashboard shell dimensions and camera framing | shell only</span>
    </div>
    <div id="ctrls">
      <button class="btn" id="btnPrimary">Face A</button>
      <button class="btn" id="btnSecondary">Face B</button>
      <button class="btn" id="btnAuto">Auto Rotate</button>
      <button class="btn" id="btnResetView">Reset Front View</button>
    </div>
  </div>
  <div id="vp"><div id="hint">DRAG TO ROTATE · DOUBLE-TAP FULLSCREEN</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const FW = 13.8;
const FH = 6.08;
const FD = 1.5;
const PEEPHOLE_SIZE = FD * 0.52;
const PEEPHOLE_FRAME_MARGIN = PEEPHOLE_SIZE * 0.054 * 1.2;
const PEEPHOLE_TOP_Y = FH * 0.18;
const PEEPHOLE_BOTTOM_Y = -FH * 0.18;

const chamberParam = (function(){
  try{
    const q = new URLSearchParams(window.location.search || "");
    const raw = String(q.get("chamber") || "ab").toLowerCase().trim();
    return raw === "cd" ? "cd" : "ab";
  }catch(_e){
    return "ab";
  }
})();

const chamberWalls = chamberParam === "cd" ? ["C", "D"] : ["A", "B"];
const chamberZoneKey = chamberParam === "cd" ? "CD" : "AB";

const app = document.getElementById("app");
const viewerTagTitle = document.getElementById("viewerTagTitle");
const viewerTagSummary = document.getElementById("viewerTagSummary");
const hint = document.getElementById("hint");
const btnPrimary = document.getElementById("btnPrimary");
const btnSecondary = document.getElementById("btnSecondary");
const btnAuto = document.getElementById("btnAuto");
const btnResetView = document.getElementById("btnResetView");
const vp = document.getElementById("vp");

if(viewerTagTitle) viewerTagTitle.textContent = chamberZoneKey + " Reformer Structure Study";
if(viewerTagSummary) viewerTagSummary.textContent = "X " + FW + " | Y " + FH + " | Z " + FD + " | dashboard camera framing";
if(btnPrimary) btnPrimary.textContent = "Face " + chamberWalls[0];
if(btnSecondary) btnSecondary.textContent = "Face " + chamberWalls[1];
document.title = chamberZoneKey + " Reformer Structure Study";

let hostTabActive = true;
let hostInView = true;
let hostFocused = true;
let lastRenderTs = 0;
let forceNextRender = true;

function viewportWidth(){ return vp.clientWidth; }
function viewportHeight(){ return vp.clientHeight; }

function fullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function isFullscreen(){
  return fullscreenElement() === app;
}

function refreshHint(){
  hint.textContent = isFullscreen()
    ? "DRAG TO ROTATE · DOUBLE-TAP EXIT FULLSCREEN"
    : "DRAG TO ROTATE · DOUBLE-TAP FULLSCREEN";
}

function canRenderNow(){
  return !document.hidden && (isFullscreen() || (hostTabActive && hostInView));
}

function toggleFullscreen(){
  const currentFs = fullscreenElement();
  if(currentFs){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
    return;
  }
  const request = app.requestFullscreen || app.webkitRequestFullscreen;
  if(request){
    const result = request.call(app);
    if(result && typeof result.catch === "function") result.catch(function(){});
  }
}

document.addEventListener("fullscreenchange", function(){
  refreshHint();
  markDirty();
});
document.addEventListener("webkitfullscreenchange", function(){
  refreshHint();
  markDirty();
});
refreshHint();

window.addEventListener("message", function(event){
  const data = event && event.data;
  if(!data || typeof data !== "object") return;
  if(data.type === "cuboid-host-state"){
    hostTabActive = !!data.active;
    hostInView = data.inView !== false;
    hostFocused = data.focused !== false;
    markDirty();
  }
});

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});
renderer.setClearColor(0x000000, 0);
vp.appendChild(renderer.domElement);

let appliedPixelRatio = 0;

function targetPixelRatio(){
  const deviceRatio = Math.max(1, window.devicePixelRatio || 1);
  const activeNow = isFullscreen() || hasRotationMotion();
  let cap = 1.25;
  if(!canRenderNow()){
    cap = 0.7;
  }else if(activeNow){
    cap = 1.35;
  }else if(hostFocused){
    cap = 1.18;
  }else{
    cap = 1.0;
  }
  return Math.max(0.7, Math.min(deviceRatio, cap));
}

function applyRendererQuality(force){
  const nextRatio = targetPixelRatio();
  if(!force && Math.abs(nextRatio - appliedPixelRatio) < 0.02) return false;
  appliedPixelRatio = nextRatio;
  renderer.setPixelRatio(nextRatio);
  renderer.setSize(viewportWidth(), viewportHeight(), false);
  return true;
}

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(32, viewportWidth() / viewportHeight(), 0.1, 300);

function fitCamera(){
  const asp = viewportWidth() / viewportHeight();
  const fov = 32 * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(fov / 2) * asp);
  const dW = (FW / 2) / Math.tan(hfov / 2);
  const dH = (FH / 2) / Math.tan(fov / 2);
  camera.aspect = asp;
  camera.updateProjectionMatrix();
  camera.position.set(0, 0, Math.max(dW, dH) * 1.18);
  camera.lookAt(0, 0, 0);
}
fitCamera();

const rigGroup = new THREE.Group();
scene.add(rigGroup);
const shellGroup = new THREE.Group();
rigGroup.add(shellGroup);

scene.add(new THREE.AmbientLight(0xd5e0ee, 1.18));
const hemi = new THREE.HemisphereLight(0xe9f1ff, 0x1a2430, 0.92);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e0, 1.34);
sun.position.set(5, 8, 10);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9ab3d8, 0.82);
fill.position.set(-8, -2, -6);
scene.add(fill);
const rimCool = new THREE.DirectionalLight(0xbad1ff, 0.96);
rimCool.position.set(-10, 1.5, 4);
scene.add(rimCool);
const rimWarm = new THREE.DirectionalLight(0xffddb4, 0.58);
rimWarm.position.set(8, -1.2, 7);
scene.add(rimWarm);

function shellMaterial(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:0.46,
    metalness:0.22,
    side:THREE.DoubleSide
  });
}

const capTop = new THREE.Mesh(
  new THREE.PlaneGeometry(FW, FD),
  shellMaterial(0xcfd6de)
);
capTop.rotation.x = -Math.PI / 2;
capTop.position.y = FH / 2;
shellGroup.add(capTop);

const capBot = new THREE.Mesh(
  new THREE.PlaneGeometry(FW, FD),
  shellMaterial(0x98a1aa)
);
capBot.rotation.x = Math.PI / 2;
capBot.position.y = -FH / 2;
shellGroup.add(capBot);

const faceFront = new THREE.Mesh(
  new THREE.PlaneGeometry(FW, FH),
  shellMaterial(0xf4f6f9)
);
faceFront.position.z = FD / 2;
shellGroup.add(faceFront);

const faceBack = new THREE.Mesh(
  new THREE.PlaneGeometry(FW, FH),
  shellMaterial(0xf4f6f9)
);
faceBack.position.z = -FD / 2;
faceBack.rotation.y = Math.PI;
shellGroup.add(faceBack);

function addSidePanel(isLeft){
  const shape = new THREE.Shape();
  shape.moveTo(-FD / 2, -FH / 2);
  shape.lineTo(FD / 2, -FH / 2);
  shape.lineTo(FD / 2, FH / 2);
  shape.lineTo(-FD / 2, FH / 2);
  shape.lineTo(-FD / 2, -FH / 2);

  [PEEPHOLE_TOP_Y, PEEPHOLE_BOTTOM_Y].forEach(function(centerY){
    const hole = new THREE.Path();
    hole.moveTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    hole.lineTo(PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    hole.lineTo(PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    hole.lineTo(-PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    hole.lineTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    shape.holes.push(hole);
  });

  const sideMesh = new THREE.Mesh(
    new THREE.ShapeGeometry(shape),
    shellMaterial(0xb8c0c8)
  );
  sideMesh.rotation.y = isLeft ? -Math.PI / 2 : Math.PI / 2;
  sideMesh.position.x = isLeft ? -FW / 2 : FW / 2;
  shellGroup.add(sideMesh);

  [PEEPHOLE_TOP_Y, PEEPHOLE_BOTTOM_Y].forEach(function(centerY){
    const fw = PEEPHOLE_SIZE + (PEEPHOLE_FRAME_MARGIN * 2);
    const fh = PEEPHOLE_SIZE + (PEEPHOLE_FRAME_MARGIN * 2);

    const frameShape = new THREE.Shape();
    frameShape.moveTo(-fw / 2, centerY - fh / 2);
    frameShape.lineTo(fw / 2, centerY - fh / 2);
    frameShape.lineTo(fw / 2, centerY + fh / 2);
    frameShape.lineTo(-fw / 2, centerY + fh / 2);
    frameShape.lineTo(-fw / 2, centerY - fh / 2);

    const frameHole = new THREE.Path();
    frameHole.moveTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    frameHole.lineTo(PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    frameHole.lineTo(PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    frameHole.lineTo(-PEEPHOLE_SIZE / 2, centerY + PEEPHOLE_SIZE / 2);
    frameHole.lineTo(-PEEPHOLE_SIZE / 2, centerY - PEEPHOLE_SIZE / 2);
    frameShape.holes.push(frameHole);

    const frameMesh = new THREE.Mesh(
      new THREE.ShapeGeometry(frameShape),
      shellMaterial(0x8a949f)
    );
    frameMesh.rotation.y = isLeft ? -Math.PI / 2 : Math.PI / 2;
    frameMesh.position.x = (isLeft ? -FW / 2 : FW / 2) + (isLeft ? -0.016 : 0.016);
    shellGroup.add(frameMesh);
  });
}

addSidePanel(true);
addSidePanel(false);

const shellEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(FW, FH, FD)),
  new THREE.LineBasicMaterial({
    color:0x303740,
    transparent:true,
    opacity:0.92
  })
);
shellGroup.add(shellEdges);

const floorShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(FW * 0.96, FW * 0.32),
  new THREE.MeshBasicMaterial({
    color:0x000000,
    transparent:true,
    opacity:0.08
  })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = -(FH * 0.5) - 0.84;
shellGroup.add(floorShadow);

const DRAG_ROTATION_SPAN = Math.PI * 1.5;
const MAX_DRAG_DELTA = 42;
const SNAP_EPSILON = 0.0012;
const SNAP_SETTLE_RATE = 24;
const FACE_STEP = Math.PI / 2;
const ACTIVE_FRAME_MS = 16;
const FOCUSED_IDLE_FRAME_MS = ACTIVE_FRAME_MS;
const BACKGROUND_IDLE_FRAME_MS = 320;
const SLEEP_FRAME_MS = 900;
const TAP_MOVE_TOLERANCE = 10;

let rotY = 0;
let targetRotY = 0;
let autoSpin = false;
let activePointerId = null;
let isDragging = false;
let lastX = 0;
let dragDistance = 0;
let touchMoved = false;
let lastTapAt = 0;
let lastFrameTs = 0;

function normalizeAngle(angle){
  let a = angle;
  const tau = Math.PI * 2;
  while(a <= -Math.PI) a += tau;
  while(a > Math.PI) a -= tau;
  return a;
}

function shortestAngleDelta(fromAngle, toAngle){
  let delta = normalizeAngle(toAngle) - normalizeAngle(fromAngle);
  if(delta > Math.PI) delta -= Math.PI * 2;
  if(delta < -Math.PI) delta += Math.PI * 2;
  return delta;
}

function setRotationTarget(targetAngle){
  targetRotY = normalizeAngle(rotY + shortestAngleDelta(rotY, targetAngle));
}

function hasRotationMotion(){
  return isDragging || autoSpin || Math.abs(shortestAngleDelta(rotY, targetRotY)) > SNAP_EPSILON;
}

function settleRotationTowardTarget(dt){
  const diff = shortestAngleDelta(rotY, targetRotY);
  if(Math.abs(diff) <= SNAP_EPSILON){
    rotY = targetRotY;
    return false;
  }
  rotY = normalizeAngle(rotY + (diff * (1 - Math.exp(-SNAP_SETTLE_RATE * dt))));
  if(Math.abs(shortestAngleDelta(rotY, targetRotY)) <= SNAP_EPSILON){
    rotY = targetRotY;
  }
  return true;
}

function markDirty(){
  forceNextRender = true;
  lastRenderTs = 0;
  lastFrameTs = 0;
}

function syncAutoRotateButton(){
  btnAuto.textContent = autoSpin ? "Stop" : "Auto Rotate";
}

function startDrag(clientX){
  autoSpin = false;
  syncAutoRotateButton();
  isDragging = true;
  lastX = clientX;
  targetRotY = rotY;
  dragDistance = 0;
  touchMoved = false;
  markDirty();
}

function moveDrag(clientX){
  if(!isDragging) return;
  const rawDx = clientX - lastX;
  const dx = Math.max(-MAX_DRAG_DELTA, Math.min(MAX_DRAG_DELTA, rawDx));
  dragDistance += Math.abs(rawDx);
  if(Math.abs(rawDx) > 2) touchMoved = true;
  const width = Math.max(320, viewportWidth());
  const deltaRot = (dx / width) * DRAG_ROTATION_SPAN;
  rotY = normalizeAngle(rotY + deltaRot);
  targetRotY = rotY;
  lastX = clientX;
  markDirty();
}

function snapToNearestFace(){
  const snapped = Math.round(normalizeAngle(rotY) / FACE_STEP) * FACE_STEP;
  setRotationTarget(snapped);
}

function stopDrag(){
  if(!isDragging) return;
  isDragging = false;
  snapToNearestFace();
  markDirty();
}

vp.addEventListener("pointerdown", function(event){
  if(event.pointerType === "mouse" && event.button !== 0) return;
  activePointerId = event.pointerId;
  if(vp.setPointerCapture) vp.setPointerCapture(event.pointerId);
  startDrag(event.clientX);
});

vp.addEventListener("pointermove", function(event){
  if(activePointerId !== event.pointerId) return;
  moveDrag(event.clientX);
});

function endPointerGesture(event){
  if(activePointerId !== event.pointerId) return;
  if(vp.releasePointerCapture){
    try{ vp.releasePointerCapture(event.pointerId); }catch(_e){}
  }
  activePointerId = null;
  const wasTapCandidate = dragDistance <= TAP_MOVE_TOLERANCE && !touchMoved;
  stopDrag();
  if(!wasTapCandidate){
    lastTapAt = 0;
    return;
  }
  const now = Date.now();
  if(now - lastTapAt < 320){
    toggleFullscreen();
    lastTapAt = 0;
    return;
  }
  lastTapAt = now;
}

vp.addEventListener("pointerup", endPointerGesture);
vp.addEventListener("pointercancel", endPointerGesture);
vp.addEventListener("lostpointercapture", function(event){
  if(activePointerId !== event.pointerId) return;
  activePointerId = null;
  stopDrag();
});

window.addEventListener("blur", function(){
  activePointerId = null;
  stopDrag();
});

vp.addEventListener("dblclick", function(event){
  event.preventDefault();
  toggleFullscreen();
});

btnPrimary.addEventListener("click", function(){
  autoSpin = false;
  syncAutoRotateButton();
  setRotationTarget(0);
  markDirty();
});

btnSecondary.addEventListener("click", function(){
  autoSpin = false;
  syncAutoRotateButton();
  setRotationTarget(Math.PI);
  markDirty();
});

btnAuto.addEventListener("click", function(){
  autoSpin = !autoSpin;
  if(!autoSpin){
    snapToNearestFace();
  }else{
    targetRotY = rotY;
  }
  syncAutoRotateButton();
  markDirty();
});

btnResetView.addEventListener("click", function(){
  autoSpin = false;
  syncAutoRotateButton();
  setRotationTarget(0);
  markDirty();
});

const resizeObserver = new ResizeObserver(function(){
  applyRendererQuality(true);
  fitCamera();
  markDirty();
});
resizeObserver.observe(vp);
applyRendererQuality(true);
syncAutoRotateButton();

function animate(now){
  requestAnimationFrame(animate);

  const canRender = canRenderNow();
  const frameBudget = !canRender
    ? SLEEP_FRAME_MS
    : hostFocused
      ? FOCUSED_IDLE_FRAME_MS
      : BACKGROUND_IDLE_FRAME_MS;

  if(lastRenderTs && (now - lastRenderTs) < frameBudget && !forceNextRender && !hasRotationMotion()) return;
  lastRenderTs = now;

  const dt = lastFrameTs ? Math.min(0.05, Math.max(0.001, (now - lastFrameTs) / 1000)) : (1 / 60);
  lastFrameTs = now;

  let frameNeedsRender = forceNextRender || applyRendererQuality(false);
  if(!canRender) return;

  if(isDragging){
    targetRotY = rotY;
    frameNeedsRender = true;
  }else if(autoSpin){
    rotY = normalizeAngle(rotY + (0.34 * dt));
    targetRotY = rotY;
    frameNeedsRender = true;
  }else{
    frameNeedsRender = settleRotationTowardTarget(dt) || frameNeedsRender;
  }

  rigGroup.rotation.y = rotY;
  if(!frameNeedsRender) return;

  renderer.render(scene, camera);
  forceNextRender = false;
}

requestAnimationFrame(animate);
})();
</script>
</body>
</html>
