<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>BMS Reformer — Cuboid Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#07090d;overflow:hidden;
  font-family:'Courier New',Courier,monospace;}

#wrap{
  width:100vw;height:100vh;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#canvas-area{
  position:relative;
  width:100%;height:100%;
  border:1.5px solid rgba(60,100,150,0.4);
  border-radius:6px;
  background:#07090d;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
}
#canvas-area:active{cursor:grabbing;}
#canvas-area canvas{position:absolute;top:0;left:0;width:100%;height:100%;}

#chamber-label{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:4px;color:rgba(100,160,220,0.5);
  pointer-events:none;text-transform:uppercase;
}

#hint-bar{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:2px;color:rgba(120,150,180,0.45);
  pointer-events:none;white-space:nowrap;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-area">
    <div id="chamber-label">CHAMBER — REFORMER</div>
    <div id="hint-bar">DRAG TO ROTATE &nbsp;·&nbsp; DOUBLE-CLICK / DOUBLE-TAP TO EXPAND</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function(){
'use strict';

var chamberParam = (function(){
  try{
    var q = new URLSearchParams(window.location.search || "");
    var raw = String(q.get("chamber") || "ab").toLowerCase().trim();
    return raw === "cd" ? "cd" : "ab";
  }catch(e){
    return "ab";
  }
})();
var chamberWalls = chamberParam === "cd" ? ["C", "D"] : ["A", "B"];
var chamberZoneKey = chamberParam === "cd" ? "CD" : "AB";
var chamberLabelEl = document.getElementById("chamber-label");
if(chamberLabelEl){
  chamberLabelEl.textContent = chamberZoneKey + " CHAMBER — REFORMER";
}

function cuboidGetParentApp(){
  try{
    if(window.parent && window.parent !== window && window.parent.location && window.parent.location.origin === window.location.origin){
      return window.parent;
    }
  }catch(e){}
  return null;
}

function cuboidNormalizeBurnerState(raw){
  var s = String(raw == null ? "" : raw).toUpperCase().trim();
  if(s === "O" || s === "N" || s === "B" || s === "C") return s;
  return "C";
}

function cuboidSanitizeBurnerSnapshot(source){
  var walls = ["A", "B", "C", "D"];
  var rowCount = 6;
  var burnerCount = 15;
  var out = {};
  var src = source && typeof source === "object" ? source : {};
  for(var wi=0; wi<walls.length; wi++){
    var wall = walls[wi];
    var srcRows = Array.isArray(src[wall]) ? src[wall] : [];
    out[wall] = [];
    for(var ri=0; ri<rowCount; ri++){
      var srcRow = Array.isArray(srcRows[ri]) ? srcRows[ri] : [];
      var row = [];
      for(var bi=0; bi<burnerCount; bi++){
        row.push(cuboidNormalizeBurnerState(srcRow[bi]));
      }
      out[wall].push(row);
    }
  }
  return out;
}

function cuboidSanitizeTstRow(vals){
  var out = [];
  var src = Array.isArray(vals) ? vals : [];
  for(var i=0; i<15; i++){
    var n = Number(src[i]);
    out.push(isFinite(n) ? n : "");
  }
  return out;
}

function cuboidBuildDefaultBurnerData(){
  var defaultPatterns = [
    ["N","O","N","B","N","O","N","O","B","N","O","N","O","N","O"],
    ["O","N","O","N","O","B","O","N","O","N","B","O","N","O","N"],
    ["B","N","O","N","N","O","N","O","N","O","N","O","B","N","O"],
    ["N","O","B","O","N","O","N","B","O","N","O","N","O","O","N"],
    ["O","N","N","O","B","N","O","N","O","B","N","O","N","N","O"],
    ["N","B","O","N","O","N","O","N","B","O","N","O","N","O","N"]
  ];
  var walls = ["A", "B", "C", "D"];
  var hmData = {};
  for(var wi=0; wi<walls.length; wi++){
    hmData[walls[wi]] = [];
    for(var ri=0; ri<6; ri++){
      hmData[walls[wi]].push(defaultPatterns[(ri + wi) % defaultPatterns.length].slice());
    }
  }
  return hmData;
}

function cuboidHasActiveBurners(hmData){
  if(!hmData || typeof hmData !== "object") return false;
  var walls = ["A", "B", "C", "D"];
  for(var wi=0; wi<walls.length; wi++){
    var rows = hmData[walls[wi]];
    if(!Array.isArray(rows)) continue;
    for(var ri=0; ri<rows.length; ri++){
      var row = rows[ri];
      if(!Array.isArray(row)) continue;
      for(var bi=0; bi<row.length; bi++){
        var s = cuboidNormalizeBurnerState(row[bi]);
        if(s === "O" || s === "N" || s === "B") return true;
      }
    }
  }
  return false;
}

function cuboidLoadBurnerData(){
  var app = cuboidGetParentApp();
  if(app && app._hmRenderSnapshot && app._hmRenderSnapshot.hmData){
    return cuboidSanitizeBurnerSnapshot(app._hmRenderSnapshot.hmData);
  }
  try{
    var raw = localStorage.getItem("burnerData");
    if(raw){
      var parsed = JSON.parse(raw);
      var sanitized = cuboidSanitizeBurnerSnapshot(parsed);
      if(cuboidHasActiveBurners(sanitized)) return sanitized;
    }
  }catch(e){}
  return cuboidBuildDefaultBurnerData();
}

function cuboidGetLocalTempEntries(){
  try{
    var raw = localStorage.getItem("tempDataEntries");
    if(raw){
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }
  }catch(e){}
  return [];
}

function cuboidGetEntrySortStamp(entry){
  if(!entry || typeof entry !== "object") return 0;
  var raw = entry.dt || entry.date || entry.createdAt || entry.created_at || "";
  var t = Date.parse(String(raw || ""));
  return isFinite(t) ? t : 0;
}

function cuboidPickLatestEntry(entries){
  var list = Array.isArray(entries) ? entries.slice() : [];
  if(!list.length) return null;
  list.sort(function(a, b){
    return cuboidGetEntrySortStamp(b) - cuboidGetEntrySortStamp(a);
  });
  return list[0] || null;
}

function cuboidResolvePeepEntry(){
  var app = cuboidGetParentApp();
  if(app && app._hmRenderSnapshot){
    return {
      peepHoles:{
        "ab-bot": cuboidSanitizeTstRow(app._hmRenderSnapshot.abBot || []),
        "ab-top": cuboidSanitizeTstRow(app._hmRenderSnapshot.abTop || []),
        "cd-bot": cuboidSanitizeTstRow(app._hmRenderSnapshot.cdBot || []),
        "cd-top": cuboidSanitizeTstRow(app._hmRenderSnapshot.cdTop || [])
      },
      dt: app._hmRenderSnapshot.entryDt || "Latest",
      selectedShift: app._hmRenderSnapshot.selectedShift || "All"
    };
  }
  return cuboidPickLatestEntry(cuboidGetLocalTempEntries());
}

function cuboidGetPeepRow(entry, key){
  if(!entry || !entry.peepHoles || !entry.peepHoles[key]) return Array(15).fill("");
  return cuboidSanitizeTstRow(entry.peepHoles[key]);
}

function cuboidLoadCleaningLog(){
  try{
    var raw = localStorage.getItem("burnerCleaningLog");
    var parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  }catch(e){
    return {};
  }
}

function cuboidBuildSnapshot(){
  var app = cuboidGetParentApp();
  var entry = cuboidResolvePeepEntry();
  var snapshot = {
    hmData: cuboidLoadBurnerData(),
    abBot: cuboidGetPeepRow(entry, "ab-bot"),
    abTop: cuboidGetPeepRow(entry, "ab-top"),
    cdBot: cuboidGetPeepRow(entry, "cd-bot"),
    cdTop: cuboidGetPeepRow(entry, "cd-top"),
    entryDt: entry && entry.dt ? entry.dt : "Latest",
    selectedShift: entry && entry.selectedShift ? entry.selectedShift : "All"
  };
  if(app && app._hmRenderSnapshot){
    snapshot.entryDt = app._hmRenderSnapshot.entryDt || snapshot.entryDt;
    snapshot.selectedShift = app._hmRenderSnapshot.selectedShift || snapshot.selectedShift;
  }
  return snapshot;
}

function cuboidRoundRectPath(ctx, x, y, w, h, r){
  var rad = Math.max(0, Math.min(Number(r) || 0, Math.min(w, h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
}

function cuboidTempToColor(value){
  var n = Number(value);
  if(!isFinite(n)) return "#64748b";
  var lo = 860;
  var hi = 1000;
  var ratio = (n - lo) / Math.max(1, hi - lo);
  ratio = Math.max(0, Math.min(1, ratio));
  if(ratio < 0.5){
    var g = Math.round(197 + (58 * (ratio / 0.5)));
    return "rgb(34," + g + ",94)";
  }
  var hotRatio = (ratio - 0.5) / 0.5;
  var green = Math.round(215 - (131 * hotRatio));
  return "rgb(251," + green + ",60)";
}

function cuboidGetBurnerPalette(state){
  return {
    O:{flame:"#22c55e", core:"#86efac", inner:"#ecfdf5", stem:"#15803d", glow:"rgba(34,197,94,0.54)"},
    N:{flame:"#f59e0b", core:"#fcd34d", inner:"#fef3c7", stem:"#b45309", glow:"rgba(245,158,11,0.56)"},
    B:{flame:"#3b82f6", core:"#93c5fd", inner:"#dbeafe", stem:"#1d4ed8", glow:"rgba(59,130,246,0.56)"},
    C:{flame:"#4f6b8f", core:"#9fb7d7", inner:"#dbeafe", stem:"#31455f", glow:"rgba(148,163,184,0.26)"}
  }[state] || {flame:"#4f6b8f", core:"#9fb7d7", inner:"#dbeafe", stem:"#31455f", glow:"rgba(148,163,184,0.26)"};
}

function cuboidDrawTipFlameGlow(ctx, x, y, state, phase, scale){
  var s = String(state || "C").toUpperCase();
  if(s !== "O" && s !== "N" && s !== "B") return;
  var palette = cuboidGetBurnerPalette(s);
  var waveA = 0.5 + 0.5 * Math.sin(phase * 1.8);
  var waveB = 0.5 + 0.5 * Math.sin(phase * 2.45 + 1.3);
  var waveC = 0.5 + 0.5 * Math.sin(phase * 2.05 + 2.5);
  var scaleX = scale * 0.88;
  var scaleY = scale * 1.52;

  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.18 + (waveA * 0.15);
  ctx.fillStyle = palette.glow;
  ctx.beginPath();
  ctx.ellipse(x, y - (18 * scaleY), (13 * scaleX) + (waveB * 3.2), (16.4 * scaleY) + (waveA * 5.2), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.11 + (waveC * 0.08);
  ctx.fillStyle = palette.inner;
  ctx.beginPath();
  ctx.ellipse(x, y - (22 * scaleY) - (waveA * 2.2), (2.8 * scaleX) + (waveC * 0.7), (4.8 * scaleY) + (waveB * 1.2), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function cuboidDrawBurnerGlyph(ctx, x, y, state, cleaned, phase, scale){
  var s = String(state || "C").toUpperCase();
  if(s !== "O" && s !== "N" && s !== "B") s = "C";
  var palette = cuboidGetBurnerPalette(s);
  var iconScale = Math.max(1, Number(scale) || 2.7);
  var scaleX = iconScale * 0.9;
  var scaleY = iconScale * 1.55;
  var flicker = 0.94 + (Math.sin(phase * 1.95) * 0.11) + (Math.sin(phase * 2.8 + 0.9) * 0.07);
  var sidePulse = 0.94 + (Math.sin(phase * 2.35 + 0.4) * 0.12);
  var lift = (s === "C") ? 0 : ((2.2 + (Math.sin(phase * 1.75) * 1.35)) * scaleY);
  var stemW = 6.6 * scaleX;
  var stemH = 8.6 * iconScale;
  var stemX = x - (stemW / 2);
  var stemY = y + (0.4 * iconScale);
  var baseW = 18 * scaleX;
  var baseH = 4.8 * iconScale;
  var baseX = x - (baseW / 2);
  var baseY = y + (5.4 * iconScale);

  ctx.fillStyle = "rgba(9,13,24,0.92)";
  cuboidRoundRectPath(ctx, baseX, baseY, baseW, baseH, 3 * iconScale);
  ctx.fill();

  if(s === "C"){
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = palette.glow;
    ctx.beginPath();
    ctx.ellipse(x, y + (2.2 * iconScale), 9.2 * scaleX, 4.2 * iconScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = palette.flame;
    cuboidRoundRectPath(ctx, x - (8.5 * scaleX), y - (1.4 * iconScale), 17 * scaleX, 5.4 * iconScale, 3 * iconScale);
    ctx.fill();
    ctx.lineWidth = Math.max(1.1, 0.75 * iconScale);
    ctx.strokeStyle = "rgba(191,219,254,0.42)";
    ctx.stroke();
    ctx.fillStyle = palette.core;
    cuboidRoundRectPath(ctx, stemX, y + (0.4 * iconScale), stemW, 9.4 * iconScale, 3 * iconScale);
    ctx.fill();
    ctx.lineWidth = Math.max(1, 0.65 * iconScale);
    ctx.strokeStyle = "rgba(226,232,240,0.28)";
    ctx.stroke();
  }else{
    cuboidDrawTipFlameGlow(ctx, x, y, s, phase, iconScale);
    ctx.fillStyle = palette.stem;
    cuboidRoundRectPath(ctx, stemX, stemY, stemW, stemH, 3.2 * iconScale);
    ctx.fill();

    ctx.save();
    ctx.shadowBlur = 11 * iconScale;
    ctx.shadowColor = palette.glow;
    ctx.beginPath();
    ctx.moveTo(x, y - (12.8 * scaleY) - lift);
    ctx.bezierCurveTo(
      x + (11 * scaleX) * flicker,
      y - (6.9 * scaleY) - (lift * 0.52),
      x + (8.2 * scaleX) * sidePulse,
      y + (0.9 * iconScale),
      x,
      y + (2.4 * iconScale)
    );
    ctx.bezierCurveTo(
      x - (8.2 * scaleX) * sidePulse,
      y + (0.9 * iconScale),
      x - (11 * scaleX) * flicker,
      y - (6.9 * scaleY) - (lift * 0.52),
      x,
      y - (12.8 * scaleY) - lift
    );
    ctx.closePath();
    ctx.fillStyle = palette.flame;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(x, y - (8.5 * scaleY) - (lift * 0.46));
    ctx.bezierCurveTo(
      x + (6.5 * scaleX) * sidePulse,
      y - (4.6 * scaleY) - (lift * 0.18),
      x + (4.8 * scaleX) * flicker,
      y + (0.15 * iconScale),
      x,
      y + (1.6 * iconScale)
    );
    ctx.bezierCurveTo(
      x - (4.8 * scaleX) * flicker,
      y + (0.15 * iconScale),
      x - (6.5 * scaleX) * sidePulse,
      y - (4.6 * scaleY) - (lift * 0.18),
      x,
      y - (8.5 * scaleY) - (lift * 0.46)
    );
    ctx.closePath();
    ctx.fillStyle = palette.core;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x, y - (5.6 * scaleY) - (lift * 0.22));
    ctx.bezierCurveTo(
      x + (3.2 * scaleX) * sidePulse,
      y - (3.0 * scaleY) - (lift * 0.1),
      x + (2.4 * scaleX) * flicker,
      y - (0.2 * iconScale),
      x,
      y + (0.8 * iconScale)
    );
    ctx.bezierCurveTo(
      x - (2.4 * scaleX) * flicker,
      y - (0.2 * iconScale),
      x - (3.2 * scaleX) * sidePulse,
      y - (3.0 * scaleY) - (lift * 0.1),
      x,
      y - (5.6 * scaleY) - (lift * 0.22)
    );
    ctx.closePath();
    ctx.fillStyle = palette.inner;
    ctx.fill();
  }

  var dotScale = Math.min(1.4, 0.92 + (iconScale * 0.22));
  var dotX = x + (13 * scaleX);
  var dotY = y - (2 * iconScale);
  var dotR = 3.8 * dotScale;
  ctx.beginPath();
  ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
  ctx.fillStyle = cleaned ? "#4ade80" : "rgba(148,163,184,0.68)";
  ctx.fill();
  ctx.lineWidth = 1.4 * dotScale;
  ctx.strokeStyle = cleaned ? "rgba(187,247,208,0.92)" : "rgba(226,232,240,0.45)";
  ctx.stroke();
}

function cuboidDrawPeepBar(ctx, label, vals, left, centerY, width, scale){
  var k = Math.max(1, Number(scale) || 1);
  var barHeight = Math.round(48 * k);
  var barTop = centerY - (barHeight / 2);
  var slotW = width / 15;
  var labelLeft = Math.round(24 * k);
  var labelW = Math.round(122 * k);
  var labelH = Math.round(54 * k);
  var labelTop = centerY - Math.round(labelH / 2);
  var labelCenterX = labelLeft + Math.round(labelW / 2);
  var positions = [];
  for(var i=0; i<15; i++){
    var n = Number(Array.isArray(vals) ? vals[i] : "");
    if(isFinite(n)){
      positions.push({ idx:i, val:n, x:left + slotW * (i + 0.5) });
    }
  }

  ctx.fillStyle = "rgba(7,12,20,0.96)";
  cuboidRoundRectPath(ctx, labelLeft, labelTop, labelW, labelH, Math.round(13 * k));
  ctx.fill();
  ctx.strokeStyle = "rgba(176,198,228,0.24)";
  ctx.lineWidth = 1.2 * k;
  ctx.stroke();
  ctx.fillStyle = "#f8fafc";
  ctx.font = "700 " + Math.round(26 * k) + "px Times New Roman, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, labelCenterX, centerY);

  ctx.save();
  cuboidRoundRectPath(ctx, left, barTop, width, barHeight, Math.round(13 * k));
  ctx.clip();
  if(positions.length){
    var grad = ctx.createLinearGradient(left, 0, left + width, 0);
    grad.addColorStop(0, cuboidTempToColor(positions[0].val));
    for(var p=0; p<positions.length; p++){
      var stop = (positions[p].idx + 0.5) / 15;
      grad.addColorStop(Math.max(0, Math.min(1, stop)), cuboidTempToColor(positions[p].val));
    }
    grad.addColorStop(1, cuboidTempToColor(positions[positions.length - 1].val));
    ctx.fillStyle = grad;
  }else{
    ctx.fillStyle = "rgba(31,41,55,0.88)";
  }
  ctx.fillRect(left, barTop, width, barHeight);
  var gloss = ctx.createLinearGradient(0, barTop, 0, barTop + (barHeight * 0.55));
  gloss.addColorStop(0, "rgba(255,255,255,0.18)");
  gloss.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gloss;
  ctx.fillRect(left, barTop, width, barHeight);
  ctx.restore();

  ctx.lineWidth = 1.2 * k;
  ctx.strokeStyle = "rgba(255,255,255,0.30)";
  cuboidRoundRectPath(ctx, left, barTop, width, barHeight, Math.round(13 * k));
  ctx.stroke();

  for(var m=0; m<15; m++){
    var mx = left + slotW * (m + 0.5);
    ctx.strokeStyle = "rgba(255,255,255,0.42)";
    ctx.lineWidth = 1.3 * k;
    ctx.beginPath();
    ctx.moveTo(mx, barTop - (4 * k));
    ctx.lineTo(mx, barTop + barHeight + (4 * k));
    ctx.stroke();
    var tempVal = Number(Array.isArray(vals) ? vals[m] : "");
    if(isFinite(tempVal)){
      var markerR = Math.max(5.8, 6.2 * k);
      ctx.beginPath();
      ctx.arc(mx, centerY, markerR, 0, Math.PI * 2);
      ctx.fillStyle = cuboidTempToColor(tempVal);
      ctx.fill();
      ctx.lineWidth = 1.9 * k;
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.stroke();

      var pillW = Math.round(74 * k);
      var pillH = Math.round(30 * k);
      var pillTop = barTop - Math.round(40 * k);
      ctx.fillStyle = "rgba(38,31,25,0.94)";
      cuboidRoundRectPath(ctx, mx - (pillW / 2), pillTop, pillW, pillH, Math.max(7, Math.round(8 * k)));
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 1 * k;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 " + Math.round(20 * k) + "px Times New Roman, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tempVal + "°", mx, pillTop + (pillH / 2));
    }
  }
}

function cuboidPaintWallCanvas(canvas, wallKey, snapshot, cleaningMap, phaseBase){
  if(!canvas || !snapshot || !snapshot.hmData) return;
  var ctx = canvas.getContext("2d");
  var w = canvas.width;
  var h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  var rows = Array.isArray(snapshot.hmData[wallKey]) ? snapshot.hmData[wallKey] : [];
  var topVals = (wallKey === "A" || wallKey === "B") ? (snapshot.abTop || []) : (snapshot.cdTop || []);
  var botVals = (wallKey === "A" || wallKey === "B") ? (snapshot.abBot || []) : (snapshot.cdBot || []);
  var panelInset = 18;
  var padX = 42;
  var titleY = 52;
  var gridLeft = 188;
  var gridRight = w - 46;
  var gridW = gridRight - gridLeft;
  var slotW = gridW / 15;
  var burnerNumY = 128;
  var rowOrder = [6, 5, 4, "PH_TOP", 3, 2, "PH_BOT", 1];
  var overlayStartY = 216;
  var overlayEndY = h - 94;
  var overlayStepY = (overlayEndY - overlayStartY) / Math.max(1, rowOrder.length - 1);
  var itemCenters = rowOrder.map(function(_, idx){ return Math.round(overlayStartY + overlayStepY * idx); });
  var iconScale = 2.7;

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  cuboidRoundRectPath(ctx, panelInset + 10, panelInset + 16, w - (panelInset * 2), h - (panelInset * 2), 28);
  ctx.fill();
  ctx.restore();

  var bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
  bodyGrad.addColorStop(0, "rgba(4,7,13,0.96)");
  bodyGrad.addColorStop(0.55, "rgba(5,8,14,0.93)");

    ctx.fillStyle = "#ffffff";

    var rowData = Array.isArray(rows[item - 1]) ? rows[item - 1] : [];
    for(var ci=0; ci<15; ci++){

      cuboidDrawBurnerGlyph(ctx, burnerX, centerY + 10, state, cleaned, (phaseBase || 0) + (ii * 0.55) + (ci * 0.28), iconScale);
    }
  }
}

   THREE.JS SCENE

var container=document.getElementById('canvas-area');
var W=container.clientWidth, H=container.clientHeight;

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled=false;
renderer.outputEncoding=THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);

/* ── PERSPECTIVE CAMERA — dynamic, fits canvas on every resize ── */
var FOV = 22;
// Compute cuboid dims from current canvas size
// CH is derived so the total height (cuboid + tubes above) fits viewport
// TUBE_OUT is CH*0.12, so total height = CH + CH*0.12 = CH*1.12
// We want CH*1.12 to fill ~88% of viewport height in world units
// CH is set in world units; camera distance auto-calculated to fit both W and H.
// We fix CH=6 as baseline world unit and let camera do the fitting.
// On resize we just update camera aspect — cuboid world size stays constant,
// BUT we also scale the group to fill the canvas.

var FOV_RAD = FOV * Math.PI / 180;

function calcDims(vw, vh){
  var asp = vw / vh;
  var MARGIN = 0.97; // 3% safety margin so nothing clips
  // TUBE_OUT = CH*0.12, so total visual height = CH*1.12
  // Strategy: maximise CW (horizontal length) subject to:
  //   1) total visual height (CH*1.12) fits viewport height
  //   2) CW fits viewport width
  // Both constraints give a max CW — take the minimum of the two.

  // From camera geometry at distance D with FOV:
  //   visible half-height in world = D * tan(FOV/2)
  //   visible half-width  in world = D * tan(hFOV/2) = D * tan(FOV/2) * asp

  // Constraint 1 — height: CH*1.12 <= 2 * D * tan(FOV/2)
  //   Fix D independently — we derive CW from a single camDist.
  //   Let CH drive camDist, then see max CW that fits width at that camDist.
  //   But we want to maximise CW, so start from width constraint instead.

  // Approach: pick camDist so that width fills 97% of viewport.
  // CW = 2 * camDist * tan(hFOV/2) * MARGIN
  // Then derive CH from height constraint:
  // CH = 2 * camDist * tan(FOV/2) * MARGIN / 1.12  (divide by 1.12 for tube headroom)
  // CW / CH = asp  (we want cuboid aspect = viewport aspect for max fill)
  // So: CW = CH * asp, no fixed ratio needed — camera controls fill.

  // Solve: choose camDist so that the taller of (height-constraint, width-constraint)
  // is exactly at MARGIN fill. We want WIDTH to be the binding constraint (maximise CW).
  // camDist from width: CW = 2*D*tan(hFOV/2)*MARGIN → D = CW/(2*tan(hFOV/2)*MARGIN)
  // But CW depends on D — need to fix aspect ratio CW/CH = asp
  // and total_H = CH*1.12.
  // Let CH be free. Then CW = CH*asp.
  // camDist to fit width:  D_w = (CH*asp/2) / (tan(hFOV/2)*MARGIN)
  // camDist to fit height: D_h = (CH*1.12/2) / (tan(FOV/2)*MARGIN)
  // We want D_w <= D_h so width is binding (cuboid as wide as possible).
  // D_w = D_h when: (asp)/(tan(hFOV/2)) = (1.12)/(tan(FOV/2))
  // At wide screens (asp large) D_w > D_h → height becomes binding, width clips.
  // At narrow screens width is binding.
  // Solution: use max(D_w, D_h) — the larger distance ensures BOTH fit.
  // CW is then back-calculated from camDist so it fills width at MARGIN.

  var hFov = 2 * Math.atan(Math.tan(FOV_RAD / 2) * asp);

  // Start with CH=6 (world units), compute both distances
  var CH = 6;
  var CW_try = CH * asp;
  var D_h = (CH * 1.12 / 2) / (Math.tan(FOV_RAD / 2) * MARGIN);
  var D_w = (CW_try / 2) / (Math.tan(hFov / 2) * MARGIN);
  var camDist = Math.max(D_h, D_w);

  // Now back-calculate max CW that fits at this camDist (width binding)
  var maxCW = 2 * camDist * Math.tan(hFov / 2) * MARGIN;
  // And max CH that fits at this camDist (height binding, accounting for tubes)
  var maxCH = 2 * camDist * Math.tan(FOV_RAD / 2) * MARGIN / 1.12;

  // Use actual CH and CW = min(maxCW, maxCH*asp) to guarantee no clipping
  CH = Math.min(CH, maxCH);
  var CW = Math.min(maxCW, CH * asp);
  var CD = CW * 0.18;

  return { CH: CH, CW: CW, CD: CD, camDist: camDist, asp: asp };
}

var dims = calcDims(W, H);
var CH = dims.CH, CW = dims.CW, CD = dims.CD;
var camera = new THREE.PerspectiveCamera(FOV, dims.asp, 0.1, 500);
camera.position.set(0, 0, dims.camDist);
camera.lookAt(0, 0, 0);

/* ── METALLIC CANVAS TEXTURE (procedural) ── */
function makeMetalCanvas(w,h){
  var mc=document.createElement('canvas');
  mc.width=w; mc.height=h;
  var g=mc.getContext('2d');

  /* ── BASE: silver-steel gradient ── */
  var base=g.createLinearGradient(0,0,w,h);
  base.addColorStop(0.00,'#8a9099');
  base.addColorStop(0.15,'#b8bec6');
  base.addColorStop(0.30,'#d4d9df');
  base.addColorStop(0.45,'#c0c6cc');
  base.addColorStop(0.55,'#a8adb4');
  base.addColorStop(0.70,'#bfc5cc');
  base.addColorStop(0.85,'#d0d5da');
  base.addColorStop(1.00,'#909498');
  g.fillStyle=base; g.fillRect(0,0,w,h);

  /* ── BRUSHED HORIZONTAL STREAKS (steel mill finish) ── */
  for(var s=0;s<180;s++){
    var sy=Math.random()*h;
    var sw=40+Math.random()*(w-40);
    var sx=Math.random()*(w-sw);
    var bright=Math.random()<0.5;
    var alpha=0.03+Math.random()*0.09;
    var streak=g.createLinearGradient(sx,0,sx+sw,0);
    var col=bright?'255,255,255':'30,30,40';
    streak.addColorStop(0,'rgba('+col+',0)');
    streak.addColorStop(0.4,'rgba('+col+','+alpha+')');
    streak.addColorStop(0.6,'rgba('+col+','+alpha+')');
    streak.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=streak;
    var th=0.5+Math.random()*1.5;
    g.fillRect(sx,sy,sw,th);
  }

  /* ── PLATE WELD SEAMS ── */
  var seamCols=['rgba(60,55,50,0.55)','rgba(180,175,170,0.3)','rgba(40,38,36,0.4)'];
  // horizontal seams
  var hSeams=[Math.round(h*0.33),Math.round(h*0.66)];
  hSeams.forEach(function(sy){
    // dark groove
    g.strokeStyle='rgba(50,48,45,0.7)'; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(0,sy); g.lineTo(w,sy); g.stroke();
    // weld bead highlight above
    var wg=g.createLinearGradient(0,sy-4,0,sy);
    wg.addColorStop(0,'rgba(220,215,210,0)');
    wg.addColorStop(1,'rgba(220,215,210,0.4)');
    g.fillStyle=wg; g.fillRect(0,sy-4,w,4);
    // shadow below
    var sg=g.createLinearGradient(0,sy,0,sy+5);
    sg.addColorStop(0,'rgba(30,28,25,0.35)');
    sg.addColorStop(1,'rgba(30,28,25,0)');
    g.fillStyle=sg; g.fillRect(0,sy,w,5);
  });
  // vertical seams
  var vSeams=[Math.round(w*0.25),Math.round(w*0.5),Math.round(w*0.75)];
  vSeams.forEach(function(sx){
    g.strokeStyle='rgba(50,48,45,0.6)'; g.lineWidth=2;
    g.beginPath(); g.moveTo(sx,0); g.lineTo(sx,h); g.stroke();
    var wg=g.createLinearGradient(sx,0,sx+4,0);
    wg.addColorStop(0,'rgba(210,205,200,0.3)');
    wg.addColorStop(1,'rgba(210,205,200,0)');
    g.fillStyle=wg; g.fillRect(sx,0,4,h);
  });

  /* ── BOLT HEADS on plate intersections ── */
  var boltPositions=[];
  hSeams.forEach(function(sy){
    vSeams.forEach(function(sx){
      boltPositions.push([sx,sy]);
    });
    // extra bolts along seam
    for(var b=0;b<5;b++){
      boltPositions.push([Math.round(w*(0.1+b*0.18)),sy]);
    }
  });
  boltPositions.forEach(function(bp){
    var bx=bp[0], by=bp[1], br=7;
    // bolt shadow
    g.fillStyle='rgba(20,18,16,0.5)';
    g.beginPath(); g.arc(bx+1,by+1,br,0,Math.PI*2); g.fill();
    // bolt body gradient
    var bg=g.createRadialGradient(bx-2,by-2,1,bx,by,br);
    bg.addColorStop(0,'#e8eaec');
    bg.addColorStop(0.4,'#b0b4b8');
    bg.addColorStop(0.8,'#7a7e82');
    bg.addColorStop(1,'#555860');
    g.fillStyle=bg;
    g.beginPath(); g.arc(bx,by,br,0,Math.PI*2); g.fill();
    // hex nut shape
    g.strokeStyle='rgba(40,38,36,0.6)'; g.lineWidth=1.2;
    g.beginPath();
    for(var i6=0;i6<6;i6++){
      var a6=i6*Math.PI/3-Math.PI/6;
      if(i6===0) g.moveTo(bx+Math.cos(a6)*br*0.72,by+Math.sin(a6)*br*0.72);
      else g.lineTo(bx+Math.cos(a6)*br*0.72,by+Math.sin(a6)*br*0.72);
    }
    g.closePath(); g.stroke();
    // center dot
    g.fillStyle='rgba(30,28,26,0.7)';
    g.beginPath(); g.arc(bx,by,1.5,0,Math.PI*2); g.fill();
  });

  /* ── RUST & AGING SPOTS ── */
  var rustColors=['rgba(120,65,20,0.18)','rgba(95,50,15,0.14)','rgba(140,80,30,0.12)','rgba(80,40,10,0.1)'];
  for(var r=0;r<22;r++){
    var rx=Math.random()*w, ry=Math.random()*h;
    var rsz=4+Math.random()*20;
    var rg=g.createRadialGradient(rx,ry,0,rx,ry,rsz);
    var rc=rustColors[Math.floor(Math.random()*rustColors.length)];
    rg.addColorStop(0,rc);
    rg.addColorStop(0.5,rc.replace(/[\d.]+\)$/,'0.06)'));
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;
    g.beginPath(); g.ellipse(rx,ry,rsz,rsz*0.6,Math.random()*Math.PI,0,Math.PI*2); g.fill();
  }

  /* ── OIL/GRIME STREAKS (vertical, dripping down) ── */
  for(var og=0;og<8;og++){
    var ox=Math.random()*w;
    var oLen=30+Math.random()*120;
    var oy=Math.random()*(h-oLen);
    var oGrad=g.createLinearGradient(0,oy,0,oy+oLen);
    oGrad.addColorStop(0,'rgba(20,18,14,0)');
    oGrad.addColorStop(0.3,'rgba(20,18,14,0.12)');
    oGrad.addColorStop(1,'rgba(20,18,14,0)');
    g.fillStyle=oGrad;
    g.fillRect(ox-1,oy,2+Math.random()*3,oLen);
  }

  /* ── SURFACE DENTS/SCRATCHES ── */
  g.strokeStyle='rgba(40,38,36,0.25)'; g.lineWidth=1;
  for(var sc=0;sc<15;sc++){
    var scx=Math.random()*w, scy=Math.random()*h;
    var scLen=10+Math.random()*60;
    var scAngle=Math.random()*Math.PI;
    g.beginPath();
    g.moveTo(scx,scy);
    g.lineTo(scx+Math.cos(scAngle)*scLen, scy+Math.sin(scAngle)*scLen);
    g.stroke();
    // scratch highlight
    g.strokeStyle='rgba(240,238,235,0.15)'; g.lineWidth=0.5;
    g.beginPath();
    g.moveTo(scx+0.5,scy+0.5);
    g.lineTo(scx+Math.cos(scAngle)*scLen+0.5, scy+Math.sin(scAngle)*scLen+0.5);
    g.stroke();
    g.strokeStyle='rgba(40,38,36,0.25)'; g.lineWidth=1;
  }

  /* ── OVERALL VIGNETTE (darker at edges) ── */
  var vgH=g.createLinearGradient(0,0,w,0);
  vgH.addColorStop(0,'rgba(0,0,0,0.22)');
  vgH.addColorStop(0.1,'rgba(0,0,0,0)');
  vgH.addColorStop(0.9,'rgba(0,0,0,0)');
  vgH.addColorStop(1,'rgba(0,0,0,0.22)');
  g.fillStyle=vgH; g.fillRect(0,0,w,h);
  var vgV=g.createLinearGradient(0,0,0,h);
  vgV.addColorStop(0,'rgba(0,0,0,0.15)');
  vgV.addColorStop(0.08,'rgba(0,0,0,0)');
  vgV.addColorStop(0.92,'rgba(0,0,0,0)');
  vgV.addColorStop(1,'rgba(0,0,0,0.25)');
  g.fillStyle=vgV; g.fillRect(0,0,w,h);

  return mc;
}

function metalTex(){
  var mc=makeMetalCanvas(1024,1024);
  var t=new THREE.CanvasTexture(mc);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(1,1);
  return t;
}

var sideTexMain=metalTex();

/* ═══════════════════════════════════════════════════════════
   CUBOID — single BoxGeometry, multi-material
   face order: px(right), nx(left), py(top), ny(bot), pz(front), nz(back)
   We use a 1×1×1 box scaled to CW×CH×CD so UVs are clean.
═══════════════════════════════════════════════════════════ */

/* Fix UV so texture fills each face correctly */
function fixUV(geo, faceIdx, scaleU, scaleV){
  // BoxGeometry has 6 faces × 2 triangles = 12 tris, 4 verts each group
  // Three.js r134 BoxGeometry uses groups; UV is set at build time — no fixup needed
}

var boxGeo = new THREE.BoxGeometry(CW, CH, CD);

/* Materials indexed: 0=+X(right), 1=-X(left), 2=+Y(top), 3=-Y(bot), 4=+Z(front-A), 5=-Z(back-B) */
/* Box sides are invisible — ShapeGeometry peephole panels render on top */
var matRight  = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.0});
var matLeft   = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.0});
var matTop    = new THREE.MeshBasicMaterial({color:0xaab0b8, map:topTexMain});
var matBot    = new THREE.MeshBasicMaterial({color:0x858a90, map:botTexMain});
var matFront  = new THREE.MeshBasicMaterial({color:0xa8aeb6, map:frontTexMain, side:THREE.DoubleSide});
var matBack   = new THREE.MeshBasicMaterial({color:0xa8aeb6, map:frontTexMain, side:THREE.DoubleSide});

var boxMesh = new THREE.Mesh(boxGeo, [matRight, matLeft, matTop, matBot, matFront, matBack]);
group.add(boxMesh);

function cuboidCreateFaceOverlay(face, wallKey){
  var canvas = document.createElement("canvas");
  canvas.width = 1440;
  canvas.height = 1080;
  var texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  if(typeof texture.colorSpace !== "undefined" && THREE.SRGBColorSpace){
    texture.colorSpace = THREE.SRGBColorSpace;
  }else if(typeof texture.encoding !== "undefined" && THREE.sRGBEncoding){
    texture.encoding = THREE.sRGBEncoding;
  }
  var outerMaterial = new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true,
    side:THREE.FrontSide,
    depthWrite:false,
    alphaTest:0.02,
    polygonOffset:true,
    polygonOffsetFactor:-1,
    polygonOffsetUnits:-2
  });
  var innerMaterial = new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true,
    side:THREE.FrontSide,
    depthTest:true,
    depthWrite:false,
    alphaTest:0.02,
    polygonOffset:true,
    polygonOffsetFactor:-1,
    polygonOffsetUnits:-1
  });
  var planeW = Math.max(0.8, CW - 0.42);
  var planeH = Math.max(0.8, CH - 0.34);
  var outerPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(planeW, planeH),
    outerMaterial
  );
  var innerPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.max(0.8, CW - 0.42), Math.max(0.8, CH - 0.34)),
    innerMaterial
  );
  // Keep the inner data plane close to the same wall face, but far enough
  // inside the chamber to avoid z-fighting with the inner metal wall.
  var innerInset = Math.max(0.035, Math.min(0.06, CD * 0.04));
  if(face === "back"){
    outerPlane.position.set(0, 0, -CD/2 - 0.009);
    outerPlane.rotation.y = Math.PI;
    innerPlane.position.set(0, 0, -CD/2 + innerInset);
    innerPlane.rotation.y = 0;
  }else{
    outerPlane.position.set(0, 0, CD/2 + 0.009);
    innerPlane.position.set(0, 0, CD/2 - innerInset);
    innerPlane.rotation.y = Math.PI;
  }
  outerPlane.renderOrder = 9;
  innerPlane.renderOrder = 12;
  group.add(outerPlane);
  group.add(innerPlane);
  return {
    face:face,
    wallKey:wallKey,
    canvas:canvas,
    texture:texture,
    outerMaterial:outerMaterial,
    innerMaterial:innerMaterial,
    outerMesh:outerPlane,
    innerMesh:innerPlane
  };
}

var cuboidFaceOverlays = {
  front: cuboidCreateFaceOverlay("front", chamberWalls[0]),
  back: cuboidCreateFaceOverlay("back", chamberWalls[1])
};
var cuboidFaceDigest = "";

function cuboidBuildFaceDigest(snapshot, cleaningLog){
  var cleanA = cleaningLog && cleaningLog[chamberWalls[0]] ? cleaningLog[chamberWalls[0]] : {};
  var cleanB = cleaningLog && cleaningLog[chamberWalls[1]] ? cleaningLog[chamberWalls[1]] : {};
  return JSON.stringify({
    chamber: chamberParam,
    entryDt: snapshot && snapshot.entryDt ? snapshot.entryDt : "",
    selectedShift: snapshot && snapshot.selectedShift ? snapshot.selectedShift : "",
    frontRows: snapshot && snapshot.hmData ? snapshot.hmData[chamberWalls[0]] : [],
    backRows: snapshot && snapshot.hmData ? snapshot.hmData[chamberWalls[1]] : [],
    abBot: snapshot ? snapshot.abBot : [],
    abTop: snapshot ? snapshot.abTop : [],
    cdBot: snapshot ? snapshot.cdBot : [],
    cdTop: snapshot ? snapshot.cdTop : [],
    cleanFront: cleanA,
    cleanBack: cleanB
  });
}

function cuboidSyncFaceOverlays(force){
  var snapshot = cuboidBuildSnapshot();
  var cleaningLog = cuboidLoadCleaningLog();
  var nextDigest = cuboidBuildFaceDigest(snapshot, cleaningLog);
  if(!force && nextDigest === cuboidFaceDigest) return;
  cuboidPaintWallCanvas(
    cuboidFaceOverlays.front.canvas,
    chamberWalls[0],
    snapshot,
    cleaningLog[chamberWalls[0]] || {},
    0
  );
  cuboidPaintWallCanvas(
    cuboidFaceOverlays.back.canvas,
    chamberWalls[1],
    snapshot,
    cleaningLog[chamberWalls[1]] || {},
    0.85
  );
  cuboidFaceOverlays.front.texture.needsUpdate = true;
  cuboidFaceOverlays.back.texture.needsUpdate = true;
  cuboidFaceDigest = nextDigest;
}

cuboidSyncFaceOverlays(true);
window.addEventListener("storage", function(){
  setTimeout(function(){ cuboidSyncFaceOverlays(true); }, 0);
});
window.setInterval(function(){
  cuboidSyncFaceOverlays(false);
}, 1200);

/* inner faces removed */

/* ── SIDE FACES WITH SQUARE PEEPHOLES ── */
// Hole size: ~28% of face height, 70% of face width
var HOLE_H=CH*0.16;
var HOLE_W=CD*0.55;
var HOLE_GAP=CH*0.06;   // gap between holes
// Upper hole center Y, lower hole center Y
var HOLE_Y1= CH*0.19;
var HOLE_Y2=-CH*0.19;

function buildSideShape(){
  var s=new THREE.Shape();
  // outer rectangle
  s.moveTo(-CD/2,-CH/2);
  s.lineTo( CD/2,-CH/2);
  s.lineTo( CD/2, CH/2);
  s.lineTo(-CD/2, CH/2);
  s.closePath();
  // hole puncher
  function punchHole(cx,cy,hw,hh){
    var hole=new THREE.Path();
    var r=hw*0.08; // slight corner radius approximated with bezier
    hole.moveTo(cx-hw/2+r, cy-hh/2);
    hole.lineTo(cx+hw/2-r, cy-hh/2);
    hole.quadraticCurveTo(cx+hw/2,cy-hh/2, cx+hw/2,cy-hh/2+r);
    hole.lineTo(cx+hw/2, cy+hh/2-r);
    hole.quadraticCurveTo(cx+hw/2,cy+hh/2, cx+hw/2-r,cy+hh/2);
    hole.lineTo(cx-hw/2+r, cy+hh/2);
    hole.quadraticCurveTo(cx-hw/2,cy+hh/2, cx-hw/2,cy+hh/2-r);
    hole.lineTo(cx-hw/2, cy-hh/2+r);
    hole.quadraticCurveTo(cx-hw/2,cy-hh/2, cx-hw/2+r,cy-hh/2);
    s.holes.push(hole);
  }
  punchHole(0, HOLE_Y1, HOLE_W, HOLE_H);
  punchHole(0, HOLE_Y2, HOLE_W, HOLE_H);
  return s;
}

var sideShape=buildSideShape();
var sideGeo=new THREE.ShapeGeometry(sideShape,6);

var sideMat=new THREE.MeshBasicMaterial({
  color:0xa8aeb6,map:sideTexMain,side:THREE.FrontSide,
});
var sideInnerMat=new THREE.MeshBasicMaterial({
  color:0x000000,side:THREE.FrontSide,
});

/* Right side outer */
var rMesh=new THREE.Mesh(sideGeo,sideMat);
rMesh.rotation.y=Math.PI/2;
rMesh.position.x=CW/2;
group.add(rMesh);
/* Right side inner — black */
var rInner=new THREE.Mesh(sideGeo.clone(),sideInnerMat);
rInner.rotation.y=-Math.PI/2;
rInner.position.x=CW/2-0.01;
group.add(rInner);

/* Left side outer */
var lMesh=new THREE.Mesh(sideGeo.clone(),sideMat);
lMesh.rotation.y=-Math.PI/2;
lMesh.position.x=-CW/2;
group.add(lMesh);
/* Left side inner — black */
var lInner=new THREE.Mesh(sideGeo.clone(),sideInnerMat);
lInner.rotation.y=Math.PI/2;
lInner.position.x=-CW/2+0.01;
group.add(lInner);

/* ── PEEPHOLE FRAME EDGES (bright steel) ── */
function addPeepholeFrames(parentGroup, signX){
  var mat=new THREE.LineBasicMaterial({color:0xb0b8c0,linewidth:1});
  [HOLE_Y1,HOLE_Y2].forEach(function(py){
    var hw=HOLE_W/2,hh=HOLE_H/2,z=0.015*signX;
    var pts=[
      new THREE.Vector3(-hw,-hh,z),new THREE.Vector3(hw,-hh,z),
      new THREE.Vector3(hw,hh,z),new THREE.Vector3(-hw,hh,z),
      new THREE.Vector3(-hw,-hh,z),
    ];
    var line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
    line.position.y=py;
    parentGroup.add(line);
    /* inner frame bevel line */
    var mat2=new THREE.LineBasicMaterial({color:0x707880,linewidth:1});
    var bevel=0.04;
    var pts2=[
      new THREE.Vector3(-hw+bevel,-hh+bevel,z*0.5),
      new THREE.Vector3(hw-bevel,-hh+bevel,z*0.5),
      new THREE.Vector3(hw-bevel,hh-bevel,z*0.5),
      new THREE.Vector3(-hw+bevel,hh-bevel,z*0.5),
      new THREE.Vector3(-hw+bevel,-hh+bevel,z*0.5),
    ];
    var line2=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),mat2);
    line2.position.y=py;
    parentGroup.add(line2);
  });
}

var rFrameG=new THREE.Group();
rFrameG.rotation.y=Math.PI/2; rFrameG.position.x=CW/2;
addPeepholeFrames(rFrameG,1); group.add(rFrameG);

var lFrameG=new THREE.Group();
lFrameG.rotation.y=-Math.PI/2; lFrameG.position.x=-CW/2;
addPeepholeFrames(lFrameG,-1); group.add(lFrameG);

/* ── EDGE REINFORCEMENT BARS ── */
var edgeMat=new THREE.MeshStandardMaterial({color:0x3a3e42,metalness:0.95,roughness:0.2});

function edgeH(len,x,y,z){
  var m=new THREE.Mesh(new THREE.BoxGeometry(len,0.07,0.07),edgeMat);
  m.position.set(x,y,z); return m;
}
function edgeV(len,x,y,z){
  var m=new THREE.Mesh(new THREE.BoxGeometry(0.07,len,0.07),edgeMat);
  m.position.set(x,y,z); return m;
}
function edgeD(len,x,y,z){ // depth edge
  var m=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.07,len),edgeMat);
  m.position.set(x,y,z); return m;
}

// Front face edges
group.add(edgeH(CW+0.07,0,CH/2,CD/2));
group.add(edgeH(CW+0.07,0,-CH/2,CD/2));
group.add(edgeV(CH,CW/2,0,CD/2));
group.add(edgeV(CH,-CW/2,0,CD/2));
// Back face edges
group.add(edgeH(CW+0.07,0,CH/2,-CD/2));
group.add(edgeH(CW+0.07,0,-CH/2,-CD/2));
group.add(edgeV(CH,CW/2,0,-CD/2));
group.add(edgeV(CH,-CW/2,0,-CD/2));
// Depth edges (corners)
group.add(edgeD(CD,CW/2,CH/2,0));
group.add(edgeD(CD,-CW/2,CH/2,0));
group.add(edgeD(CD,CW/2,-CH/2,0));
group.add(edgeD(CD,-CW/2,-CH/2,0));

/* ── TUBES + HEADER ── */
var NUM_TUBES=8;
var TUBE_OUT=CH*0.12;           // tubes poke above top face, header outside
var TUBE_IN =CH*1.0;           // run full interior height to bottom face
var TUBE_TOTAL=TUBE_OUT+TUBE_IN;
var TUBE_R=0.13;               // larger circumference
var tubeGeo=new THREE.CylinderGeometry(TUBE_R,TUBE_R,TUBE_TOTAL,16);
var tubeMat=new THREE.MeshStandardMaterial({color:0x6a7078,metalness:0.9,roughness:0.25});
var flangeGeo=new THREE.CylinderGeometry(TUBE_R*1.8,TUBE_R*1.8,0.07,16);
var flangeMat=new THREE.MeshStandardMaterial({color:0x4a5058,metalness:0.95,roughness:0.18});

var spacing=CW*0.8/(NUM_TUBES-1);
var startX=-CW*0.4;
for(var t=0;t<NUM_TUBES;t++){
  var tx=startX+t*spacing;
  var tubeCenterY = CH/2 + TUBE_OUT - TUBE_TOTAL/2;
  var tube=new THREE.Mesh(tubeGeo,tubeMat);
  tube.position.set(tx, tubeCenterY, 0);
  group.add(tube);
  var flange=new THREE.Mesh(flangeGeo,flangeMat);
  flange.position.set(tx, CH/2, 0);
  group.add(flange);
  var cap=new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R*1.2,TUBE_R*1.2,0.05,16),flangeMat);
  cap.position.set(tx, CH/2+TUBE_OUT, 0);
  group.add(cap);
  var noz=new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R*0.8,TUBE_R*1.2,0.10,16),tubeMat);
  noz.position.set(tx, -CH/2+0.05, 0);
  group.add(noz);
}

/* Header pipe above roof */
var hdrGeo=new THREE.CylinderGeometry(TUBE_R*2.4,TUBE_R*2.4,CW*0.85,16);
var hdrMat=new THREE.MeshStandardMaterial({color:0x58606a,metalness:0.93,roughness:0.2});
var hdr=new THREE.Mesh(hdrGeo,hdrMat);
hdr.rotation.z=Math.PI/2;
hdr.position.set(0, CH/2+TUBE_OUT, 0);
group.add(hdr);

/* Header end caps */
[-CW*0.425,CW*0.425].forEach(function(ex){
  var ec=new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R*2.8,TUBE_R*2.8,0.07,16),flangeMat);
  ec.rotation.z=Math.PI/2;
  ec.position.set(ex, CH/2+TUBE_OUT, 0);
  group.add(ec);
});

/* Expanded-view framing: use the tighter inside-canvas fit only in zoomed mode. */
var fitBounds = new THREE.Box3().setFromObject(group);
var fitCenter = fitBounds.getCenter(new THREE.Vector3());
var fitSize = fitBounds.getSize(new THREE.Vector3());
var fitMaxWidth = Math.sqrt(fitSize.x*fitSize.x + fitSize.z*fitSize.z);
var FIT_PAD = 1.08;

function applyExpandedFrame(nw, nh){
  var aspect = nw / nh;
  var hFov = 2 * Math.atan(Math.tan(FOV_RAD / 2) * aspect);
  var fitHeight = fitSize.y * FIT_PAD;
  var fitWidth = fitMaxWidth * FIT_PAD;
  var distV = (fitHeight / 2) / Math.tan(FOV_RAD / 2);
  var distH = (fitWidth / 2) / Math.tan(hFov / 2);
  var dist = Math.max(distV, distH) + fitSize.z * 0.55;

  camera.aspect = aspect;
  camera.position.set(fitCenter.x, fitCenter.y, dist);
  camera.lookAt(fitCenter.x, fitCenter.y, fitCenter.z);
  camera.updateProjectionMatrix();
}

/* ═══════════════════════════════════════════════════════════
   INTERACTION
═══════════════════════════════════════════════════════════ */
var targetRotY=0, currentRotY=0;
var dragging=false, lastX=0;
var autoSpin=true;
var SPIN_SPEED=0.004;
var lastTapAt=0;
var touchMoved=false;
var overlayExpanded=false;

var cvEl=renderer.domElement;
var hintEl=document.getElementById('hint-bar');

function updateHintBar(){
  if(!hintEl) return;
  hintEl.innerHTML = overlayExpanded
    ? 'DRAG TO ROTATE &nbsp;·&nbsp; DOUBLE-CLICK / DOUBLE-TAP TO RETURN'
    : 'DRAG TO ROTATE &nbsp;·&nbsp; DOUBLE-CLICK / DOUBLE-TAP TO EXPAND';
}

function toggleViewerFullscreen(){
  if(window.parent && window.parent !== window){
    try{ window.parent.postMessage({ type:"cuboid-toggle-overlay" }, "*"); }catch(e){}
    return;
  }
}

function startDrag(x){dragging=true;lastX=x;autoSpin=false;touchMoved=false;}
function moveDrag(x){
  if(!dragging)return;
  if(Math.abs(x-lastX) > 2) touchMoved=true;
  targetRotY+=(x-lastX)*0.009;
  lastX=x;
}
function endDrag(){dragging=false;}

cvEl.addEventListener('mousedown',function(e){startDrag(e.clientX);});
window.addEventListener('mousemove',function(e){moveDrag(e.clientX);});
window.addEventListener('mouseup',endDrag);

cvEl.addEventListener('touchstart',function(e){startDrag(e.touches[0].clientX);e.preventDefault();},{passive:false});
window.addEventListener('touchmove',function(e){moveDrag(e.touches[0].clientX);},{passive:true});
window.addEventListener('touchend',endDrag);

cvEl.addEventListener('dblclick',function(e){
  e.preventDefault();
  toggleViewerFullscreen();
});
cvEl.addEventListener('touchend',function(){
  if(touchMoved){
    lastTapAt = 0;
    return;
  }
  var now = Date.now();
  if(now - lastTapAt < 320){
    toggleViewerFullscreen();
    lastTapAt = 0;
    return;
  }
  lastTapAt = now;
});
window.addEventListener('message', function(ev){
  var data = ev && ev.data ? ev.data : null;
  if(!data || data.type !== "cuboid-overlay-state") return;
  overlayExpanded = !!data.active;
  updateHintBar();
  resizeViewer();
});
updateHintBar();

/* ═══════════════════════════════════════════════════════════
   RESIZE — recalculate camera to always fit cuboid in canvas
═══════════════════════════════════════════════════════════ */
function resizeViewer(){
  var nw = container.clientWidth, nh = container.clientHeight;
  renderer.setSize(nw, nh);
  if(overlayExpanded){
    applyExpandedFrame(nw, nh);
    return;
  }
  var d = calcDims(nw, nh);
  camera.aspect = d.asp;
  camera.position.set(0, 0, d.camDist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeViewer);
document.addEventListener('fullscreenchange', resizeViewer);
document.addEventListener('webkitfullscreenchange', resizeViewer);

/* ═══════════════════════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════════════════════ */
function tick(){
  requestAnimationFrame(tick);
  if(autoSpin) targetRotY+=SPIN_SPEED;
  currentRotY+=(targetRotY-currentRotY)*0.075;
  group.rotation.y=currentRotY;
  renderer.render(scene,camera);
}
tick();

})();
</script>
</body>
</html>
