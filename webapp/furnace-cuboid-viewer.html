function buildFlameGeo(len,br){
  const prof=[[0,0],[br*0.45,len*0.03],[br*1.0,len*0.12],[br*1.0,len*0.22],[br*0.68,len*0.38],[br*0.58,len*0.45],[br*0.72,len*0.55],[br*0.88,len*0.63],[br*0.58,len*0.81],[br*0.10,len*0.97],[0,len]];
  const rs=14,pos=[],nor=[],uvs=[],idx=[];
  const s=prof.length-1;
  for(let r=0;r<prof.length;r++){
    const rad=prof[r][0];
    const z=prof[r][1];
    for(let a=0;a<=rs;a++){
      const an=a/rs*Math.PI*2,px=rad*Math.cos(an),py=rad*Math.sin(an);
      pos.push(px,py,z);
      const dr=r<s ? prof[r+1][0]-rad : rad-(prof[r-1]||prof[0])[0];
      const dz=r<s ? prof[r+1][1]-z : z-(prof[r-1]||prof[0])[1];
      const ln=Math.sqrt(dz*dz+dr*dr)||1;
      nor.push(Math.cos(an)*dz/ln,Math.sin(an)*dz/ln,-dr/ln);
      uvs.push(a/rs,r/s);
    }
  }
  const st=rs+1;
  for(let r=0;r<s;r++){
    for(let a=0;a<rs;a++){
      const a0=r*st+a,a1=a0+1,b0=a0+st,b1=b0+1;
      idx.push(a0,b0,a1,a1,b0,b1);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);
  return g;
}

function addBurners(fz,fdir){
  const sx=FW/(COLS+1),sy=FH/(ROWS+1),fl=FD*0.31,fb=0.062;
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<COLS;col++){
      const x=-FW/2+sx*(col+1),y=-FH/2+sy*(row+1),ft=FLAMES[row][col];
      const cm=new THREE.Mesh(new THREE.CircleGeometry(0.10,18),new THREE.MeshStandardMaterial({color:ft ? 0x281a10 : 0x111111,roughness:0.35,metalness:0.92,emissive:ft ? (ft===1 ? 0x1a0800 : ft===2 ? 0x00091a : 0x141000) : 0,emissiveIntensity:ft ? 0.7 : 0,side:THREE.FrontSide}));
      cm.position.set(x,y,fz);
      cm.rotation.y=fdir>0 ? 0 : Math.PI;
      group.add(cm);
      const rm=new THREE.Mesh(new THREE.RingGeometry(0.08,0.115,18),new THREE.MeshStandardMaterial({color:0x3a4858,roughness:0.25,metalness:0.97,side:THREE.DoubleSide}));
      rm.position.set(x,y,fz+(fdir>0 ? 0.002 : -0.002));
      rm.rotation.y=fdir>0 ? 0 : Math.PI;
      group.add(rm);
      if(!ft) continue;
      const P={1:{oC:0xcc3300,oE:0xff4400,mC:0xff8800,mE:0xffaa00,cC:0xffee88,cE:0xffffff},2:{oC:0x1133aa,oE:0x2255ff,mC:0x3388ff,mE:0x88ccff,cC:0xcceeff,cE:0xffffff},3:{oC:0xaa6600,oE:0xffcc00,mC:0xffdd00,mE:0xffee88,cC:0xffffff,cE:0xffffff}}[ft];
      const fg2=new THREE.Group();
      fg2.position.set(x,y,fz);
      if(fdir<0) fg2.rotation.y=Math.PI;
      group.add(fg2);
      const make=function(g,oi,side,op){
        return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:oi[0],emissive:oi[1],emissiveIntensity:2.2,roughness:1,metalness:0,transparent:true,opacity:op,side:side,depthWrite:false,blending:THREE.AdditiveBlending}));
      };
      const om=make(buildFlameGeo(fl,fb),[P.oC,P.oE],THREE.BackSide,0.42);
      const mm=make(buildFlameGeo(fl*0.75,fb*0.62),[P.mC,P.mE],THREE.FrontSide,0.58);
      const cm2=make(buildFlameGeo(fl*0.48,fb*0.38),[P.cC,P.cE],THREE.FrontSide,0.88);
      fg2.add(om,mm,cm2);
      flameGroups.push({ fg2:fg2, om:om, mm:mm, cm2:cm2, seed:(row*COLS+col)*1.618+fz*7.3 });
    }
  }
}
addBurners(FD/2-0.015,-1);
addBurners(-FD/2+0.015,1);

const DRAG_ROTATION_SPAN=Math.PI*1.5;
const SPRING_STIFFNESS=30;
const SPRING_DAMPING=13.4;
const AUTO_ROTATE_SPEED=0.34;
const AUTO_ROTATE_RAMP=5.2;
const MAX_DRAG_DELTA=42;
const TAP_MOVE_TOLERANCE=10;
const FACE_STEP=Math.PI/2;
const FACE_ADVANCE_THRESHOLD=FACE_STEP*0.34;
const ACTIVE_FRAME_MS=16;
const FOCUSED_IDLE_FRAME_MS=cuboidIsChromeLike ? 20 : 16;
const BACKGROUND_IDLE_FRAME_MS=cuboidIsChromeLike ? 185 : 110;
const SLEEP_FRAME_MS=420;
const ACTIVE_OVERLAY_TICK_MS=84;
const FOCUSED_OVERLAY_TICK_MS=cuboidIsChromeLike ? 150 : 110;
const BACKGROUND_OVERLAY_TICK_MS=cuboidIsChromeLike ? 760 : 420;
const ACTIVE_FLAME_TICK_MS=16;
const BACKGROUND_FLAME_TICK_MS=cuboidIsChromeLike ? 160 : 120;

let rotY=0,targetRotY=0,springVelocity=0,autoSpin=false;
let activePointerId=null,isDragging=false,lastX=0,dragDistance=0;
let touchMoved=false,lastTapAt=0,lastFrameTs=0,autoSpinMix=0;
let lastFlameUpdateAt=0;
let dragStartRotY=0;

function normalizeAngle(angle){
  let a=angle;
  const tau=Math.PI*2;
  while(a<=-Math.PI) a+=tau;
  while(a>Math.PI) a-=tau;
  return a;
}

function shortestAngleDelta(fromAngle,toAngle){
  let delta=normalizeAngle(toAngle)-normalizeAngle(fromAngle);
  if(delta>Math.PI) delta-=Math.PI*2;
  if(delta<-Math.PI) delta+=Math.PI*2;
  return delta;
}

function setRotationTarget(targetAngle){
  targetRotY=rotY+shortestAngleDelta(rotY,targetAngle);
  springVelocity*=0.18;
}

function startDrag(clientX){
  isDragging=true;
  lastX=clientX;
  targetRotY=rotY;
  springVelocity=0;
  dragStartRotY=rotY;
  dragDistance=0;
  touchMoved=false;
}

function moveDrag(clientX){
  if(!isDragging) return;
  const rawDx=clientX-lastX;
  const dx=Math.max(-MAX_DRAG_DELTA,Math.min(MAX_DRAG_DELTA,rawDx));
  dragDistance+=Math.abs(rawDx);
  if(Math.abs(rawDx)>2) touchMoved=true;
  const width=Math.max(320,GW());
  const deltaRot=(dx/width)*DRAG_ROTATION_SPAN;
  rotY+=deltaRot;
  targetRotY=rotY;
  springVelocity=0;
  lastX=clientX;
}

function stopDrag(){
  if(!isDragging) return;
  isDragging=false;
  const dragRot=rotY-dragStartRotY;
  const startFace=Math.round(normalizeAngle(dragStartRotY)/FACE_STEP)*FACE_STEP;
  if(Math.abs(dragRot)>=FACE_ADVANCE_THRESHOLD){
    setRotationTarget(startFace+(dragRot>0 ? FACE_STEP : -FACE_STEP));
  }else{
    snapToNearestFace();
  }
  springVelocity=0;
}

function snapToNearestFace(){
  const snapped=Math.round(normalizeAngle(rotY)/FACE_STEP)*FACE_STEP;
  setRotationTarget(snapped);
}

vp.addEventListener("pointerdown",function(e){
  activePointerId=e.pointerId;
  if(vp.setPointerCapture) vp.setPointerCapture(e.pointerId);
  startDrag(e.clientX);
});
vp.addEventListener("pointermove",function(e){
  if(activePointerId!==e.pointerId) return;
  moveDrag(e.clientX);
});
function endPointerGesture(e){
  if(activePointerId!==e.pointerId) return;
  if(vp.releasePointerCapture){
    try{ vp.releasePointerCapture(e.pointerId); }catch(_e){}
  }
  activePointerId=null;
  const wasTapCandidate=dragDistance<=TAP_MOVE_TOLERANCE && !touchMoved;
  stopDrag();
  if(!wasTapCandidate){
    lastTapAt=0;
    return;
  }
  const now=Date.now();
  if(now-lastTapAt<320){
    cuboidToggleFullscreen();
    lastTapAt=0;
    return;
  }
  lastTapAt=now;
}
vp.addEventListener("pointerup",endPointerGesture);
vp.addEventListener("pointercancel",endPointerGesture);

vp.addEventListener("dblclick",function(e){
  e.preventDefault();
  cuboidToggleFullscreen();
});

btnA.addEventListener("click",function(){ setRotationTarget(0); });
btnB.addEventListener("click",function(){ setRotationTarget(Math.PI); });
btnAuto.addEventListener("click",function(){
  autoSpin=!autoSpin;
  this.textContent=autoSpin ? "Stop" : "Auto Rotate";
});
btnResetView.addEventListener("click",function(){
  resetFrontView();
});

const ro=new ResizeObserver(function(){
  cuboidApplyRendererQuality(true);
  fitCamera();
});
ro.observe(vp);
cuboidApplyRendererQuality(true);

function animate(t){
  requestAnimationFrame(animate);
  const canRender=cuboidCanRenderNow();
  const interactionActive=isDragging || autoSpin || cuboidIsFullscreen();
  const targetFrameMs=canRender
    ? (interactionActive ? ACTIVE_FRAME_MS : (hostFocused ? FOCUSED_IDLE_FRAME_MS : BACKGROUND_IDLE_FRAME_MS))
    : SLEEP_FRAME_MS;
  if(lastRenderTs && (t-lastRenderTs)<targetFrameMs) return;
  lastRenderTs=t;
  const dt=lastFrameTs ? Math.min(0.05,Math.max(0.001,(t-lastFrameTs)/1000)) : (1/60);
  lastFrameTs=t;
  cuboidApplyRendererQuality(false);

  if(!canRender){
    if(refreshOverlayData(false)){
      syncFaceOverlays(false);
    }
    return;
  }

  const targetAutoMix=(autoSpin && !isDragging) ? 1 : 0;
  autoSpinMix+=(targetAutoMix-autoSpinMix)*(1-Math.exp(-AUTO_ROTATE_RAMP*dt));
  if(autoSpinMix>0.0001){
    targetRotY+=AUTO_ROTATE_SPEED*autoSpinMix*dt;
  }

  if(isDragging){
    targetRotY=rotY;
    springVelocity=0;
  }else{
    springVelocity+=(targetRotY-rotY)*SPRING_STIFFNESS*dt;
    springVelocity*=Math.exp(-SPRING_DAMPING*dt);
    rotY+=springVelocity*dt;
    if(Math.abs(targetRotY-rotY)<0.00008 && Math.abs(springVelocity)<0.00008){
      rotY=targetRotY;
      springVelocity=0;
    }
  }

  rigGroup.rotation.y=rotY;
  group.rotation.x=0;
  group.rotation.z=0;
  innerL.intensity=1.0+0.4*Math.sin(t*0.007)+0.15*Math.sin(t*0.013);
  const ts=t*0.001;
  const overlayTickMs=interactionActive ? ACTIVE_OVERLAY_TICK_MS : (hostFocused ? FOCUSED_OVERLAY_TICK_MS : BACKGROUND_OVERLAY_TICK_MS);
  if(overlayDirty || (t-lastOverlayPaintAt)>=overlayTickMs){
    overlayAnimPhase=(overlayAnimPhase+OVERLAY_PHASE_STEP)%(Math.PI*2);
    syncFaceOverlays(false);
    lastOverlayPaintAt=t;
  }
  if(!lastFlameUpdateAt || (t-lastFlameUpdateAt)>=(interactionActive ? ACTIVE_FLAME_TICK_MS : BACKGROUND_FLAME_TICK_MS)){
    flameGroups.forEach(function(f){
      const s=f.seed;
      const flk=0.86+0.16*Math.sin(ts*2.3+s)+0.07*Math.sin(ts*5.1+s*1.4);
      f.om.scale.set(flk,flk,0.88+0.14*Math.sin(ts*1.9+s*0.7));
      f.om.material.opacity=0.30+0.16*Math.sin(ts*3.2+s);
      f.mm.scale.set(0.9+0.1*flk,0.9+0.1*flk,0.88+0.15*Math.sin(ts*3.1+s));
      f.mm.material.opacity=0.45+0.18*Math.sin(ts*4.3+s*1.3);
      f.cm2.scale.set(0.92+0.08*flk,0.92+0.08*flk,0.90+0.12*Math.sin(ts*4.2+s));
      f.cm2.material.opacity=0.68+0.22*Math.sin(ts*6.1+s*0.8);
    });
    lastFlameUpdateAt=t;
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
